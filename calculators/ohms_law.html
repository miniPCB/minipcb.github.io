<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Solve Ohm’s law and analyze editable series and parallel resistor networks.">
  <title>Ohm’s Law Calculator | miniPCB</title>
  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="stylesheet" href="ohms_law.css">
  <script src="../js/calculator-memory.js?v=20261120-adapter" defer></script>
  <script src="../js/circuit-image-export.js" defer></script>
  <script src="../js/resistor-parts.js" defer></script>
  <script src="../js/ohms-law.js" defer></script>
</head>
<body>
  <nav id="toolNav" class="tool-nav" aria-label="Tool navigation">
    <a href="../tools.html">Tools</a><span aria-hidden="true">/</span><span aria-current="page">Ohm’s Law</span>
    <div class="exports">
      <button id="ltspiceDownload" type="button" aria-label="Download LTspice schematic">LTspice ↓</button>
      <button id="markdownDownload" type="button" aria-label="Download Markdown report">Markdown ↓</button>
    </div>
  </nav>

  <main id="calculatorWorkspace" class="page">
    <div class="workbench">
      <nav class="mode-picker" aria-label="Solve for">
        <button class="mode-choice" type="button" data-mode="current" aria-pressed="true" aria-controls="schematic" title="Calculate current with a voltage source"><strong>Find Current</strong><span>Given V, R</span></button>
        <button class="mode-choice" type="button" data-mode="voltage" aria-pressed="false" aria-controls="schematic" title="Calculate load voltage with a current source" disabled><strong>Find Voltage</strong><span>Given I, R</span></button>
        <button class="mode-choice" type="button" data-mode="resistance" aria-pressed="false" aria-controls="schematic" title="Scale the resistor values proportionally to reach a target current at the source voltage"><strong>Find Resistance</strong><span>Given V, I</span></button>
      </nav>

      <section class="diagram" aria-label="Circuit workspace">
        <div class="diagram-tools">
          <button id="viewToggle" type="button" aria-controls="schematicViewport" aria-pressed="false" hidden>Desktop view</button>
        </div>
        <div id="schematicViewport" class="schematic-viewport" aria-label="Circuit schematic" role="region">
          <svg id="schematic" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Editable DC circuit"></svg>
          <form id="titleEditor" class="schematic-title-editor" aria-label="Edit circuit title" hidden>
            <input id="titleInput" type="text" aria-label="Circuit title" autocomplete="off">
            <button type="submit" aria-label="Apply title">✓</button>
          </form>
        </div>
        <p id="calculationStatus" class="notice" role="status" hidden></p>
        <p id="exportStatus" class="notice" role="status" hidden></p>
      </section>
    </div>

    <div id="circuitFields" hidden inert>
      <div id="voltageField">
        <label for="voltage">Supply voltage</label>
        <input id="voltage" type="text"><select id="voltageUnit" aria-label="Voltage unit"></select>
      </div>
      <div id="currentField" hidden>
        <label for="current">Circuit current</label>
        <input id="current" type="text"><select id="currentUnit" aria-label="Current unit"></select>
      </div>
      <div id="sourceEditor" hidden>
        <label for="sourceSelect">Selected source</label><select id="sourceSelect"></select>
        <label id="addedSourceLabel" for="addedSource">Source value</label>
        <input id="addedSource" type="text"><select id="addedSourceUnit" aria-label="Source unit"></select>
      </div>
      <label for="partSelect">Selected resistor</label><select id="partSelect"></select>
      <div id="resistanceField"><label for="resistance">Resistance</label><input id="resistance" type="text"><select id="resistanceUnit" aria-label="Resistance unit"></select></div>
      <label for="tolerance">Tolerance (%)</label><input id="tolerance" type="number" min="0" max="100" step="any">
      <label for="partPackage">Package</label><select id="partPackage"></select>
    </div>

    <details id="calculatorMemory" class="calculator-memory" hidden>
      <summary class="edge-tab" aria-controls="memoryBody" aria-haspopup="menu" title="Memory actions: right-click, Shift+F10 or long press">
        <svg class="memory-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        <span>Memory</span><span id="memoryCount">0</span>
      </summary>
      <div id="memoryBody" class="memory-body" role="region" aria-labelledby="memoryHeading">
        <header class="drawer-header"><h2 id="memoryHeading">Memory</h2><button id="memoryClose" class="close" type="button" aria-label="Close calculation memory">×</button></header>
        <p id="memoryStatus" class="memory-status" role="status"></p>
        <ol id="memoryList" class="memory-list" aria-label="Saved calculations"></ol>
      </div>
      <div id="memoryResize" role="separator" tabindex="0" aria-label="Memory pane width" aria-orientation="vertical" aria-controls="calculatorMemory" aria-valuemin="220" aria-valuemax="520" aria-valuenow="300"></div>
    </details>
  </main>

  <button id="characteristicsToggle" class="edge-tab characteristics-tab" type="button" aria-expanded="false" aria-controls="characteristicsDrawer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    <span>Circuit characteristics</span>
  </button>
  <aside id="characteristicsDrawer" class="characteristics-drawer" aria-labelledby="characteristicsHeading" aria-hidden="true" inert>
    <header class="drawer-header">
      <h2 id="characteristicsHeading">Circuit characteristics</h2>
      <button id="copyCharacteristics" type="button" aria-label="Copy characteristics for Excel">Copy</button>
      <button id="characteristicsClose" class="close" type="button" aria-label="Close circuit characteristics">×</button>
    </header>
    <div class="characteristics-scroll" tabindex="0" role="region" aria-label="Circuit measurements">
      <p id="copyStatus" class="sr-only" role="status"></p>
      <textarea id="copyFallback" aria-label="Circuit characteristics to copy" rows="6" readonly hidden></textarea>
      <table id="characteristicsTable" aria-label="Circuit totals and ranges"><tbody></tbody></table>
      <div id="partCharacteristics"></div>
    </div>
  </aside>

  <div id="constructionMenu" class="construction-menu" role="menu" aria-labelledby="constructionTarget" hidden>
    <p id="constructionTarget"></p>
    <button type="button" role="menuitem" data-connect="series">Add resistor in series</button>
    <button type="button" role="menuitem" data-connect="parallel">Add resistor in parallel</button>
    <button type="button" role="menuitem" data-change-source="voltage" hidden>Change to Voltage Source</button>
    <button type="button" role="menuitem" data-change-source="current" hidden>Change to Current Source</button>
    <button id="removePart" type="button" role="menuitem" data-component-action="resistor" hidden>Remove resistor</button>
    <button id="removeSource" type="button" role="menuitem" data-component-action="source" hidden>Remove source</button>
  </div>
  <dialog id="frameExportDialog" class="frame-export-dialog" aria-labelledby="frameExportHeading" aria-describedby="frameExportTitle">
    <div class="frame-export-header"><img class="frame-export-brand" src="../logo.png" width="132" height="42" alt="miniPCB" /><button id="frameExportClose" class="frame-export-close" type="button" aria-label="Close download formats">×</button></div>
    <h2 id="frameExportHeading">Download circuit</h2>
    <p id="frameExportTitle" class="frame-export-title"></p>
    <div class="frame-export-formats" aria-label="Image formats">
      <button type="button" class="frame-export-format" data-frame-format="svg" style="--format-color:#54d2ff" aria-label="Download framed circuit as SVG">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 35C7 9 41 39 41 13M7 35 7 13M41 13v22"/><path d="M4 10h6v6H4zm34 22h6v6h-6z" fill="currentColor"/><circle cx="7" cy="35" r="4" fill="#172a39"/><circle cx="41" cy="13" r="4" fill="#172a39"/></svg>
        <strong>SVG</strong><small>Vector</small>
      </button>
      <button type="button" class="frame-export-format" data-frame-format="png" style="--format-color:#6ee7ac" aria-label="Download framed circuit as PNG">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="36" height="36" rx="5"/><path d="m7 34 12-13 9 10 6-6 8 9"/><circle cx="32" cy="15" r="3"/></svg>
        <strong>PNG</strong><small>Lossless image</small>
      </button>
      <button type="button" class="frame-export-format" data-frame-format="jpeg" style="--format-color:#ffba52" aria-label="Download framed circuit as JPEG">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="36" height="36" rx="5"/><path d="m7 35 9-9 8 7 10-14 8 12M14 13h8m-8 5h5"/></svg>
        <strong>JPEG</strong><small>Compact image</small>
      </button>
      <button type="button" class="frame-export-format" data-frame-format="bmp" style="--format-color:#d0acff" aria-label="Download framed circuit as BMP">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="36" height="36" rx="5"/><path d="M18 6v36M30 6v36M6 18h36M6 30h36"/><path d="M18 18h12v12H18zM30 30h11v11H30z" fill="currentColor" opacity=".5"/></svg>
        <strong>BMP</strong><small>Bitmap</small>
      </button>
    </div>
    <p id="frameExportStatus" class="hint" role="status" hidden></p>
  </dialog>
  <dialog id="annotationEditor" aria-labelledby="annotationHeading">
    <form id="annotationForm">
      <h2 id="annotationHeading"></h2>
      <div class="field"><label for="annotationInput">Text</label><input id="annotationInput" type="text" autocomplete="off" autofocus></div>
      <div class="annotation-actions">
        <button id="annotationCancel" type="button">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="calculatedResistanceDialog" aria-labelledby="calculatedResistanceHeading" aria-describedby="calculatedResistanceHelp">
    <h2 id="calculatedResistanceHeading">Use this resistance?</h2>
    <p id="calculatedResistanceHelp"></p>
    <div class="annotation-actions resistance-actions">
      <button id="applyCalculatedResistance" type="button" autofocus>Recalculate current</button>
      <button id="calculatedResistanceCancel" type="button">Cancel</button>
    </div>
  </dialog>

  <dialog id="toleranceDialog" aria-labelledby="toleranceHeading">
    <form id="toleranceForm" class="field">
      <h2 id="toleranceHeading">Custom tolerance</h2>
      <label for="customTolerance">Tolerance (%)</label>
      <input id="customTolerance" type="number" min="0" step="any" required autofocus>
      <div class="annotation-actions">
        <button id="toleranceCancel" type="button">Cancel</button>
        <button type="submit">Apply</button>
      </div>
    </form>
  </dialog>

  <div id="memoryMenu" class="memory-menu" role="menu" aria-label="Memory actions" hidden>
    <p id="memoryMenuInfo" hidden></p>
    <button type="button" role="menuitem" data-memory-action="restore">Restore calculation</button>
    <button type="button" role="menuitem" data-memory-action="rename">Rename</button>
    <button id="memorySave" type="button" role="menuitem" data-memory-action="save">Save now</button>
    <button id="memoryAuto" type="button" role="menuitemcheckbox" aria-checked="true" data-memory-action="auto">Autosave</button>
    <button type="button" role="menuitem" data-memory-action="delete">Delete calculation</button>
    <button id="memoryClear" type="button" role="menuitem" data-memory-action="clear">Clear memory</button>
  </div>
  <noscript><p class="notice">Enable JavaScript to edit and calculate this circuit.</p></noscript>
</body>
</html>
