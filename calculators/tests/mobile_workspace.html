<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile calculator checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:390px;height:1600px;border:0}</style></head><body><h1>Compact mobile workspace and desktop switch</h1><pre id="results">RUNNING</pre><iframe id="calculator" title="Calculator under test" src="../voltage_divider.html?mobile-test=1"></iframe><script>
"use strict";
const checks=[],failures=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label)},pause=()=>new Promise(resolve=>setTimeout(resolve,30));
document.getElementById('calculator').addEventListener('load',async event=>{try{
 const frame=event.target,w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),svg=()=>get('liveSchematic'),state=()=>w.eval('schematicState'),errors=[];
 w.addEventListener('error',event=>errors.push(event.message));assert(await w.resistorCatalogReady,'Catalogs load');await w.circuitLogoReady;await w.calculatorBuildReady;
 const initialEnvironment=w.eval('JSON.stringify(environmentSettings)');
 w.eval('schematicDesktopView=false;renderSchematic()');
 const set=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new w.Event('input',{bubbles:true}))},pick=mode=>{get('mobileSolveMode').value=mode;get('mobileSolveMode').dispatchEvent(new w.Event('change',{bubbles:true}))};
 const reset=async()=>{w.closeSchematicEditor(false);get('dividerForm').reset();get('pairForm').reset();w.eval('mobileConditionsExpanded=false;mobileAnalysisExpanded=false;renderSchematic()');await pause()};
 const node=(key,focus='value')=>svg().querySelector(`[data-schematic-edit="${key}"][data-edit-focus="${focus}"]`),inline=()=>svg().querySelector('[data-inline-editor]');
 const open=(key,focus='value')=>node(key,focus).dispatchEvent(new w.MouseEvent('click',{bubbles:true})),type=text=>{const input=inline().querySelector('input');input.value=text;input.dispatchEvent(new w.Event('input',{bubbles:true}))},enter=()=>inline().querySelector('input').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
 assert(svg().dataset.layout==='mobile'&&get('mobileSolveMode').options.length===5&&get('schematicViewToggle').textContent==='Desktop view','Phones start with the compact schematic, native mode selector and desktop switch');
 assert(svg().querySelector('[data-mobile-overview]')&&!svg().querySelector('[data-mobile-conditions]').getBoundingClientRect().height&&!svg().querySelector('[data-mobile-analysis]').getBoundingClientRect().height,'Conditions, detailed results and BOM start collapsed while the circuit remains visible');
 assert(!svg().querySelector('[data-resistor-stress]')&&svg().querySelectorAll('[data-part-control]').length===6,'Primary resistor cards retain value, tolerance and package while hiding small stress text');
 for(const width of [320,360,390,600,768])for(const mode of ['vout','vin','r1','r2','pairs']){
  frame.style.width=width+'px';await pause();await reset();pick(mode);
  const bounds=svg().getBoundingClientRect(),controls=[...svg().querySelectorAll('[data-part-control],.schematic-field[data-schematic-edit]')].filter(node=>node.getBoundingClientRect().height);
  assert(svg().dataset.layout==='mobile'&&d.documentElement.scrollWidth<=width&&bounds.width<=get('schematicViewport').clientWidth,width+'/'+mode+': circuit and native controls fit without sideways scrolling');
  assert(controls.every(control=>{const box=control.getBoundingClientRect();return box.left>=bounds.left&&box.right<=bounds.right+1&&box.height>=43.9}),width+'/'+mode+': resistor and voltage controls have full-size touch targets');
  assert(!!get('schematicDesignSearch')===(mode==='pairs'),width+'/'+mode+': solution search only appears in supported modes');
 }
 frame.style.width='390px';await pause();await reset();
 open('source');assert(inline(),'VTOP inline editor opens: '+errors.join('; '));type('15');enter();assert(state().circuit.vin===15&&svg().dataset.layout==='mobile','VTOP edits inline on the phone');
 open('r1');type('4.99');const unit=inline().querySelector('select.resistance-unit');unit.value='1000';unit.dispatchEvent(new w.Event('change',{bubbles:true}));
 const overlay=inline().getBoundingClientRect(),viewport=svg().getBoundingClientRect();assert(overlay.left>=viewport.left&&overlay.right<=viewport.right+1&&inline().querySelector('input').getBoundingClientRect().height>=44,'Text input, unit dropdown and nearest-value list fit the mobile overlay');enter();assert(state().physical.r1[0].resistance===4990,'Value and multiplier apply the intended resistance');
 open('r1','power');let select=inline().querySelector('select');select.value='0402';select.dispatchEvent(new w.Event('change',{bubbles:true}));open('r1','tolerance');select=inline().querySelector('select');select.value='0.5';select.dispatchEvent(new w.Event('change',{bubbles:true}));assert(w.resistorFootprint(state().physical.r1[0])==='0402'&&state().physical.r1[0].tolerance===.5,'Native package and tolerance selection update the same physical resistor');
 svg().querySelector('[data-mobile-part-menu]').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));assert(!get('resistorMenu').hidden,'Touch construction menu opens without a right click');get('resistorMenu').querySelector('[data-resistor-action="series"]').click();assert(state().physical.r1.length===2&&inline(),'Adding a series resistor immediately opens its value');type('10k');enter();
 const ids=state().physical.r1.map(part=>part.id);svg().querySelector(`[data-schematic-symbol="${ids[1]}"] [data-mobile-part-menu]`).dispatchEvent(new w.MouseEvent('click',{bubbles:true}));get('resistorMenu').querySelector('[data-resistor-action="parallel"]').click();w.closeSchematicEditor(false);assert(state().physical.r1.length===3&&typeof state().networks.r1.connection==='object','The same touch menu supports nested series/parallel networks');
 const settings=JSON.stringify(w.workFormValues(get('dividerForm'))),topology=JSON.stringify(w.armTopology('r1'));get('schematicViewToggle').click();
 assert(svg().dataset.layout==='desktop'&&svg().querySelectorAll('[data-resistor-core]').length===4&&svg().querySelector('[data-resistor-stress]')&&get('schematicViewToggle').textContent==='Mobile view','Desktop switch restores every physical symbol and full stress information');get('schematicViewToggle').click();
 assert(svg().dataset.layout==='mobile'&&JSON.stringify(w.workFormValues(get('dividerForm')))===settings&&JSON.stringify(w.armTopology('r1'))===topology,'Switching layouts preserves values, catalogs and mixed topology');
 svg().querySelector('[data-mobile-section="conditions"]').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
 const condition=svg().querySelector('[data-operating-condition="maxC"]');assert(condition.getBoundingClientRect().height>=44&&condition.value==='70','Conditions expand to populated touch-sized native menus');condition.value='85';condition.dispatchEvent(new w.Event('change',{bubbles:true}));assert(w.eval('environmentSettings.thermal.maxC')===85,'Temperature changes propagate to the existing tolerance model');
 svg().querySelector('[data-mobile-section="analysis"]').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));assert(svg().querySelector('[data-mobile-analysis]').getBoundingClientRect().height>0&&svg().querySelectorAll('[data-operating-point]').length===4&&get('schematicCharacteristicsBody'),'Detailed operating point, characteristics and BOM remain available on demand');
 await reset();open('load-type','type');select=inline().querySelector('select');select.value='current';select.dispatchEvent(new w.Event('change',{bubbles:true}));open('load');type('0.1');enter();pick('vin');open('target');type('4');enter();
 assert(state().environment.sourceTolerance.feasible&&state().bounds.vinMin<state().circuit.vin&&state().bounds.vinMax>state().circuit.vin&&!node('source')&&node('target','tolerance'),'Find VTOP retains a calculated trip-voltage range and correct voltage editability with current load');
 assert(svg().querySelector('[data-field="vtopMin"]').textContent===w.format(state().bounds.vinMin,'V',w.voltageDigits(state())),'The compact VTOP card shows the computed lower trip limit');
 await reset();pick('pairs');set('pairMinR','10000');set('pairMaxR','10000');node('search-run').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));const found=await w.pairSearchReady;
 const spec=w.eval('pairSpec'),preview=w.eval('pairPreviewState');assert(found.length===4&&get('schematicDesignSearch').getAttribute('aria-disabled')==='true'&&get('schematicDesignSearch').textContent==='4 Design Solutions Found','Phone search displays and disables the completed count');get('schematicViewToggle').click();get('schematicViewToggle').click();assert(w.eval('pairSpec')===spec&&w.eval('pairPreviewState')===preview&&get('schematicDesignSearch').getAttribute('aria-disabled')==='true','Layout switches preserve generated solutions and preview without invalidating the search');
 const snapshot=w.circuitFrameSnapshot(),saved=new DOMParser().parseFromString(snapshot.markup,'image/svg+xml');assert(!saved.querySelector('parsererror,foreignObject,[data-mobile-part-menu],[data-mobile-section],button')&&saved.querySelector('[data-mobile-overview]')&&saved.getElementById('schematicSolveStatus')&&snapshot.width<=390,'Mobile circuit export is self-contained, fitted and free of transient controls');
 await reset();w.eval('environmentSettings='+initialEnvironment+';update();refreshLeaveWarning()');get('schematicViewToggle').click();get('schematicViewToggle').click();svg().querySelector('[data-mobile-section="analysis"]').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));assert(!w.eval('leaveWarningActive'),'Layout and disclosure changes alone do not dirty the design');assert(!errors.length,'No runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack)}document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2)});
</script></body></html>
