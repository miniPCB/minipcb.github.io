<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Named memory and setting changes</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:2000px;border:0}</style><h1>Original state, named variants and semantic changes</h1><pre id="results">RUNNING</pre><script>
"use strict";
const key='minipcb-divider-memory-v1',old=localStorage.getItem(key),checks=[],failures=[],errors=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label)},pause=(ms=50)=>new Promise(resolve=>setTimeout(resolve,ms));

(async()=>{try{
 localStorage.removeItem(key);const frame=await load('main'),w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),memory=w.dividerMemory;

 set('solveFor','vin');set('targetVout','1.2');const inverse=save();assert(changes(inverse.id).includes('Mode: Find VMID → Find VTOP')&&changes(inverse.id).includes('VMID target: 1.2 V')&&!changes(inverse.id).some(text=>text.startsWith('VTOP:')),'Find VTOP describes its known threshold and excludes the calculated supply');set('solveFor','r1');const inverseResistance=save();assert(!changes(inverseResistance.id).some(text=>text.startsWith('R1.1 value:')),'An inverse resistor result is not reported as an editable resistance change');await memory.restore(conditions.id);
