<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory drawer checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:1000px;border:0}</style><h1>Left-edge memory drawer</h1><pre id="results">RUNNING</pre><script>
"use strict";
const key='minipcb-divider-memory-v1',previous=localStorage.getItem(key),checks=[],failures=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label)},pause=()=>new Promise(resolve=>setTimeout(resolve,250));
(async()=>{try{
 localStorage.removeItem(key);const frame=document.createElement('iframe');frame.title='Calculator under test';frame.src='../voltage_divider.html?memory-drawer-test=1';const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));document.body.append(frame);await loaded;
 const w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),pane=()=>get('calculatorMemory'),tab=()=>pane().querySelector(':scope > summary'),body=()=>get('memoryBody'),bar=()=>d.querySelector('.tool-path-nav'),errors=[];w.addEventListener('error',event=>errors.push(event.message));

 get('memoryClose').focus();get('memoryClose').click();await pause();assert(!pane().open&&body().inert&&d.activeElement===tab()&&geometry()===initialGeometry&&state()===initialState,'Close collapses memory, restores tab focus and preserves the circuit');
 tab().click();await pause();tab().dispatchEvent(new w.KeyboardEvent('keydown',{key:'F10',shiftKey:true,bubbles:true,cancelable:true}));escape(get('memorySave'));assert(get('memoryMenu').hidden&&pane().open&&d.activeElement===tab(),'Escape dismisses memory actions before closing the drawer');
 const rename=get('memoryList').querySelector('.memory-rename');rename.click();const name=d.querySelector('.memory-name-input');escape(name);assert(pane().open&&!d.querySelector('.memory-name-input'),'Escape cancels a name edit before closing the drawer');escape(d.activeElement);await pause();assert(!pane().open&&d.activeElement===tab(),'A subsequent Escape closes the drawer and restores its tab');
 tab().click();await pause();get('liveSchematic').querySelector('[data-schematic-edit="source"][data-edit-focus="value"]').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));escape(get('liveSchematic').querySelector('[data-inline-editor] input'));assert(pane().open&&!w.eval('schematicEditContext'),'Escape in a circuit input closes that input before the memory drawer');
 for(const width of [320,390,768,1050,1440]){
  frame.style.width=width+'px';await pause();if(get('characteristicsToggle').getAttribute('aria-expanded')==='true')get('characteristicsClose').click();if(!pane().open)tab().click();await pause();

  assert(box.left===0&&box.right<=d.documentElement.clientWidth-44&&Math.abs(box.top-bar().getBoundingClientRect().bottom)<1&&box.bottom===w.innerHeight&&handle.right<=d.documentElement.clientWidth+1,width+'px: drawer, Close and attached tab fit below the wrapped pinned bar');
  assert(get('memoryClose').getBoundingClientRect().height>=44&&get('memoryList').getBoundingClientRect().bottom<=box.bottom-11&&d.documentElement.scrollWidth<=width,width+'px: memory controls and list fit without page overflow');
  const minHeight=d.body.style.minHeight;d.body.style.minHeight='3600px';w.scrollTo(0,600);await pause();assert(Math.abs(pane().getBoundingClientRect().top-bar().getBoundingClientRect().bottom)<1&&pane().getBoundingClientRect().bottom===w.innerHeight,width+'px: memory stays fixed below navigation while the page scrolls');w.scrollTo(0,0);d.body.style.minHeight=minHeight;
  get('characteristicsToggle').click();await pause();assert(get('characteristicsToggle').getAttribute('aria-expanded')==='true'&&(width>780?pane().open:!pane().open),width+'px: both drawers can open when they fit, otherwise Characteristics closes Memory');
  if(pane().open){get('memoryClose').click();await pause()}tab().click();await pause();assert(pane().open&&(width>780||get('characteristicsToggle').getAttribute('aria-expanded')==='false'),width+'px: Memory remains reachable and closes Characteristics on narrow screens');
  if(get('characteristicsToggle').getAttribute('aria-expanded')==='true')get('characteristicsClose').click();get('memoryClose').click();await pause();assert(geometry()===before&&state()===saved,width+'px: drawer interactions preserve circuit geometry, inputs, timestamp and saved states');
  if(width<=780){const left=tab().getBoundingClientRect(),right=get('characteristicsToggle').getBoundingClientRect();assert(left.left>=0&&left.right<=right.left&&left.bottom<=w.innerHeight&&left.height>=44,width+'px: both collapsed edge tabs remain separate and touch sized')}
 }
 frame.style.width='390px';frame.style.height='320px';await pause();tab().click();await pause();for(let value=13;value<25;value++){get('vin').value=value;get('vin').dispatchEvent(new w.Event('input',{bubbles:true}));w.dividerMemory.save()}await pause();
 const list=get('memoryList');assert(list.scrollHeight>list.clientHeight&&list.getBoundingClientRect().bottom<=w.innerHeight-11&&get('memoryClose').getBoundingClientRect().bottom<=w.innerHeight,'A short phone viewport keeps Close reachable and scrolls long history inside the drawer');
 const oldest=w.dividerMemory.entries.at(-1);list.scrollTop=list.scrollHeight;list.querySelector(`[data-memory-restore="${oldest.id}"]`).click();await pause();assert(get('vin').value==='12'&&pane().open&&d.activeElement.dataset.memoryRestore===oldest.id,'A scrolled memory entry restores its circuit and stays focused in the drawer');
 const full=new DOMParser().parseFromString(await(await fetch(get('schematicDownload').href)).text(),'image/svg+xml'),framed=new DOMParser().parseFromString(w.circuitFrameSnapshot().markup,'image/svg+xml');assert([full,framed].every(image=>!image.querySelector('#calculatorMemory,#memoryBody,#memoryClose,[data-memory-id]')),'Full-workspace and framed exports exclude drawer controls and stored history');
 assert(errors.length===0,'No runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack)}finally{if(previous===null)localStorage.removeItem(key);else localStorage.setItem(key,previous);document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures},null,2)}})();
