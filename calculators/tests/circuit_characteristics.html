<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circuit characteristics checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui,sans-serif}pre{white-space:pre-wrap}iframe{display:block;border:0;width:1440px;height:2200px}</style></head><body><h1>Circuit characteristics checks</h1><pre id="results" role="status">RUNNING</pre><iframe id="calculator" src="../voltage_divider.html?characteristics-test=1" title="Calculator under test"></iframe><script>
"use strict";
const checks=[],failures=[],assert=(condition,label)=>{checks.push(label);if(!condition)failures.push(label);};
document.getElementById('calculator').addEventListener('load',async event=>{try{
 const frame=event.target,w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),svg=()=>get('liveSchematic'),table=()=>svg().querySelector('[data-field="circuitCharacteristics"]'),field=name=>table().querySelector(`[data-field="${name}"]`),pause=()=>new Promise(resolve=>setTimeout(resolve,15));
 assert(await w.resistorCatalogReady,'Shared catalogs load');const errors=[];w.addEventListener('error',event=>errors.push(event.message));
 const set=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new w.Event('input',{bubbles:true}));},reset=async()=>{get('dividerForm').reset();await pause();};
 const setup=async mode=>{await reset();set('solveFor',mode);if(['vin','r1','r2'].includes(mode))set('targetVout','5');if(mode==='rl')set('targetVout','4');if(mode==='tolerance')set('targetError','2');};
 assert(table().querySelector(':scope > text').textContent==='Circuit characteristics'&&svg().querySelector('[data-schematic-table]').textContent.includes('Parts list and electrical part stress'),'Both tables use the requested common headings');
 assert(field('nominalPower').textContent==='7.2 mW'&&field('nominalCurrent').textContent==='600 µA'&&field('rth').textContent==='5 kΩ'&&field('vmidAccuracy').textContent==='±1%'&&!field('targetVmid'),'Find VMID shows actual operating characteristics and the nominal tolerance band without inventing a target');
 const expected={vout:'6 V',vin:'10 V',r1:'14 kΩ',r2:'7.143 kΩ',rl:'10 kΩ',tolerance:'±2% each'};
 for(const mode of Object.keys(expected)){
  await setup(mode);const state=w.eval('schematicState'),stamp=table().dataset.analyzedAt;
  assert(table().dataset.analysisMode===mode&&table().dataset.analysisState==='calculated'&&field('findResult').textContent===expected[mode],`${mode}: the common table identifies the actual solved quantity`);
  assert(field('nominalPower').textContent===w.format(state.result.total,'W')&&field('nominalCurrent').textContent===w.format(Math.abs(state.result.i1),'A')&&field('rth').textContent===w.format(state.result.rth,'Ω'),`${mode}: common measurements follow this circuit`);
  assert(field('pstress').closest('[role="row"]').textContent.includes('Nominal Pstress')&&field('pstress').textContent===w.percent(Math.max(...Object.values(state.physical).flat().map(part=>part.stress.p))),`${mode}: ordinary modes clearly report maximum nominal physical-part stress`);
  if(['vin','r1','r2','rl'].includes(mode)){
   const target=mode==='rl'?4:5,error=100*Math.max(Math.abs(state.bounds.min-target),Math.abs(state.bounds.max-target))/Math.abs(target);
   assert(field('targetVmid').textContent===`${target} V`&&field('nominalError').textContent==='0%'&&field('worstError').textContent===w.percent(error),`${mode}: target accuracy is percent error, with 0% on target and full-interval worst error`);
  }else assert(field('vmidAccuracy')&&!field('nominalError')&&(mode!=='tolerance'||field('allowedError').textContent==='±2%'),`${mode}: nominal accuracy and allowed tolerance information suit the mode`);
  if(mode==='rl')assert(field('loadPower').textContent==='1.6 mW', 'Find RL includes actual load dissipation');
  assert(Number.isFinite(w.Date.parse(stamp))&&field('analyzedAt').textContent.endsWith(' UTC')&&field('calculator').closest('a').getAttribute('href')==='https://www.minipcb.com/calculators/voltage_divider.html'&&!field('findResult').closest('[data-schematic-edit]'),`${mode}: timestamp/link remain available and the calculated table value stays read-only`);
  for(const width of [320,390,768,1050,1440]){
   frame.style.width=width+'px';await pause();const box=svg().getBoundingClientRect(),inside=[...svg().querySelectorAll('text')].every(node=>{const b=node.getBoundingClientRect();return b.left>=box.left-1&&b.right<=box.right+1&&b.top>=box.top-1&&b.bottom<=box.bottom+1;}),separate=[...table().querySelectorAll('[role="row"]')].every(row=>row.querySelector('[role="rowheader"] text').getBoundingClientRect().right+4<=row.querySelector('[role="cell"] text').getBoundingClientRect().left);
   assert(inside&&separate&&table().dataset.analyzedAt===stamp,`${mode}, ${width}px: all SVG text fits, table columns stay separate and resizing preserves the analysis date`);
  }
  const xml=await(await fetch(get('schematicDownload').href)).text(),snapshot=new DOMParser().parseFromString(xml,'image/svg+xml'),saved=snapshot.querySelector('[data-field="circuitCharacteristics"]');assert(!snapshot.querySelector('parsererror,[role="button"],[tabindex]')&&saved?.dataset.analysisMode===mode&&saved.dataset.analyzedAt===stamp&&saved.querySelector('[data-field="findResult"]').textContent===field('findResult').textContent,`${mode}: static SVG export includes the correct shared characteristics and date`);
 }
 await setup('vin');set('targetVout','-5');assert(field('nominalError').textContent==='0%'&&Number.parseFloat(field('worstError').textContent)>0&&field('targetVmid').textContent==='-5 V','Negative targets use magnitude for percent accuracy');set('targetVout','0');assert(field('nominalError').textContent==='0 V'&&field('worstError').textContent==='0 V'&&!table().textContent.includes('NaN'),'A zero target uses absolute voltage errors instead of undefined percentages');
 set('targetVout','1e-30');assert(field('nominalError').textContent==='0%'&&field('worstError').textContent==='1%','Small nonzero targets retain meaningful relative accuracy without being treated as zero');
 await setup('rl');set('targetVout','6');assert(field('findResult').textContent==='Open circuit'&&field('loadPower').textContent==='0 W','Find RL describes an open-load solution with zero load power');
 await reset();set('vin','0');assert(field('vmidAccuracy').textContent==='0 V'&&!field('targetVmid'),'Zero nominal VMID uses a voltage variation without a fictitious target');
 await reset();get('r1Multiple').checked=true;get('r1Multiple').dispatchEvent(new w.Event('input',{bubbles:true}));get('r1Split').click();const first=get('r1Parts').firstElementChild.dataset.part;set(`${first}Power`,'0.001');assert(field('pstress').textContent==='90%','Common maximum stress respects an individual low-rated resistor in a four-part arm');
 const stamp=table().dataset.analyzedAt;await pause();set('vin','13');assert(table().dataset.analyzedAt!==stamp,'A successful circuit recalculation records a new analysis time');set(`${first}R`,'0');assert(table().dataset.analysisState==='awaiting'&&table().dataset.analyzedAt===''&&field('nominalPower').textContent==='—'&&field('pstress').textContent==='—','Invalid circuit inputs retain the table but clear stale measurements and analysis date');
 await reset();set('r1','12.345');const reference=w.eval('schematicState.result.vout'),choice=[...w.eval('schematicBomChoices').entries()].find(([,item])=>item.part.id==='r1'&&item.family==='tnpw');svg().querySelector(`[data-pair-action="${choice[0]}"]`).dispatchEvent(new w.MouseEvent('click',{bubbles:true}));const adopted=w.eval('schematicState.result.vout');assert(field('targetVmid').textContent===w.format(reference,'V')&&field('nominalError').textContent===w.percent(Math.abs(adopted-reference)/Math.abs(reference)*100)&&adopted!==reference,'Adopting a nearby real part retains the original nominal VMID reference and shows the actual target offset');set('vin','13');assert(!field('targetVmid')&&field('vmidAccuracy'),'A manual circuit edit clears the old adoption reference instead of reporting a stale target');
 await reset();d.querySelector('[data-solve-mode="pairs"]').click();assert(table().dataset.analysisState==='awaiting'&&field('nominalPower').textContent==='—'&&field('targetVmid').textContent==='6 V','Pair setup shares the same table with entered target and empty results');get('pairForm').requestSubmit();await w.pairSearchReady;
 const pairs=w.eval('pairItems'),index=pairs.findIndex(pair=>Math.abs(pair.result.vout-6)>0.001);w.selectPair(index);const selected=w.eval('pairSelected'),nominal=100*Math.abs(selected.result.vout-6)/6,worst=100*Math.max(Math.abs(selected.bounds.min-6),Math.abs(selected.bounds.max-6))/6;
 assert(table().dataset.analysisState==='preview'&&field('nominalError').textContent===w.percent(nominal)&&field('worstError').textContent===w.percent(worst)&&field('allowedError').textContent==='±5%','Real-pair accuracy measures both nominal offset and worst-case tolerance error against the requested target');
 assert(field('pstress').closest('[role="row"]').textContent.includes('Worst Pstress')&&field('pstress').textContent===w.percent(selected.pstress)&&field('findResult').textContent==='Pair preview','Pair mode preserves worst-case stress basis and explicitly identifies the preview');
 get('pairApply').click();assert(table().dataset.analysisMode==='vout'&&field('targetVmid').textContent==='6 V'&&field('nominalError').textContent===w.percent(nominal)&&field('pstress').closest('[role="row"]').textContent.includes('Nominal Pstress'),'Applying a real pair retains its requested target for circuit accuracy while switching to actual nominal part stress');
 assert(errors.length===0,'No browser runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack);}document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2);document.body.dataset.status=failures.length?'FAIL':'PASS';});
</script></body></html>
