  }

 for(const arm of ['r1','r2'])for(const id of state().physical[arm].map(part=>part.id)){
  const before=state().physical[arm].map(part=>({...part})),tree=JSON.stringify(w.armTopology(arm));open(id);type('2.641k');const expected=values()[0];options()[0].click();const parts=state().physical[arm],resistance=partId=>parts.find(part=>part.id===partId).resistance,ids=parts.map(part=>part.id),equivalent=1/(1/(resistance(ids[0])+resistance(ids[1]))+1/(resistance(ids[2])+resistance(ids[3])));
