<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schematic BOM checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:2200px;border:0}</style></head><body><h1>Read-only physical parts list and upstream selection</h1><pre id="results">RUNNING</pre><iframe id="calculator" title="Calculator under test" src="../voltage_divider.html?schematic-bom-test=1"></iframe><script>
"use strict";
const checks=[],failures=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label)},pause=()=>new Promise(resolve=>setTimeout(resolve,25));
document.getElementById('calculator').addEventListener('load',async event=>{try{
 const frame=event.target,w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),svg=()=>get('liveSchematic'),state=()=>w.eval('schematicState'),table=()=>svg().querySelector('[data-schematic-table]'),row=id=>table().querySelector(`[data-schematic-part="${id}"]`),field=(id,key)=>row(id).querySelector(`[data-field="${key}"]`),errors=[];
 w.addEventListener('error',event=>errors.push(event.message));assert(await w.resistorCatalogReady,'Catalogs load');await w.circuitLogoReady;
 const set=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new w.Event('input',{bubbles:true}))},reset=async()=>{w.closeSchematicEditor(false);get('dividerForm').reset();get('pairForm').reset();await pause()},tsv=()=>w.schematicBomTsv().trim().split('\r\n').map(line=>line.split('\t'));
 const family=(id,key)=>row(id).querySelector(`[data-family="${key}"] > text`),open=id=>svg().querySelector(`[data-part-control="value"][data-schematic-edit="${id}"]`).dispatchEvent(new w.MouseEvent('click',{bubbles:true}));
 assert(table().getAttribute('aria-colcount')==='6'&&field('r1','description').textContent==='10 kΩ, ±0.1%, 0805, ±25 ppm/°C','Parts list retains comma-separated actual value, tolerance, package and TCR');
 assert([...table().querySelectorAll('[role="columnheader"]')].map(node=>node.textContent).join('|')==='Ref Des|TNPW PN|M55342 PN|Description|Pstress|Vstress','Description follows the two part-number columns');
 assert(family('r1','tnpw').textContent==='TNPW080510K0BEEA'&&family('r1','m55342').textContent.startsWith('M55342'),'Exact ordering codes display without action buttons');
 assert(!table().querySelector('[data-bom-part],[data-field="matchStatus"],[data-field="mpnRecommendation"]')&&typeof w.useSchematicBomPart==='undefined'&&w.eval('typeof schematicBomChoices')==='undefined','Removed table adoption controls and their caches/handlers stay absent');
 assert(!field('r1','mpn')&&tsv()[1][5]==='Unassigned'&&w.eval('appliedCatalogParts').size===0,'Displaying exact codes does not assign a manufacturer');
 assert(tsv()[0].length===12&&tsv()[0][8]==='Description'&&!tsv()[0].some(text=>text.includes('recommendation')),'Copied BOM retains actual data and assignment status without recommendation columns');
 assert(w.partStressPercent(1e-6)==='0.00%'&&w.partStressPercent(null)==='—'&&w.partStressPercent(100)==='100.00%'&&!/[eE]/.test(w.partStressPercent(1e22)),'Stress remains fixed-decimal percentages with unassessed ratings distinguished');
 set('vin','.000001');assert(field('r1','p').textContent==='0.00%'&&field('r1','v').textContent==='0.00%','Small stresses round to 0.00%');await reset();
 for(const [value,tolerance] of [['12.345','.1'],['10','0'],['0.000000001','.1'],['1e100','.1']]){
  set('r1',value);set('tolR1',tolerance);const before=JSON.stringify(w.workFormValues(get('dividerForm')));w.renderSchematic();
  assert(family('r1','tnpw').textContent==='—'&&family('r1','m55342').textContent==='—'&&!row('r1').querySelector('[data-field="mpnRecommendation"]'),value+'/'+tolerance+': unmatched specs do not substitute nearby ordering codes');
  assert(JSON.stringify(w.workFormValues(get('dividerForm')))===before&&tsv()[1][5]==='Unassigned',value+'/'+tolerance+': rendering preserves the actual manual circuit');
 }
 await reset();set('tolR1','2');assert(family('r1','tnpw').textContent==='—'&&family('r1','m55342').textContent.startsWith('M55342'),'Each family requires an exact supported tolerance');
 await reset();open('r1');svg().querySelector('.schematic-nearby-more').click();get('schematicEditFamily').value='vishay-tnpw-e3';get('schematicEditFamily').dispatchEvent(new w.Event('change',{bubbles:true}));get('schematicEditForm').requestSubmit();
 assert(!get('schematicEditor').open&&state().physical.r1[0].catalog?.mpn==='TNPW080510K0BEEA'&&family('r1','tnpw').textContent==='TNPW080510K0BEEA','The part editor above the table still assigns the chosen catalog part');
 assert(field('r1','mpn').textContent===tsv()[1][5]&&get('solveFor').value==='vout'&&state().circuit.r2===10000,'The report reflects selection while preserving mode and the other resistor');
 await reset();open('r1');const input=svg().querySelector('[data-inline-editor] input');input.value='12.345k';input.dispatchEvent(new w.Event('input',{bubbles:true}));const nearest=svg().querySelector('[data-resistance="12300"]');assert(nearest,'Nearest-value choices remain in the resistor value editor above');nearest.click();
 assert(state().circuit.r1===12300&&family('r1','tnpw').textContent.includes('12K3'),'Choosing a value above updates the report');
 const catalog=w.eval('resistorCatalog'),chosen=w.ResistorParts.evaluate(catalog,'vishay-tnpw-e3',{resistanceOhms:12300,tolerancePct:.1});w.applyCatalogPart(chosen,'r1',true);
 assert(field('r1','mpn').textContent===chosen.mpn&&tsv()[1][5]===chosen.mpn&&family('r1','m55342').textContent==='—','Assigned values retain their real MPN without a nearby other-family substitute');
 for(const mode of ['vin','r1','r2','tolerance']){await reset();set('targetVout','5');set('solveFor',mode);assert(!table().querySelector('[data-bom-part],[data-field="mpnRecommendation"]')&&get('solveFor').value===mode,mode+': the report adds no selection action or mode change');}
 await reset();get('r1Multiple').click();get('r1Split').click();const ids=state().physical.r1.map(part=>part.id);assert(table().querySelectorAll('[data-schematic-part]').length===5&&tsv().length===6,'Series parts retain one physical BOM row each');
 for(const connection of ['series','parallel']){set('r1Connection',connection);set(ids[0]+'R','3.333');assert(tsv().length===6&&tsv()[1][2]===w.format(3333,'Ω')&&family(ids[0],'tnpw').textContent==='—',connection+': report uses each actual manual value without substitution');}
 for(const width of [320,390,768,1050,1440,1920]){frame.style.width=width+'px';await pause();w.eval('mobileAnalysisExpanded=true;renderSchematic()');const box=svg().getBoundingClientRect();assert([...table().querySelectorAll('text')].every(node=>{const b=node.getBoundingClientRect();return b.left>=box.left-1&&b.right<=box.right+1;}),width+'px: complete report fits the SVG');if(table().dataset.tableLayout==='columns')assert([...table().querySelectorAll('[data-field="description"]')].every(node=>node.querySelectorAll('tspan').length===1),width+'px: descriptions never wrap in the column layout');}
 const saved=new DOMParser().parseFromString(await(await fetch(get('schematicDownload').href)).text(),'image/svg+xml');assert(!saved.querySelector('parsererror,[data-bom-part],[data-field="mpnRecommendation"],[data-schematic-edit]')&&saved.querySelector('[data-field="description"]').textContent.includes('ppm/°C'),'Full SVG exports the same report without recommendation controls');
 await reset();set('solveFor','pairs');set('pairMinR','10000');set('pairMaxR','10000');get('pairForm').requestSubmit();await w.pairSearchReady;
 const pair=w.eval('pairSelected');assert(pair&&family('r1',pair.top.familyId.includes('tnpw')?'tnpw':'m55342').textContent===pair.top.mpn&&tsv()[1][5]===pair.top.mpn,'Search preview reports the chosen real part number');
 assert(!table().querySelector('[data-bom-part],[data-field="mpnRecommendation"]'),'Preview parts have no duplicate selection controls');
 assert(!errors.length,'No runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack)}document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2)});
</script></body></html>
