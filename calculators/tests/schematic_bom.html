<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schematic BOM checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui,sans-serif}pre{white-space:pre-wrap}iframe{display:block;border:0;width:1440px;height:2200px}</style></head><body><h1>Schematic BOM checks</h1><pre id="results" role="status">RUNNING</pre><iframe id="calculator" src="../voltage_divider.html?schematic-bom-test=1" title="Calculator under test"></iframe><script>
"use strict";
const checks=[],failures=[],assert=(condition,label)=>{checks.push(label);if(!condition)failures.push(label);};
document.getElementById('calculator').addEventListener('load',async event=>{try{
 const frame=event.target,w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),svg=()=>get('liveSchematic'),pause=()=>new Promise(resolve=>setTimeout(resolve,15));
 assert(await w.resistorCatalogReady,'Shared resistor catalogs load');const errors=[];w.addEventListener('error',event=>errors.push(event.message));

 const row=id=>svg().querySelector(`[data-schematic-part="${id}"]`),field=(id,name)=>row(id)?.querySelector(`[data-field="${name}"]`),choices=()=>[...w.eval('schematicBomChoices').entries()],choice=(id,family)=>choices().find(([,item])=>item.part.id===id&&item.family===family),button=key=>svg().querySelector(`[data-pair-action="${key}"]`);
 const use=(id,family,keyboard=false)=>{const [key]=choice(id,family);button(key).dispatchEvent(keyboard?new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}):new w.MouseEvent('click',{bubbles:true}));};
 const actual=()=>JSON.stringify([...get('dividerForm').querySelectorAll('input,select')].map(input=>[input.id,input.value,input.checked]))+'|'+w.catalogBomCsv(),tsv=()=>w.schematicBomTsv().trim().split('\r\n').map(line=>line.split('\t'));

 assert(field('r1','mpn').textContent===matched.mpn&&field('r1','description').textContent.includes('0805')&&Number(get('p1').value)===matched.powerW&&Number(get('vmax1').value)===matched.workingVoltageV,'Keyboard Use assigns an exact MPN, footprint and its actual power/voltage ratings');
 await reset();set('r1','12.345');const before=actual(),top=choice('r1','tnpw')[1],mil=choice('r1','mil')[1];
 assert(top.kind==='nearby'&&mil.kind==='nearby'&&top.candidate.resistanceOhms===12300&&mil.candidate.resistanceOhms===12400,'A nonpreferred 12.345 kΩ value recommends the nearest supported value in each family: 12.3 kΩ TNPW and 12.4 kΩ M55342');
 assert(field('r1','description').textContent.startsWith('12.35 kΩ')&&row('r1').querySelectorAll('[data-field="mpnRecommendation"]').length===2&&row('r1').textContent.includes('Nearest · +0.45%')&&actual()===before,'Nearby recommendations display their changed value and signed delta while leaving actual values untouched');
 const copied=tsv(),headers=copied[0],data=copied[1];assert(data[2]==='12.35 kΩ'&&data[5]==='Unassigned'&&data[6]==='—'&&data[7]==='—'&&data[headers.indexOf('TNPW recommendation (not applied)')].includes(top.candidate.mpn)&&data[headers.indexOf('Description')].includes('Footprint not set'),'Copied BOM keeps actual values and unassigned PN fields separate from clearly labeled unapplied recommendations');
 const detached=button(choice('r1','tnpw')[0]);set('r1','15.123');detached.dispatchEvent(new w.MouseEvent('click',{bubbles:true}));assert(get('r1').value==='15.123'&&!field('r1','mpn'),'A stale recommendation cannot apply after circuit data changes');
 set('r1','12.345');const adopted=choice('r1','tnpw')[1].candidate,other=get('r2').value;use('r1','tnpw');
 assert(get('r1').valueAsNumber*Number(get('r1Unit').value)===12300&&get('r2').value===other&&field('r1','mpn').textContent===adopted.mpn&&w.catalogBomCsv().includes(adopted.mpn),'One Use click adopts the recommended value and MPN for the chosen resistor only');
 assert(Math.abs(w.eval('schematicState.result.vout')-12*10000/22300)<1e-12&&Number(get('p1').value)===adopted.powerW&&tsv()[1][5]===adopted.mpn,'Adoption recalculates VMID and stresses and updates the actual copied BOM');
 await reset();set('tolR1','0');assert(choice('r1','tnpw')[1].kind==='nearby'&&row('r1').textContent.includes('Tolerance change')&&row('r1').textContent.includes('±0.1%'),'An ideal 0% tolerance is visibly distinguished from the nearest real tolerance');
 set('tolR1','2');assert(choice('r1','tnpw')[1].kind==='nearby'&&choice('r1','mil')[1].kind==='exact'&&tsv()[1][6]==='—'&&tsv()[1][7].startsWith('M55342'),'A different-tolerance part is explicitly recommended rather than copied as an exact actual part');
 await reset();set('r1','1e-9');assert(choice('r1','tnpw')[1].candidate.resistanceOhms===3.52&&choice('r1','tnpw')[1].kind==='nearby','Out-of-range values recommend the nearest catalog boundary rather than inventing a PN');
 set('r1','1e100');assert(choice('r1','tnpw')[1].candidate.resistanceOhms===1000000,'Very large values still recommend the upper catalog boundary without numeric-distance cancellation');
 await reset();set('vin','100');assert(choice('r1','tnpw')[1].disabled&&button(choice('r1','tnpw')[0]).getAttribute('aria-disabled')==='true','A closest part that exceeds its nominal rating is visible but cannot be adopted');

 for(const mode of ['r1','r2','tolerance']){await reset();set('targetVout','5');set('solveFor',mode);const id=mode==='r2'?'r2':'r1',item=choice(id,'tnpw');if(item&&item[1].kind==='nearby')assert(item[1].disabled,`${mode}: adopting a recommendation cannot overwrite a calculated Find property`);else assert(!svg().querySelector(`[data-schematic-edit="${id}"][data-edit-focus="${mode==='tolerance'?'tolerance':'value'}"]`),`${mode}: calculated Find links stay disabled`);}
 await reset();set('solveFor','vin');set('targetVout','5');set('r1','12.345');const inverse=choice('r1','tnpw')[1];use('r1','tnpw');assert(get('solveFor').value==='vin'&&Math.abs(w.eval('schematicState.result.vout')-5)<1e-12&&Math.abs(get('vin').valueAsNumber-11.15)<1e-9,'Using a recommendation for a known input preserves inverse Find mode and its VMID target');
 await reset();get('r1Multiple').checked=true;get('r1Multiple').dispatchEvent(new w.Event('input',{bubbles:true}));get('r1Split').click();const ids=[...get('r1Parts').children].map(item=>item.dataset.part),first=ids[0];set(`${first}R`,'3.333');const peers=ids.slice(1).map(id=>get(`${id}R`).value),multi=choice(first,'tnpw')[1].candidate;use(first,'tnpw');assert(get(`${first}R`).valueAsNumber*Number(get(`${first}Unit`).value)===multi.resistanceOhms&&ids.slice(1).every((id,index)=>get(`${id}R`).value===peers[index])&&tsv().length===6,'Adopting one physical resistor preserves its multi-resistor siblings and one BOM row per part');
 for(const width of [320,390,768,1050,1440]){frame.style.width=width+'px';await pause();const box=svg().getBoundingClientRect();assert([...svg().querySelectorAll('text')].every(node=>{const b=node.getBoundingClientRect();return b.left>=box.left-1&&b.right<=box.right+1&&b.top>=box.top-1&&b.bottom<=box.bottom+1;}),`${width}px: descriptions, full PNs, recommendation labels and Use pills stay inside the SVG`);}
 const xml=await(await fetch(get('schematicDownload').href)).text(),snapshot=new DOMParser().parseFromString(xml,'image/svg+xml');assert(!snapshot.querySelector('parsererror,[data-pair-action],[role="button"],[tabindex]')&&snapshot.querySelector('[data-field="description"]')&&snapshot.querySelector('[data-field="mpnRecommendation"]')&&snapshot.documentElement.textContent.includes('Nearest'),'Static SVG export keeps actual descriptions and labeled recommendations without adoption controls');
 await reset();d.querySelector('[data-solve-mode="pairs"]').click();get('pairForm').requestSubmit();await w.pairSearchReady;const pairBefore=actual(),entry=choices().find(([,item])=>item.pair&&!item.disabled),candidate=entry[1].candidate;button(entry[0]).dispatchEvent(new w.MouseEvent('click',{bubbles:true}));assert(actual()===pairBefore&&w.eval('pairSelected').top.mpn===candidate.mpn&&get('solveFor').value==='pairs','A pair-mode recommendation previews a validated visible pair without applying it to the circuit BOM');
 set('pairTolTop','0.1');get('pairForm').requestSubmit();await w.pairSearchReady;const pairs=w.eval('pairItems'),catalog=w.eval('resistorCatalog'),milBottoms=new Set(pairs.filter(pair=>pair.top.familyId.includes('m55342')).map(pair=>pair.bot.mpn)),special=pairs.findIndex(pair=>pair.top.familyId.includes('tnpw')&&!w.ResistorParts.preferred(catalog,pair.top.resistanceOhms,['E96','E24'])&&milBottoms.has(pair.bot.mpn));
 assert(special>=0,'A real E192 search provides a TNPW value without an exact E96 military-family counterpart');w.selectPair(special);const originalPair=w.eval('pairSelected'),near=choice('r1','mil')[1],distance=Math.min(...w.eval('pairView').filter(pair=>pair.top.familyId.includes('m55342')&&pair.bot.mpn===originalPair.bot.mpn).map(pair=>Math.abs(pair.top.resistanceOhms-originalPair.top.resistanceOhms)));
 assert(near.kind==='nearby'&&!near.disabled&&Math.abs(near.candidate.resistanceOhms-originalPair.top.resistanceOhms)===distance,'Pair-mode nearest recommendations use the closest validated visible pair while keeping the other resistor fixed');use('r1','mil');assert(actual()===pairBefore&&w.eval('pairSelected').top.mpn===near.candidate.mpn&&w.eval('pairSelected').bot.mpn===originalPair.bot.mpn,'Previewing a changed-value military counterpart selects that valid pair and preserves the actual circuit/BOM');
 assert(errors.length===0,'No browser runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack);}document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2);document.body.dataset.status=failures.length?'FAIL':'PASS';});
</script></body></html>
