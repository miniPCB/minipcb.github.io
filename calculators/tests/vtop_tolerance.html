 set('targetError','5');for(const target of ['1e-30','-1e-30']){set('targetVout',target);near(state().tolerances.vin,5,'Tiny signed thresholds retain dimensionless accuracy');}
 await reset();set('tolR1','0');set('tolR2','0');set('loadType','current');set('solveFor','vin');set('targetVout','6');set('targetError','0');assert(field('vtopMin')==='11.999 V'&&field('vtopMax')==='12.001 V','Exact VMID still displays the small leakage-driven source endpoints at sufficient precision');
