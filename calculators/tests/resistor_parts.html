<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared Resistor Catalog Checks</title>
  <style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui,sans-serif}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:2200px;border:0;margin-top:16px}</style>
</head>
<body>
  <h1>Shared resistor catalog checks</h1>
  <p>Serve the repository root over HTTP. This suite exercises the real catalogs, divider, and Radar without supplier requests.</p>
  <pre id="results" role="status">RUNNING</pre>
  <script src="../../js/resistor-parts.js"></script>
  <script>
    "use strict";
    const checks = [], failures = [];
    const assert = (condition, label) => { checks.push(label); if (!condition) failures.push(label); };
    const near = (actual, expected, label) => assert(Number.isFinite(actual) && Math.abs(actual - expected) <= 1e-9 * Math.max(1, Math.abs(expected)), label);
    const throws = (fn, label) => { let failed = false; try { fn(); } catch (_) { failed = true; } assert(failed, label); };
    const clone = value => JSON.parse(JSON.stringify(value));
    const pause = () => new Promise(resolve => setTimeout(resolve, 30));
    const loadFrame = async source => {
      const frame = document.createElement("iframe"); frame.title = "Tool under test";
      const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
      frame.src = source; document.body.append(frame); await loaded; return frame;
    };
    (async () => {
      try {
        const api = ResistorParts, catalog = await api.load();
        const mid = "vishay-eh-m55342", tid = "vishay-tnpw-e3";
        assert(catalog.families.length === 2, "Both shared family files load");
        for (const [name, values] of Object.entries(catalog.series)) assert(values.length === Number(name.slice(1)), `${name} contains the exact series count`);
        assert(catalog.series.E192.includes(920) && !catalog.series.E192.includes(919), "E192 retains the published 920 exception");
        const mil = api.evaluate(catalog, mid, { resistanceOhms: 10000 });
        assert(mil.mpn === "M55342E06B10E0RTS" && mil.powerW === 0.15 && mil.workingVoltageV === 50, "M55342 0805/06 encoding and electrical ratings");
        assert(api.evaluate(catalog, mid, { resistanceOhms: 10000, tcrCode: "K" }).mpn === "M55342K06B10E0RTSV", "Coarse K thin-film parts receive the mandatory V suffix");
        const style7 = api.evaluate(catalog, mid, { package: "07", resistanceOhms: 10000 });
        assert(style7.mpn.startsWith("D55342E07B") && style7.powerW === 0.25 && style7.workingVoltageV === 100, "Only style /07 uses D55342");
        assert(api.decode(catalog, mid, "M55342K06B5E60R").resistanceOhms === 5600, "Manufacturer historical example retains its 5.6 kΩ value");
        assert(api.decode(catalog, mid, "M55342K06B5E60R").status === "manufacturer-documented", "Exact historical source evidence is retained");
        assert(api.evaluate(catalog, mid, { resistanceOhms: 5600, tcrCode: "K" }).status === "rules-validated", "Packaged generated numbers do not inherit historical evidence");
        assert(api.decode(catalog, mid, "M55342E06B10E0M").failureRate === "M", "A legacy M failure rate is not confused with a marking suffix");
        const tnpw = api.evaluate(catalog, tid, { resistanceOhms: 10000 });
        assert(tnpw.mpn === "TNPW080510K0FEEA" && tnpw.powerW === 0.14 && tnpw.workingVoltageV === 150, "TNPW 0805 encoding and general P70 limits");
        const example = api.decode(catalog, tid, "TNPW12061K32DEEA");
        assert(example.resistanceOhms === 1320 && example.tolerancePct === 0.5 && example.tcrPpm === 25 && example.powerW === 0.27, "Manufacturer TNPW ordering example decodes correctly");
        assert(example.status === "manufacturer-documented" && example.sourceUrl.endsWith("#page=4"), "TNPW exact-number evidence cites its source page");
        for (const part of [mil, tnpw, example]) assert(part.stockStatus === "unknown" && part.stockCheckedAt === null, "Number validity never invents supplier availability");
        near(api.evaluate(catalog, mid, { resistanceOhms: 10000, temperatureC: 110 }).powerW, 0.075, "MIL power derates from 70 to 150 °C");
        near(api.evaluate(catalog, tid, { resistanceOhms: 10000, temperatureC: 97.5 }).powerW, 0.07, "TNPW general power derates to its 125 °C limit");
        near(api.evaluate(catalog, tid, { resistanceOhms: 10000, mode: "power", temperatureC: 112.5 }).powerW, 0.11, "TNPW power mode uses its own 155 °C limit");
        near(api.evaluate(catalog, tid, { resistanceOhms: 10000, mode: "advanced" }).powerW, 0.26, "TNPW advanced mode is distinct from general mode");
        near(api.evaluate(catalog, tid, { resistanceOhms: 10000, temperatureC: 20 }).powerW, 0.14, "Cool ambient does not increase the rated P70 power");
        for (const options of [
          { package: "0201", mode: "advanced", packaging: "ED" },
          { package: "0402", tolerancePct: 0.1, tcrCode: "X", resistanceOhms: 10, packaging: "ED" },
          { package: "0603", tolerancePct: 0.1, resistanceOhms: 2 },
          { package: "0201", tolerancePct: 0.1, resistanceOhms: 30000, packaging: "ED" },
          { tolerancePct: 0.1, tcrCode: "X", packaging: "EC" },
          { temperatureC: 125 }, { temperatureC: -56 }, { temperatureC: NaN },
          { resistanceOhms: 2500 }, { resistanceOhms: 0 }, { resistanceOhms: Infinity },
          { tolerancePct: 0.25 }, { package: "0303" }
        ]) throws(() => api.evaluate(catalog, tid, { resistanceOhms: 10000, ...options }), "TNPW rejects unsupported range, mode, temperature, or ordering combination");
        for (const number of ["M55342E07B10E0RTS", "D55342E06B10E0RTS", "M55342K06B10E0RTS", "M55342E06B1C00RTS", "M55342E11B10E0RTSM", "M55342Z06B10E0RTS"]) throws(() => api.decode(catalog, mid, number), `MIL rejects unsupported combination ${number}`);
        throws(() => api.decode(catalog, tid, "TNPW080510K0FEEA0H"), "Unimplemented special suffixes are not silently accepted");
        throws(() => api.evaluate(catalog, mid, { package: "12", resistanceOhms: 261000, tolerancePct: 0.1 }), "MIL /12 precision range uses its lower 258 kΩ ceiling");
        assert(api.evaluate(catalog, mid, { package: "12", resistanceOhms: 261000, tolerancePct: 1 }).resistanceOhms === 261000, "MIL /12 coarse range allows 261 kΩ");
        assert(api.evaluate(catalog, mid, { resistanceOhms: 20, tcrCode: "H" }).resistanceOhms === 20, "H characteristic supports the lower resistance range");
        throws(() => api.evaluate(catalog, mid, { resistanceOhms: 20, tcrCode: "E" }), "E characteristic enforces its 49.9 Ω floor");
        for (const family of catalog.families) for (const pkg of family.packages) for (const range of pkg.limits) {
          const input = { package: pkg.code, resistanceOhms: 10000, tolerancePct: range.tolerancesPct[0], tcrCode: range.tcrCodes[0], packaging: pkg.packagingCodes[0], mode: family.defaults.mode };
          const part = api.evaluate(catalog, family.id, input);
          const decoded = api.decode(catalog, family.id, part.mpn);
          assert(decoded.resistanceOhms === 10000 && decoded.package === pkg.code && decoded.tolerancePct === input.tolerancePct && decoded.tcrCode === input.tcrCode, `Build/decode round trip ${part.mpn}`);
        }
        const candidates = api.suggest(catalog, tid, { resistanceOhms: 2500, maxTolerancePct: 1 });
        assert(candidates.length > 0 && candidates[0].resistanceOhms === 2490 && candidates[0].tolerancePct === 1, "Suggestions choose real 2.49 kΩ values near an ideal 2.5 kΩ");
        assert(candidates.every(p => p.resistanceOhms !== 2500 && Math.abs(p.errorPct) <= 5 && p.tolerancePct <= 1), "Suggestions retain value-series, tolerance, and deviation limits");
        assert(api.suggest(catalog, tid, { resistanceOhms: 1e9 }).length === 0, "No invented parts outside family range");
        const badIndex = clone(catalog); badIndex.schemaVersion = 999;
        throws(() => api.validate(badIndex, catalog.families), "Unknown schema versions fail closed");
        for (const mutation of [f => f.packages.push(clone(f.packages[0])), f => { f.packages[0].powerW.general = -1; }, f => { f.packages[0].limits[0].maxOhms = -1; }, f => { f.sources = []; }, f => { f.stock.status = "in-stock"; }, f => { f.tcrCodes.push(clone(f.tcrCodes[0])); }, f => { f.defaults.tcrCode = "Z"; }, f => { f.packages[0].model = "WRONG"; }]) {
          const families = clone(catalog.families); mutation(families[1]); throws(() => api.validate(catalog, families), "Malformed family data is rejected before use");
        }
        const editedFamilies = clone(catalog.families); editedFamilies[1].packages.find(p => p.code === "0805").powerW.general = 0.123;
        near(api.evaluate(api.validate(catalog, editedFamilies), tid, { resistanceOhms: 10000 }).powerW, 0.123, "A data-only rating edit changes the shared engine result");

        const frame = await loadFrame("../voltage_divider.html?catalog-test=1"), w = frame.contentWindow, d = w.document;
        assert(await w.resistorCatalogReady, "Divider loads both shared catalogs");
        const get = id => d.getElementById(id);
        const set = (id, value) => { get(id).value = value; get(id).dispatchEvent(new w.Event("input", { bubbles: true })); get(id).dispatchEvent(new w.Event("change", { bubbles: true })); };
        const reset = async () => { get("dividerForm").reset(); await pause(); };
        const use = () => { get("partsTab").click(); get("catalogCandidates").querySelector("button").click(); };
        w.openCalculatorDetails("results"); get("partsTab").click();
        assert(get("catalogControls").getBoundingClientRect().width > 0 && get("overviewPanel").hidden, "Parts tab reveals the catalog and hides the operating overview");
        assert(get("catalogCandidates").children.length > 0 && get("catalogFamily").value === tid, "Divider suggests TNPW parts without altering manual defaults");
        use();
        assert(get("partsTab").getAttribute("aria-selected") === "true" && !get("catalogPanel").hidden, "Applying a part keeps the catalog view open for the next resistor");
        near(Number(get("p1").value), 0.14, "Applying a single resistor imports its actual P70 rating");
        near(get("vmax1").valueAsNumber, 150, "Applying a part imports its working-voltage limit");
        assert(get("vout").textContent === "6 V" && get("catalogApplied").textContent.includes("TNPW080510K0FEEA"), "Applying an exact-value candidate preserves VMID and associates the MPN");
        assert(get("liveSchematic").querySelector('[data-schematic-part="r1"] [data-family="tnpw"] [data-field="mpn"]').textContent === "TNPW080510K0FEEA" && [...get("schematicParts").querySelectorAll('[role="columnheader"]')].map(node => node.textContent).join("|") === "Ref Des|Description|TNPW PN|M55342 PN|Pstress|Vstress", "Applied MPN appears under its family beside the description in the SVG table");
        const exportedSvg = await (await fetch(get("schematicDownload").href)).text();
        assert(exportedSvg.includes("TNPW080510K0FEEA"), "Downloaded SVG captures the applied MPN");
        assert(w.catalogBomCsv().includes('"TNPW080510K0FEEA"') && w.catalogBomCsv().includes('"Unassigned"') && w.catalogBomCsv().includes('"Not checked"'), "BOM distinguishes applied and unassigned parts and unknown stock");
        set("r1", "20");
        assert(!get("liveSchematic").querySelector('[data-field="mpn"]') && get("catalogBom").disabled, "Manual component changes remove stale MPN associations");
        await reset(); set("solveFor", "vin"); set("targetVout", "5"); use();
        assert(get("solveFor").value === "vout" && get("vin").valueAsNumber === 10 && get("r1").valueAsNumber === 10 && get("vout").textContent === "5 V", "Applying in inverse mode freezes the selected actual resistance and uses forward analysis");
        await reset(); set("catalogFamily", mid); set("catalogPackage", "07");
        assert(get("catalogCandidates").firstElementChild.dataset.mpn.startsWith("D55342"), "Divider M55342 selector enforces the /07 model exception");
        await reset(); set("catalogFamily", tid); set("catalogTemperature", "97.5"); use();
        near(Number(get("p1").value), 0.07, "Divider imports allowed power at the selection ambient");
        assert(get("liveSchematic").querySelector('[data-schematic-part="r1"] > title').textContent.includes("Allowed 70 mW") && get("liveSchematicDesc").textContent.includes("140 mW rated at 70") && get("liveSchematicDesc").textContent.includes("97.5"), "SVG metadata distinguishes rated power from the temperature-derated allowance");
        assert(get("catalogApplied").textContent.includes("97.5"), "Applied part records its power-rating condition");
        set("catalogTemperature", "125");
        assert(!get("catalogCandidates").children.length && get("catalogMatchStatus").textContent.includes("below 125"), "Invalid candidate temperature suppresses suggestions");
        await reset(); set("catalogTemperature", "70");
        get("r1Multiple").checked = true; get("r1Multiple").dispatchEvent(new w.Event("input", { bubbles: true })); get("r1Split").click();
        const partId = get("r1Parts").firstElementChild.dataset.part; set("catalogPart", partId); use();
        near(get(partId + "R").valueAsNumber, 2.49, "Catalog application changes only the selected physical resistor");
        near(get("r1").valueAsNumber, 9.99, "Applied physical values recalculate the series equivalent");
        near(get("targetVout").valueAsNumber, 120 / 19.99, "Actual preferred-value part recalculates VMID");
        assert(w.catalogBomCsv().split("\r\n").filter(Boolean).length === 6 && get("liveSchematic").querySelector('[data-field="mpn"]'), "Four upper parts and one lower part export as five physical BOM rows");
        set("r1Connection", "parallel");
        assert(get("catalogApplied").textContent.includes("TNPW") && get("inputError").hidden, "Physical MPN association survives a topology change and stress recalculates");
        set(partId + "Power", "0.1");
        assert(get("catalogBom").disabled, "Changing an applied physical rating removes its MPN");
        get("partsTab").click();
        for (const width of [320, 390, 768, 900, 1440]) {
          frame.style.width = width + "px"; await pause();
          assert(d.documentElement.scrollWidth <= width, `Part-selection controls fit at ${width}px`);
        }
        await reset(); set("r1", "0");
        assert(!get("catalogCandidates").children.length && get("catalogBom").disabled, "Invalid circuit data clears candidate and BOM actions");
        await reset(); assert(!get("liveSchematic").querySelector('[data-field="mpn"]') && get("catalogBom").disabled, "Reset clears applied part assignments");

        get("parts2Tab").click();
        const tableRows = () => [...get("parts2Rows").rows];
        const valueRow = key => tableRows().find(row => row.dataset.valueRow === key);
        const chooseValue = key => valueRow(key).cells[1].click();
        const bomRow = id => get("parts2BomRows").querySelector(`[data-bom-part="${id}"]`);
        const bomCell = (id, key) => bomRow(id).querySelector(`[data-bom-column="${key}"]`);
        assert(get("parts2BomHead").querySelectorAll("th").length === 6, "The circuit BOM starts with six standard part columns");
        for (const key of ["tnpw", "mil", "conditions", "allowed", "pstress"]) { const toggle = get("parts2BomControls").querySelector(`[data-bom-column-toggle="${key}"]`); toggle.checked = true; toggle.dispatchEvent(new w.Event("input", { bubbles: true })); }
        assert(get("parts2Controls").getBoundingClientRect().width > 0 && get("catalogPanel").hidden && get("partsTab"), "Parts (2) adds a separate visible table view while retaining Parts");
        const paired = valueRow("10000:1");
        assert(paired && paired.cells[3].textContent.includes("TNPW080510K0FEEA") && paired.cells[4].textContent.includes("M55342E06B10E0RTS"), "Same value/tolerance row includes TNPW and M55342 numbers side by side");
        for (const row of tableRows()) for (const [index, family] of [[3,tid],[4,mid]]) {
          const number = row.cells[index].querySelector(".part-number");
          if (!number) continue;
          const candidate = api.decode(catalog, family, number.textContent), [resistance, tolerance] = row.dataset.valueRow.split(":").map(Number);
          assert(candidate.resistanceOhms === resistance && candidate.tolerancePct === tolerance && candidate.case === "0805" && candidate.tcrPpm === 25, "Paired table candidates decode to their displayed value, tolerance, size, and TCR");
        }
        chooseValue("10000:0.5");
        assert(valueRow("10000:0.5").dataset.selected === "true" && d.activeElement === valueRow("10000:0.5").querySelector("input"), "Selecting a value highlights the row and preserves native radio focus");
        assert(get("tolR1").valueAsNumber === 1 && get("parts2Preview").textContent.includes("VMID 6 V"), "Value selection previews without changing the circuit");
        set("parts2Family", "tnpw"); get("parts2Apply").click();
        assert(get("tolR1").valueAsNumber === 0.5 && Number(get("p1").value) === 0.14 && get("parts2Tab").getAttribute("aria-selected") === "true", "Applying a table selection imports its tolerance/rating and keeps Parts (2) open");
        assert(bomCell("r1", "tnpw").textContent.includes("TNPW") && bomCell("r1", "mil").textContent.includes("M55342") && bomCell("r1", "mpn").textContent.includes("TNPW"), "Optional BOM columns show both exact-value family options and the actual applied part");
        set("parts2Part", "r2"); set("parts2Family", "mil"); chooseValue("10000:1"); get("parts2Apply").click();
        assert(Number(get("p2").value) === 0.15 && bomCell("r2", "mpn").textContent.includes("M55342"), "A different physical resistor can use the other family in the same BOM");
        assert(get("catalogApplied").textContent.includes("TNPW") && get("catalogApplied").textContent.includes("M55342") && w.catalogBomCsv().includes('"M55342E06B10E0RTS"'), "Both Parts tabs and the existing CSV share the same assignments");
        const clipboardDescriptor = Object.getOwnPropertyDescriptor(w.navigator, "clipboard");
        let copied = "";
        Object.defineProperty(w.navigator, "clipboard", { configurable: true, value: { writeText: async text => { copied = text; } } });
        get("parts2Copy").click(); await pause();
        const tsv = copied.trim().split("\r\n").map(row => row.split("\t"));
        assert(copied === w.parts2BomTsv() && tsv.length === 3 && tsv.every(row => row.length === tsv[0].length), "Copy BOM writes spreadsheet-ready TSV with one row per physical resistor");
        assert(tsv[1][tsv[0].indexOf("TNPW alternative")].startsWith("TNPW") && tsv[1][tsv[0].indexOf("M55342 alternative")].startsWith("M55342") && tsv[1][tsv[0].indexOf("Manufacturer part number")].startsWith("TNPW") && tsv[2][tsv[0].indexOf("Manufacturer part number")].startsWith("M55342"), "Copied visible BOM columns preserve paired options and mixed applied families");
        assert(get("parts2CopyStatus").textContent.startsWith("BOM copied") && get("parts2CopyFallback").hidden, "Successful clipboard copy reports completion");
        Object.defineProperty(w.navigator, "clipboard", { configurable: true, value: { writeText: async () => { throw new Error("Clipboard denied"); } } });
        get("parts2Copy").click(); await pause();
        assert(!get("parts2CopyFallback").hidden && get("parts2CopyText").value === copied.replaceAll("\r\n", "\n") && get("parts2CopyText").selectionEnd === get("parts2CopyText").value.length && d.activeElement === get("parts2CopyText"), "Unavailable clipboard reveals and selects the complete BOM for manual copying");
        if (clipboardDescriptor) Object.defineProperty(w.navigator, "clipboard", clipboardDescriptor); else delete w.navigator.clipboard;
        assert(bomCell("r1", "qty").textContent === "1" && bomCell("r1", "value").textContent === "10 kΩ" && bomCell("r1", "footprint").textContent === "0805" && get("liveSchematic").querySelector('[data-schematic-symbol="r1"] [data-field="footprint"]').textContent === "0805", "Standard BOM and SVG show the applied physical footprint and quantity");
        set("parts2BomMaxP", "2.5");
        assert(get("parts2BomRows").rows.length === 1 && bomRow("r2") && w.parts2BomTsv().trim().split("\r\n").length === 2, "Nominal Pstress filtering retains only the qualifying resistor and copied row");
        get("parts2BomReset").click(); set("parts2BomMaxV", "8");
        assert(get("parts2BomRows").rows.length === 1 && bomRow("r1"), "Nominal voltage stress filtering uses each part maximum continuous voltage");
        get("parts2BomReset").click(); set("parts2BomMaxPower", "3.5");
        assert(get("parts2BomRows").rows.length === 0 && get("parts2Copy").disabled && w.parts2BomTsv() === "" && get("inputError").hidden, "Part-power filtering clears copied rows without invalidating the circuit");
        get("parts2BomReset").click(); set("parts2BomQuery", bomCell("r1", "mpn").textContent);
        assert(get("parts2BomRows").rows.length === 1 && bomRow("r1"), "BOM text search filters exact part numbers");
        get("parts2BomReset").click(); set("parts2BomMaxP", "-1");
        assert(get("parts2BomMaxP").getAttribute("aria-invalid") === "true" && get("parts2Copy").disabled && get("parts2BomStatus").textContent.includes("nonnegative"), "Invalid BOM limits expose an error and prevent stale copying");
        get("parts2BomReset").click(); const powerToggle = get("parts2BomControls").querySelector('[data-bom-column-toggle="allowed"]'); powerToggle.checked = false; powerToggle.dispatchEvent(new w.Event("input", { bubbles: true }));
        assert(!bomRow("r1").querySelector('[data-bom-column="allowed"]') && !w.parts2BomTsv().split("\r\n")[0].includes("Allowed power"), "Optional columns disappear from the table and copied BOM together");
        powerToggle.checked = true; powerToggle.dispatchEvent(new w.Event("input", { bubbles: true }));
        let rejectBomCopy;
        Object.defineProperty(w.navigator, "clipboard", { configurable: true, value: { writeText: () => new Promise((resolve, reject) => { rejectBomCopy = reject; }) } });
        const pendingBomCopy = w.copyParts2Bom(); set("parts2BomMaxPower", "0"); rejectBomCopy(new Error("Clipboard denied after filtering")); await pendingBomCopy;
        assert(get("parts2CopyFallback").hidden && get("parts2CopyText").value === "" && get("parts2Copy").disabled, "A pending clipboard failure cannot restore rows excluded by newer BOM filters");
        get("parts2BomReset").click(); if (clipboardDescriptor) Object.defineProperty(w.navigator, "clipboard", clipboardDescriptor); else delete w.navigator.clipboard;
        set("parts2Temperature", "97.5");
        assert(bomCell("r1", "allowed").textContent === "140 mW" && bomCell("r1", "conditions").textContent.includes("70 °C"), "New comparison settings do not relabel an already applied part's thermal conditions");
        set("parts2Family", "tnpw"); get("parts2Apply").click();
        near(Number(get("p2").value), 0.07, "Table application imports the ambient-derated allowance rather than the P70 rating");
        assert(bomCell("r2", "conditions").textContent.includes("97.5 °C") && w.parts2BomTsv().includes("97.5"), "Table BOM and copied output retain the actual selection ambient");
        set("vin", "1000");
        assert(bomCell("r2", "mpn").textContent.includes("TNPW") && Number.parseFloat(bomCell("r2", "pstress").textContent) > 100, "Previously applied parts remain identified when a circuit change exceeds their ratings");
        set("vin", "12");
        set("r1", "20");
        assert(bomCell("r1", "mpn").textContent === "Unassigned" && !w.parts2BomTsv().includes("TNPW080510K0DEEA"), "Manual changes invalidate stale BOM assignments");
        await reset(); set("parts2Temperature", "70");
        get("r1Multiple").checked = true; get("r1Multiple").dispatchEvent(new w.Event("input", { bubbles: true })); get("r1Split").click();
        const tablePart = get("r1Parts").firstElementChild.dataset.part;
        get("parts2Tab").click(); set("parts2Part", tablePart); chooseValue("2490:1"); set("parts2Family", "tnpw"); get("parts2Apply").click();
        near(get("r1").valueAsNumber, 9.99, "Table application changes only the chosen part of a four-resistor series arm");
        near(get("targetVout").valueAsNumber, 120 / 19.99, "Table application recalculates VMID from the actual preferred value");
        assert(get("parts2BomRows").rows.length === 5 && w.parts2BomTsv().trim().split("\r\n").length === 6 && bomRow(tablePart).textContent.includes("TNPW"), "Four RTOP parts plus RBOT produce five visible and copyable BOM rows");
        get(tablePart).querySelector("button").click();
        assert(!bomRow(tablePart) && get("parts2BomRows").rows.length === 4 && !w.parts2BomTsv().includes('R1.1\t'), "Removing a physical resistor removes its BOM row and copied reference");
        await reset(); get("parts2Tab").click(); set("parts2Package", "0201");
        assert(tableRows().length > 0 && tableRows().every(row => row.cells[3].textContent.includes("TNPW0201") && row.cells[4].textContent === "—"), "Unsupported family/package combinations show a dash rather than an invented part number");
        set("parts2Family", "mil");
        assert(get("parts2Apply").disabled && get("parts2Preview").textContent.includes("no matching part"), "Unsupported family cannot be applied to a selected row");
        set("parts2Package", "1206");
        assert(tableRows().some(row => row.cells[4].textContent.includes("D55342E07")), "Paired table retains the D55342 /07 model exception");
        set("parts2Package", "0805"); set("parts2Tcr", "100");
        assert(tableRows().length > 0 && tableRows().every(row => row.cells[3].textContent === "—" && row.cells[4].textContent.includes("M55342K06")), "Family-specific TCR support is respected independently");
        set("parts2Tcr", "25"); set("parts2Temperature", "125");
        assert(tableRows().length > 0 && tableRows().every(row => row.cells[3].textContent === "—") && get("parts2MatchStatus").textContent.includes("below 125"), "Family temperature limits exclude only the affected family");
        set("parts2Temperature", "150");
        assert(!tableRows().length && get("parts2Apply").disabled, "Above both thermal limits, no table candidate can be applied");
        set("parts2Temperature", "");
        assert(!tableRows().length && get("parts2MatchStatus").textContent.includes("finite"), "Invalid selection ambient clears table candidates");
        set("parts2Temperature", "70"); set("r1", "100"); set("r2", "100"); set("vin", "110");
        assert(tableRows().length > 0 && tableRows().every(row => row.cells[3].textContent.includes("TNPW") && row.cells[4].textContent === "—"), "Each family uses its own working-voltage limit for the same value row");
        set("vin", "1000");
        assert(!tableRows().length && get("parts2Apply").disabled, "Candidates exceeding selected-part nominal stress limits are excluded");
        set("r1", "0");
        assert(!get("parts2BomRows").rows.length && get("parts2Copy").disabled && w.parts2BomTsv() === "", "Invalid circuit data clears the BOM and disables copying");
        await reset(); get("parts2Tab").click();
        for (const width of [320, 390, 768, 900, 1440]) {
          frame.style.width = width + "px"; await pause();
          assert(d.documentElement.scrollWidth <= width && get("parts2Panel").getBoundingClientRect().width > 0, `Selectable values and BOM fit their scroll regions at ${width}px`);
        }
        const valueRegion = get("parts2Rows").closest(".table-wrap");
        valueRegion.scrollTop = valueRegion.scrollHeight;
        assert(tableRows().at(-1).getBoundingClientRect().bottom <= valueRegion.getBoundingClientRect().bottom + 1, "The bounded candidate list scrolls to its final row");
        assert(Math.abs(valueRegion.querySelector("thead th").getBoundingClientRect().top - valueRegion.getBoundingClientRect().top) < 2, "Candidate column headings stay visible while scrolling values");
        tableRows().at(-1).cells[1].click();
        assert(tableRows().at(-1).dataset.selected === "true" && tableRows().at(-1).querySelector("input").checked, "A candidate reached by scrolling remains selectable");
        assert([...get("parts2BomRows").rows].every(row => row.querySelector('[data-bom-column="mpn"]').textContent === "Unassigned"), "Reset clears table BOM assignments");
        await reset();

        const radar = await loadFrame("../../part_number_radar.html?catalog-test=1"), rw = radar.contentWindow, rd = rw.document;
        await rw.radarCatalogReady;
        assert(rd.getElementById("sharedCatalogStatus").textContent.includes("Shared catalog 2026-10-24"), "Radar uses the shared M55342 catalog");
        assert(rd.getElementById("tcrFilter").textContent.includes("200 ppm") && rd.getElementById("tcrFilter").textContent.includes("300 ppm"), "Radar displays the corrected source-backed TCR values");
        assert(rd.getElementById("milPreferredRows").rows.length === api.family(catalog, mid).toleranceCodes.length, "Radar preferred-value table is populated from the family data");
        assert(rd.getElementById("tnpwResults").textContent.includes("TNPW080510K0FEEA"), "Radar has a TNPW browser using the same candidate engine");
        assert(rw.decodeSharedResistorPn(tid, "TNPW12061K32DEEA").resistanceOhms === 1320, "Radar shares the TNPW decoder and sourced example");
        const radarTolerance = rd.getElementById("tnpwTolerance"); radarTolerance.value = "0.5";
        rd.getElementById("tnpwResistance").value = "1320"; radarTolerance.dispatchEvent(new rw.Event("input", { bubbles: true }));
        rd.getElementById("tnpwPackage").value = "1206"; rd.getElementById("tnpwPackage").dispatchEvent(new rw.Event("input", { bubbles: true }));
        assert(rd.getElementById("tnpwResults").textContent.includes("TNPW12061K32DEEA") && rd.getElementById("tnpwResults").textContent.includes("manufacturer-documented"), "Radar browser exposes exact manufacturer evidence");
        assert(rw.PART_FAMILY_REFERENCE_DB.tnpw.documents[0].url === api.family(catalog, tid).sources[0].url, "Radar reference source is derived from the family file");
        assert(rw.PART_FAMILY_REFERENCE_DB.m55342.documents[0].revision === api.family(catalog, mid).sources[0].revision, "Radar M55342 reference metadata is derived from the family file");
        rd.querySelector('[data-choice-entry="pn_browser"]').click();
        rd.querySelector('[data-choice-component="resistor"]').click();
        rd.querySelector('[data-choice-family="tnpw"]').click();
        assert(!rd.getElementById("tnpwView").classList.contains("hidden") && !rd.getElementById("workspace").classList.contains("hidden"), "Radar navigation opens the TNPW browser");
        for (const width of [390, 900, 1440]) {
          radar.style.width = width + "px"; await pause();
          assert(rd.documentElement.scrollWidth <= width, `Radar TNPW browser fits at ${width}px`);
        }
        for (const [number, familyLabel] of [["TNPW12061K32DEEA", "TNPW e3"], ["M55342K06B10E0RTSV", "M55342 / D55342"], ["WSL25124L000FEA", "WSL"]]) {
          rd.getElementById("pnDecipherInput").value = number; rd.getElementById("pnDecipherRunBtn").click();
          assert(rd.getElementById("pnDecipherValidity").textContent === "Valid" && rd.getElementById("pnDecipherDetectedFamily").textContent === familyLabel, `Radar PN decipher recognizes ${number}`);
        }
        const source = await (await fetch("../voltage_divider.html")).text();
        const fallback = document.createElement("iframe"); fallback.title = "Missing module fallback";
        const fallbackLoaded = new Promise(resolve => fallback.addEventListener("load", resolve, { once: true }));
        fallback.srcdoc = source.replace("<head>", `<head><base href="${new URL("../voltage_divider.html", location.href).href}">`).replace('src="../js/resistor-parts.js"', 'src="../js/missing-resistor-module.js"');
        document.body.append(fallback); await fallbackLoaded;
        assert(await fallback.contentWindow.resistorCatalogReady === false && fallback.contentDocument.getElementById("vout").textContent === "6 V", "Manual analysis survives a missing shared module");
        assert(fallback.contentDocument.getElementById("parts2Status").textContent.includes("unavailable") && fallback.contentDocument.getElementById("parts2Controls").hidden, "Parts (2) reports missing catalogs without blocking manual calculation");
        const radarSource = await (await fetch("../../part_number_radar.html")).text();
        const radarFallback = document.createElement("iframe"); radarFallback.title = "Radar missing module fallback";
        const radarFallbackLoaded = new Promise(resolve => radarFallback.addEventListener("load", resolve, { once: true }));
        radarFallback.srcdoc = radarSource.replace("<head>", `<head><base href="${new URL("../../part_number_radar.html", location.href).href}">`).replace('src="js/resistor-parts.js"', 'src="js/missing-resistor-module.js"');
        document.body.append(radarFallback); await radarFallbackLoaded; await radarFallback.contentWindow.radarCatalogReady;
        const fallbackRadar = radarFallback.contentDocument;
        assert(fallbackRadar.getElementById("sharedCatalogStatus").textContent.includes("unavailable"), "Radar reports catalog failure without blocking startup");
        fallbackRadar.getElementById("pnDecipherInput").value = "WSL25124L000FEA"; fallbackRadar.getElementById("pnDecipherRunBtn").click();
        assert(fallbackRadar.getElementById("pnDecipherValidity").textContent === "Valid", "Unrelated Radar families still decode when shared catalogs are unavailable");
      } catch (error) { failures.push(error.stack); }
      document.getElementById("results").textContent = JSON.stringify({ status: failures.length ? "FAIL" : "PASS", count: checks.length, failures, checks }, null, 2);
      document.body.dataset.status = failures.length ? "FAIL" : "PASS";
    })();
  </script>
</body>
</html>
