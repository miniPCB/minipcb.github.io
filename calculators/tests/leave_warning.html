<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voltage divider navigation checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui,sans-serif}pre{white-space:pre-wrap}iframe{display:block;border:0;width:1440px;height:2200px}</style></head>
<body>
<h1>Voltage divider navigation and memory</h1><pre id="results" role="status">RUNNING</pre>
<iframe id="calculator" title="Calculator under test"></iframe>
<script>
"use strict";
const frame=document.getElementById("calculator"), key="minipcb-divider-memory-v1", prior=localStorage.getItem(key), checks=[], failures=[];
const assert=(condition,label)=>{checks.push(label);if(!condition)failures.push(label);};
const entries=()=>JSON.parse(localStorage.getItem(key)).entries;
const navigate=src=>new Promise(resolve=>{
  frame.addEventListener("load",()=>resolve(frame.contentWindow),{once:true});
  frame.src=src;
});
const loadCalculator=async()=>{
  const w=await navigate("../voltage_divider.html?navigation-test=1");
  await w.resistorCatalogReady;
  return w;
};
const set=(w,id,value)=>{
  const input=w.document.getElementById(id);
  input.value=value;
  input.dispatchEvent(new w.Event("input",{bubbles:true}));
};
const canLeave=w=>w.dispatchEvent(new w.Event("beforeunload",{cancelable:true}));
(async()=>{
  try {
    localStorage.removeItem(key);
    let w=await loadCalculator();
    assert(canLeave(w)&&entries().length===1,"The starting calculator allows navigation and saves an original calculation");

    set(w,"vin","24");
    assert(canLeave(w)&&w.document.getElementById("vout").textContent==="12 V","A valid circuit change recalculates without requesting confirmation");
    assert(!entries().some(entry=>entry.summary.startsWith("24 V")),"The normal autosave delay still applies to the completed edit");
    w=await navigate("about:blank");
    const saved=entries().find(entry=>entry.summary.startsWith("24 V"));
    assert(w.location.href==="about:blank"&&saved,"Navigation saves the pending calculation before leaving");

    w=await loadCalculator();
    await w.dividerMemory.restore(saved.id);
    assert(w.document.getElementById("vin").value==="24"&&w.document.getElementById("vout").textContent==="12 V","The calculation can be recalled after returning");
    const count=entries().length;

    w.document.querySelector('[data-schematic-edit="source"][data-edit-focus="value"]').dispatchEvent(new w.MouseEvent("click",{bubbles:true}));
    const draft=w.document.querySelector("[data-inline-editor] input");
    draft.value="18";
    draft.dispatchEvent(new w.Event("input",{bubbles:true}));
    assert(canLeave(w)&&w.document.getElementById("vin").value==="24","An inline draft allows navigation and keeps its changes local");
    await navigate("about:blank");
    assert(entries().length===count,"Leaving with an inline draft preserves only the saved calculations");

    w=await loadCalculator();
    set(w,"r1","");
    assert(canLeave(w)&&!w.document.getElementById("inputError").hidden,"An invalid calculation allows navigation");
    await navigate("about:blank");
    assert(entries().length===count,"Leaving an invalid circuit leaves the history intact");

    w=await loadCalculator();
    w.document.querySelector("#calculatorMemory > summary").dispatchEvent(new w.MouseEvent("contextmenu",{bubbles:true,cancelable:true}));
    w.document.getElementById("memoryAuto").click();
    set(w,"vin","36");
    assert(canLeave(w)&&w.document.getElementById("memoryAuto").getAttribute("aria-checked")==="false","Navigation remains available with Autosave off");
    await navigate("about:blank");
    assert(entries().length===count,"Navigation honors the browser's Autosave preference");
  } catch(error) {
    failures.push(error.stack);
  } finally {
    if(prior===null)localStorage.removeItem(key);else localStorage.setItem(key,prior);
  }
  document.getElementById("results").textContent=JSON.stringify({status:failures.length?"FAIL":"PASS",count:checks.length,failures,checks},null,2);
  document.body.dataset.status=failures.length?"FAIL":"PASS";
})();
</script>
</body>
</html>
