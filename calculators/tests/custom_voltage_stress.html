<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom circuit voltage stress checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:2200px;border:0}</style><h1>Custom networks, current load and Find VTOP voltage stress</h1><pre id="results">RUNNING</pre><iframe id="calculator" title="Calculator under test" src="../voltage_divider.html?custom-voltage-test=1"></iframe><script>
"use strict";
const checks=[],failures=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label);},near=(a,b)=>Math.abs(a-b)<=1e-10*Math.max(Math.abs(a),Math.abs(b),1e-12),pause=()=>new Promise(resolve=>setTimeout(resolve,25));
document.getElementById('calculator').addEventListener('load',async event=>{try{
 const frame=event.target,w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),svg=()=>get('liveSchematic'),state=()=>w.eval('schematicState'),errors=[];w.addEventListener('error',event=>errors.push(event.message));assert(await w.resistorCatalogReady,'Catalogs load');await w.circuitLogoReady;
 const baseline=JSON.stringify(w.eval('environmentSettings')),set=(id,value,type='input')=>{get(id).value=value;get(id).dispatchEvent(new w.Event(type,{bubbles:true}));},mode=value=>set('solveFor',value,'change'),reset=async()=>{get('dividerForm').reset();get('pairForm').reset();await pause();w.eval('environmentSettings='+baseline+';update()');};
 const metric=(id,key)=>svg().querySelector(`[data-resistor-stress="${id}"] [data-stress-metric="${key}"] [data-stress-value]`),parts=arm=>[...get(arm+'Parts').children].map(row=>row.id);
 const typeValue=(id,value)=>{svg().querySelector(`[data-schematic-edit="${id}"][data-edit-focus="value"]`).dispatchEvent(new w.MouseEvent('click',{bubbles:true}));const input=svg().querySelector('[data-inline-editor] input');assert(!!input,'Value entry opens directly for '+id);input.value=value;input.dispatchEvent(new w.Event('input',{bubbles:true}));input.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));assert(!svg().querySelector('[data-inline-editor]')&&!d.querySelector('dialog[open]'),'Value entry applies without a large dialog for '+id);};
 const add=(arm,id,connection='series')=>{w.editResistorConstruction(arm,id,connection);w.closeSchematicEditor(false);};
 assert(Number(get('vmax1').value)===50&&Number(get('vmax2').value)===50&&state().physical.r1[0].vmax===50&&metric('r1','v').textContent==='12.00%','The default 0805 manual parts start with a populated 50 V catalog reference and calculated Vstress');
 assert(w.packageVoltageReference('0805')===50&&w.packageVoltageReference('0402')===30&&w.packageVoltageReference('0201')===25&&w.packageVoltageReference('9999')===null,'Package references use documented conservative working-voltage limits; unknown packages remain unassessed');
 for(const connection of ['series','parallel','mixed']){
  await reset();w.setOperatingCondition('minC','-40');w.setOperatingCondition('maxC','85');w.setOperatingCondition('radiationPct','0.1');w.setOperatingCondition('agingPct','0.3');
  add('r1','r1');while(parts('r1').length<5)add('r1',parts('r1').at(-1));const ids=parts('r1');for(const id of ids)typeValue(id,'20k');typeValue('r2','649R');
  if(connection==='mixed'){w.storeTopology('r1',{connection:'series',children:[{connection:'parallel',children:ids.slice(0,2)},...ids.slice(2)]});w.update();}else set('r1Connection',connection);
  mode('vin');set('targetVout','.6');set('targetError','1');set('loadType','current');set('loadCurrent','0');set('loadCurrentTolerance','.1');
  const s=state(),top=connection==='series'?100000:connection==='parallel'?4000:70000,current=.6/649;
  assert(s&&near(s.circuit.vin,.6+current*top)&&s.environment.sourceTolerance&&s.bounds.vinMin<s.circuit.vin&&s.bounds.vinMax>s.circuit.vin,connection+': Find VTOP keeps the correct nominal source and complete trip interval');
  assert(s.physical.r1.length===5&&s.physical.r2.length===1&&Object.values(s.physical).flat().every(p=>p.vmax===50),connection+': every manually inserted part retains its working-voltage limit');
  for(const [index,id]of ids.entries()){
   const voltage=current*(connection==='parallel'?4000:connection==='mixed'&&index<2?10000:20000),p=s.physical.r1.find(p=>p.id===id);
   assert(near(p.voltage,voltage)&&near(p.stress.v,voltage/50*100)&&metric(id,'v').textContent===(voltage/50*100).toFixed(2)+'%',connection+'/'+id+': independent nominal voltage stress remains visible');
   assert(near(p.stress.p,voltage*voltage/20000/.25*100),connection+'/'+id+': existing power stress is preserved');
   assert(Number.isFinite(s.worst.byPart[id].v)&&s.worst.byPart[id].v>=p.stress.v,connection+'/'+id+': full-interval voltage stress is also assessed');
  }
  assert(metric('r2','v').textContent==='1.20%'&&near(s.physical.r2[0].stress.v,1.2),connection+': bottom-resistor voltage stress is calculated');
  mode('vout');mode('vin');assert(Object.values(state().physical).flat().every(p=>p.vmax===50&&Number.isFinite(p.stress.v)),connection+': switching calculator modes retains all per-part voltage ratings');
  const model=w.circuitExportModel(state(),'vin'),report=w.circuitLtspiceReport(model),saved=new DOMParser().parseFromString(w.circuitFrameSnapshot().markup,'image/svg+xml');assert(report.measurements.some(line=>line.startsWith('.meas op Vstress_pct '))&&!report.measurements.some(line=>line.includes('Vstress_unassessed_parts'))&&saved.querySelectorAll('[data-resistor-stress]').length===6&&w.schematicBomTsv().includes('1.20%'),connection+': SVG, copied BOM and LTspice retain the displayed voltage stress');
 }
 const first=parts('r1')[0];get(first+'Vmax').value='';delete get(first+'Vmax').dataset.voltageUnassessed;w.update();assert(state().physical.r1.find(p=>p.id===first).vmax===50&&Number(get(first+'Vmax').value)===50,'An existing custom design with an uninitialized voltage field is repaired without rebuilding its topology');
 set(first+'Vmax','75');typeValue(first,'22k');mode('vout');mode('vin');assert(state().physical.r1.find(p=>p.id===first).vmax===75,'A custom working-voltage limit survives value and mode changes');
 const catalog=await w.ResistorParts.load(),chosen=w.ResistorParts.evaluate(catalog,'vishay-tnpw-e3',{resistanceOhms:22000,tolerancePct:.1});w.applyCatalogPart(chosen,first,true);assert(state().physical.r1.find(p=>p.id===first).vmax===150&&state().physical.r1.find(p=>p.id===first).mpn===chosen.mpn,'Assigned catalog parts use their actual manufacturer limit instead of the manual reference');
 get(first+'Vmax').value='';delete get(first+'Vmax').dataset.voltageUnassessed;w.update();assert(state().physical.r1.find(p=>p.id===first).vmax===150&&state().physical.r1.find(p=>p.id===first).mpn===chosen.mpn,'An uninitialized assigned-part limit recovers its manufacturer rating and preserves its MPN');
 add('r1',first);const inherited=parts('r1').find(id=>id!==first&&Number(get(id+'Vmax').value)===150);assert(inherited&&state().physical.r1.find(p=>p.id===inherited).vmax===150,'An inserted sibling inherits the existing part working-voltage rating');
 set(inherited+'Vmax','');assert(state().physical.r1.find(p=>p.id===inherited).stress.v===null&&metric(inherited,'v').textContent==='—','An intentionally cleared rating is still unassessed, rather than invented from resistance or power');
 typeValue('r2','680R');mode('vin');set('loadCurrent','.05');assert(state().physical.r1.find(p=>p.id===inherited).stress.v===null&&metric(inherited,'v').textContent==='—','A deliberately unassessed part stays unassessed through other resistor, mode and current-load edits');
 await reset();typeValue('r1','12345R');svg().querySelector('[data-schematic-edit="r1"][data-edit-focus="power"]').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));const select=svg().querySelector('[data-inline-editor] select');select.value='0201';select.dispatchEvent(new w.Event('change',{bubbles:true}));assert(state().physical.r1[0].resistance===12345&&state().physical.r1[0].vmax===25&&!state().physical.r1[0].mpn,'A manual noncatalog value can change to a smaller package and receive that package voltage reference without a fabricated MPN');
 await reset();set('vmax1','');get('r1Multiple').click();assert(state().physical.r1[0].vmax===50,'Converting an unrated arm initializes a usable working-voltage reference for the new physical part');
 for(const width of [320,390,768,1440]){frame.style.width=width+'px';await pause();assert([...svg().querySelectorAll('[data-stress-value]')].every(n=>n.textContent!=='—'),width+'px: custom physical part voltage stress remains populated');}
 await reset();assert(!w.eval('leaveWarningActive')&&get('vmax1').dataset.voltageUnassessed!=='true','Reset restores populated defaults, clears unknown-rating intent and keeps the clean leave-page baseline');assert(errors.length===0,'No browser runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack);}document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2);});
</script></html>
