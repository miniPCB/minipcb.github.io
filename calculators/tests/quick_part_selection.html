 open('r1','value');pick('custom');input().value='12.345';input().dispatchEvent(new w.Event('input',{bubbles:true}));input().dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));assert(inline()&&!inline().querySelector('[role="alert"]').hidden&&input().getAttribute('aria-invalid')==='true'&&part('r1').resistance===10000&&!get('schematicEditor').open,'Unsupported catalog value shows a local inline error without changing the circuit');escape();
