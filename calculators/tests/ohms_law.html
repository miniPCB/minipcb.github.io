<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ohm’s Law calculator checks</title>
<style>body{font:16px system-ui}iframe{display:block;width:1280px;height:900px;border:0}pre{white-space:pre-wrap}</style>
<h1>Ohm’s Law calculator checks</h1>
<pre id="results">RUNNING</pre>
<script>
(async function () {
  const key = "minipcb-ohms-law-memory-v1", messages = [];
  const results = document.getElementById("results");
  if (!["localhost", "127.0.0.1"].includes(location.hostname)) {
    results.textContent = "Run from a local development server.";
    return;
  }
  const prior = localStorage.getItem(key), divider = localStorage.getItem("minipcb-divider-memory-v1");
  const frame = document.createElement("iframe");
  frame.title = "Ohm’s Law calculator under test";
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  function check(condition, description) {
    if (!condition) throw new Error(description);
    messages.push(`PASS ${description}`);
  }
  try {
    localStorage.removeItem(key);
    frame.src = "../ohms_law.html";
    const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
    document.body.append(frame); await loaded;
    const win = frame.contentWindow, doc = win.document, get = id => doc.getElementById(id);
    await win.ResistorParts.load();
    const query = selector => doc.querySelector(selector);
    const fire = (element, event) => element.dispatchEvent(new win.Event(event, { bubbles: true }));
    const field = name => query(`#characteristicsTable [data-field="${name}"]`).textContent;
    const readings = id => [...query(`[data-report-id="${id}"] table`).rows].map(row => row.cells[1].textContent);
    const entries = () => JSON.parse(localStorage.getItem(key)).entries;
    const change = (id, value) => { const input = get(id); input.value = value; fire(input, "input"); fire(input, "change"); };
    const mode = value => query(`[data-mode="${value}"]`).click();
    const select = id => { get("partSelect").value = id; fire(get("partSelect"), "change"); };
    const part = id => query(`#schematic [data-part="${id}"]`);
    const circuitQuantity = field => query(`[data-circuit-quantity="${field}"]`);
    const operatingValue = field => query(`[data-operating-value="${field}"]`);
    const resistorValue = id => part(id).querySelector("[data-resistor-value]");
    const hasRole = (element, role) => element.getAttribute("data-value-role") === role && element.getAttribute("fill") === {
      known: "#6ee7ac", calculated: "#ff8e8e", missing: "#ffcf73"
    }[role];
    const circuitGeometry = () => [get("schematic").getAttribute("viewBox"),
      ...[...doc.querySelectorAll("#schematic line, [data-voltage-source], [data-resistor-core], [data-current-value]")].map(node =>
        ["x", "y", "width", "height", "x1", "x2", "y1", "y2", "cx", "cy", "r"].map(attribute => node.getAttribute(attribute)).join())].join(" ");
    const stress = (id, metric) => part(id).querySelector(`[data-stress-metric="${metric}"] [data-stress-value]`).textContent;
    const reportedStress = (id, metric) => [...query(`[data-report-id="${id}"] table`).rows]
      .find(row => row.cells[0].textContent === `${metric} (nominal)`).cells[1].textContent;
    const stressBlocksFit = () => [...doc.querySelectorAll("[data-resistor-stress]")].every(group => {
      const bounds = group.getBBox(), block = group.parentElement.querySelector(".part-hit").getBBox();
      return bounds.x + bounds.width < block.x + block.width && bounds.y + bounds.height < block.y + block.height
        && [...group.children].every(row => {
          const label = row.firstElementChild.getBBox();
          return label.x + label.width < row.querySelector("[data-stress-value]").getBBox().x;
        });
    });
    const annotation = name => query(`[data-annotation="${name}"]`);
    const annotationText = name => [...annotation(name).querySelectorAll("text")].map(node => node.textContent).join(" ");
    const menu = get("constructionMenu");
    const rightClick = element => !element.dispatchEvent(new win.MouseEvent("contextmenu", { button: 2, clientX: 1240, clientY: 865, bubbles: true, cancelable: true }));
    const useMenu = kind => query(`#constructionMenu [data-connect="${kind}"]`).click();
    const keypress = (element, key, options = {}) => element.dispatchEvent(new win.KeyboardEvent("keydown", { key, bubbles: true, cancelable: true, ...options }));
    const edit = (name, value, save = true) => {
      fire(annotation(name).querySelector("text"), "click");
      get("annotationInput").value = value;
      query(save ? '#annotationForm [type="submit"]' : "#annotationCancel").click();
    };
    const currentArc = () => query("[data-current-direction] > path");
    const arcParameters = path => path.getAttribute("d").match(/[\d.]+/g).map(Number);
    const arrowDirection = () => currentArc() ? (arcParameters(currentArc())[6] ? 1 : -1) : 0;
    const centeredCurrent = expected => {
      const arc = currentArc(), value = arc?.parentElement.querySelector("[data-current-value]");
      if (!value) return false;
      const [start, top, radius, verticalRadius, , largeArc, , end] = arcParameters(arc);
      const centerX = (start + end) / 2, centerY = top + Math.sqrt(radius ** 2 - (start - centerX) ** 2);
      return radius === verticalRadius && largeArc === 1 && arc.hasAttribute("marker-end") && value.textContent === expected
        && value.getAttribute("text-anchor") === "middle" && value.getAttribute("dominant-baseline") === "central"
        && Math.abs(Number(value.getAttribute("x")) - centerX) < .01 && Math.abs(Number(value.getAttribute("y")) - centerY) < .01;
    };
    const balancedCurrent = () => {
      const arc = currentArc(), bounds = arc.getBBox(), [topRail, bottomRail] = arc.parentElement.parentElement.children;
      const caption = annotation("source");
      const rightEdge = element => { const box = element.getBBox(); return box.x + box.width; };
      const leftGap = bounds.x - Math.max(rightEdge(caption), rightEdge(caption.nextElementSibling));
      const firstBlock = Math.min(...[...doc.querySelectorAll("#schematic .part-hit")].map(block => block.getBBox().x));
      const rightGap = firstBlock - bounds.x - bounds.width;
      return bounds.y > Number(topRail.getAttribute("y1")) && bounds.y + bounds.height < Number(bottomRail.getAttribute("y1"))
        && leftGap > 0 && rightGap > 0 && Math.abs(leftGap - rightGap) < .05;
    };
    const groundLabelMatches = (inset, size) => {
      const symbol = query("[data-ground-symbol]"), label = annotation("ground").querySelector("text");
      const groundX = Number(symbol.firstElementChild.getAttribute("x1")), lastBarY = Number(symbol.lastElementChild.getAttribute("y1"));
      return Number(label.getAttribute("x")) - groundX === inset && Number(label.getAttribute("y")) - lastBarY === 2
        && label.getAttribute("font-size") === String(size) && label.getAttribute("font-weight") === "400" && label.getAttribute("fill") === "#54d2ff";
    };
    const centeredTitle = () => [...annotation("title").querySelectorAll("text")].every(node =>
      node.getAttribute("text-anchor") === "middle" && Number(node.getAttribute("x")) === Number(get("schematic").getAttribute("width")) / 2);
    const symbolMatches = (width, height, stroke) => {
      const core = part(1).querySelector("[data-resistor-core]"), leads = part(1).querySelectorAll("[data-symbol-lead]");
      return Number(core.getAttribute("width")) === width && Number(core.getAttribute("height")) === height
        && parseFloat(win.getComputedStyle(core).strokeWidth) === stroke && leads.length === 2
        && [...leads].every(lead => Number(lead.getAttribute("y2")) - Number(lead.getAttribute("y1")) === 20);
    };
    const memory = get("calculatorMemory"), tab = get("characteristicsToggle");

    check(field("current") === "12 mA" && field("power") === "144 mW", "default circuit calculates current and power");
    check(stress(1, "Pstress") === "102.86%" && stress(1, "Vstress") === "24.00%", "default resistor uses independent 140 mW and 50 V references");
    check(reportedStress(1, "Pstress") === "102.86%" && reportedStress(1, "Vstress") === "24.00%", "characteristics reports the same nominal stresses as the schematic");
    change("partPackage", "0402");
    check(stress(1, "Pstress") === "288.00%" && stress(1, "Vstress") === "40.00%", "footprint changes update both package denominators");
    change("partPackage", "Through-hole");
    check(stress(1, "Pstress") === "—" && stress(1, "Vstress") === "—" && field("power") === "144 mW", "unrated footprints leave stress unassessed while keeping the operating point");
    change("partPackage", "0805");
    check(stress(1, "Pstress") === "102.86%" && stress(1, "Vstress") === "24.00%", "restoring the initial footprint restores its stress values");
    check(field("resistanceRange") === "990 Ω to 1.01 kΩ", "default tolerance produces a resistance interval");
    check(symbolMatches(20, 52, 3), "full resistor body, stroke and leads match the voltage divider proportions");
    check(query('[data-ground-symbol] [data-symbol-lead="ground"]').getAttribute("x1") === query('[data-voltage-source]').getAttribute("cx"), "ground is centered directly below the source");
    check(groundLabelMatches(28, 16), "the full-size ground label matches the divider placement and type style");
    check(!memory.open && tab.getAttribute("aria-expanded") === "false", "the side drawers start collapsed");
    check(entries().length === 1 && localStorage.getItem("minipcb-divider-memory-v1") === divider, "history has an independent Original state");
    const originalId = entries()[0].id;
    const choices = [...doc.querySelectorAll(".mode-choice")];
    check(choices.map(button => button.querySelector("strong").textContent).join() === "Find Current,Find Voltage,Find Resistance"
      && choices.map(button => button.querySelector("span").textContent).join() === "Given V, R,Given I, R,Given V, I", "mode cards show the quantity to find and its required inputs");
    const initialGeometry = circuitGeometry();
    check(choices[0].getAttribute("aria-pressed") === "true" && hasRole(circuitQuantity("voltage"), "known")
      && hasRole(circuitQuantity("current"), "calculated") && hasRole(operatingValue("current"), "calculated")
      && hasRole(resistorValue(1), "known"), "Find Current highlights the same calculated quantity on the diagram and operating point");
    fire(circuitQuantity("voltage"), "click");
    check(doc.activeElement === get("voltage") && !circuitQuantity("current").hasAttribute("data-edit-quantity"), "the known voltage readout focuses its editor and the calculated current is read-only");
    mode("voltage");
    check(choices[1].getAttribute("aria-pressed") === "true" && circuitGeometry() === initialGeometry
      && hasRole(circuitQuantity("voltage"), "calculated") && hasRole(circuitQuantity("current"), "known")
      && hasRole(operatingValue("voltage"), "calculated"), "Find Voltage changes value roles while retaining the same circuit geometry");
    keypress(circuitQuantity("current"), "Enter");
    check(doc.activeElement === get("current") && !circuitQuantity("voltage").hasAttribute("data-edit-quantity"), "the known current readout is keyboard editable and the calculated source is read-only");
    change("current", "");
    check(hasRole(operatingValue("current"), "missing") && hasRole(circuitQuantity("voltage"), "calculated")
      && operatingValue("resistance").textContent === "1 kΩ" && query("[data-voltage-source]").getAttribute("stroke") === "#ff8e8e",
    "a missing input stays distinct from the unsolved voltage while the known network resistance remains visible");
    change("current", "12 mA");
    mode("resistance");
    check(choices[2].getAttribute("aria-pressed") === "true" && circuitGeometry() === initialGeometry
      && hasRole(circuitQuantity("voltage"), "known") && hasRole(circuitQuantity("current"), "known")
      && hasRole(resistorValue(1), "calculated") && hasRole(operatingValue("resistance"), "calculated"), "Find Resistance marks the target resistor and equivalent resistance consistently");
    mode("current");
    check(arrowDirection() === 1, "positive conventional current sweeps clockwise inside the circuit");
    check(centeredCurrent("12 mA") && balancedCurrent(), "the round arrow has equal clear space on both sides");
    const originalArrowX = query("[data-current-value]").getAttribute("x");
    check(centeredTitle(), "the default circuit title is centered in the frame");
    keypress(annotation("title"), "Enter");
    check(get("annotationEditor").open && doc.activeElement === get("annotationInput"), "the schematic title is keyboard-accessible and focuses its editor");
    get("annotationInput").value = "Draft title"; get("annotationCancel").click();
    check(annotationText("title") === "Ohm’s Law" && doc.activeElement === annotation("title"), "canceling a title edit restores its focus and prior value");
    edit("title", "Bench circuit with a centered editable title that wraps on phones");
    edit("source", "Bench supply"); edit("ground", "Signal ground"); edit("part-1", "Reference load");
    check(annotationText("source") === "Bench supply" && annotationText("ground") === "Signal ground" && annotationText("part-1") === "Reference load", "source, ground and individual resistor labels can all be edited on the drawing");
    check(query("[data-current-value]").getAttribute("x") !== originalArrowX && balancedCurrent(), "the arrow recenters when the source caption becomes wider");
    check(field("current") === "12 mA" && get("partSelect").selectedOptions[0].text === "Reference load (R1)", "custom labeling preserves electrical identity and updates the selector");

    change("voltage", "10 V"); change("resistance", "2 kΩ");
    check(get("resistance").value === "2" && get("resistanceUnit").value === "k" && field("current") === "5 mA", "unit suffix synchronizes the multiplier and live result");
    check(rightClick(part(1).querySelector("[data-resistor-core]")) && !menu.hidden && get("constructionTarget").textContent === "Reference load (R1)", "right-clicking a resistor body opens its construction menu");
    const menuBox = menu.getBoundingClientRect();
    check(menuBox.right <= frame.clientWidth && menuBox.bottom <= frame.clientHeight, "the menu stays inside the viewport near screen edges");
    keypress(doc.activeElement, "ArrowDown");
    check(doc.activeElement.dataset.connect === "parallel", "the construction menu supports keyboard navigation");
    keypress(doc.activeElement, "Escape");
    check(menu.hidden && doc.activeElement === part(1), "Escape closes the construction menu and restores schematic focus");
    keypress(part(1), "F10", { shiftKey: true });
    check(!menu.hidden && doc.activeElement.dataset.connect === "series", "Shift+F10 opens the same menu from the keyboard");
    useMenu("series");
    check(part(1) && part(2) && field("resistance") === "3 kΩ" && doc.activeElement === part(2), "adding in series through the menu grows the circuit and focuses the new part");
    part(1).dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    check(get("partSelect").value === "1" && doc.activeElement === get("resistance"), "SVG resistor is keyboard-operable and opens its editor");
    rightClick(annotation("part-1").querySelector("text")); useMenu("parallel");
    check(part(3) && field("resistance") === "1.6667 kΩ" && field("current") === "6 mA", "adding a parallel resistor to one part produces a mixed circuit");
    check(readings(1).slice(1, 4).join() === "4 V,2 mA,8 mW" && readings(2).slice(1, 4).join() === "6 V,6 mA,36 mW" && readings(3).slice(1, 4).join() === "4 V,4 mA,16 mW", "mixed-circuit readings obey voltage, current and power conservation");
    check([1, 2, 3].map(id => stress(id, "Pstress")).join() === "5.71%,25.71%,11.43%"
      && [1, 2, 3].map(id => stress(id, "Vstress")).join() === "8.00%,12.00%,8.00%", "each series or parallel resistor uses its own dissipation and absolute drop");
    check(get("schematic").querySelectorAll('circle[r="5"][data-wire-junction][fill="#54d2ff"]').length === 3, "parallel rails and ground have exactly three full-size junctions");
    change("tolerance", 5); change("partPackage", "1206");
    check(field("resistanceRange") === "1.632 kΩ to 1.7009 kΩ" && readings(3).slice(-2).join() === "±5%,1206", "tolerance changes the interval and package follows the physical resistor");
    check(stress(3, "Pstress") === "6.40%" && stress(3, "Vstress") === "4.00%" && stress(1, "Pstress") === "5.71%", "editing a package updates that resistor’s two stress readings only");

    mode("voltage"); change("current", "6 mA");
    check(field("voltage") === "10 V" && field("voltageRange") === "9.7919 V to 10.205 V", "current-driven mode solves voltage and its tolerance range");
    check(get("schematic").querySelector('line[stroke="#ff8e8e"]'), "the calculated source net is red");
    change("current", "-6 mA");
    check(field("voltage") === "-10 V" && field("power") === "60 mW" && field("voltageRange") === "-10.205 V to -9.7919 V", "signed current produces correctly ordered ranges and positive dissipation");
    check(stress(1, "Pstress") === "5.71%" && stress(1, "Vstress") === "8.00%", "reversed polarity leaves both stress percentages nonnegative");
    check(arrowDirection() === -1 && centeredCurrent("-6 mA"), "negative conventional current reverses the sweep and shows the signed value");
    change("current", "0");
    check(field("voltage") === "0 V" && field("power") === "0 W", "zero current gives a valid zero-voltage operating point");
    check(stress(1, "Pstress") === "0.00%" && stress(1, "Vstress") === "0.00%", "a valid zero operating point displays zero stress for a rated resistor");
    check(arrowDirection() === 0, "zero current has no directional arrow");
    change("current", "6 mA"); select(1); mode("resistance");
    check(get("solvedResistance").textContent === "2 kΩ" && get("resistanceField").hidden, "inverse mode calculates a physical resistor in a mixed circuit");
    select(3); change("resistance", "2k");
    check(readings(1)[0] === "1 kΩ" && !get("resistanceField").hidden, "the other physical resistors remain editable while solving for the target");
    mode("resistance");
    check(hasRole(resistorValue(1), "calculated") && hasRole(resistorValue(3), "known"), "reselecting the active mode keeps the current resistor target");
    get("solveSelected").click();
    check(get("solvedResistance").textContent === "1 kΩ", "the inverse calculation can target another resistor");
    change("current", "10mA");
    check(!get("calculationStatus").hidden && get("calculationStatus").textContent.includes("cannot reach") && field("resistance") === "—", "impossible inverse requests clear prior results and explain the problem");
    check(field("voltage") === "10 V" && field("current") === "10 mA" && hasRole(resistorValue(3), "calculated"), "an unsolved resistance leaves available inputs visible and the target marked");
    check(stress(3, "Pstress") === "—" && stress(3, "Vstress") === "—", "an invalid operating point clears each stress result");
    check(arrowDirection() === 0, "a failed solve clears the current arrow");
    change("current", "6mA");
    await wait(1100);
    const saved = entries().find(entry => entry.state.mode === "resistance" && entry.state.target === 3);
    check(saved?.state.network.children[0].children[1].package === "1206" && saved.state.network.children[0].children[0].label === "Reference load" && saved.state.sourceLabel === "Bench supply", "memory autosaves the custom labels with the complete valid inverse circuit");
    get("current").value = "7mA"; fire(get("current"), "input");
    await wait(1100);
    check(entries()[0].id === saved.id, "live input drafts are excluded from autosave");
    change("current", "0");
    await wait(1100);
    check(entries()[0].id === saved.id, "invalid inverse inputs are excluded from autosave");

    memory.querySelector("summary").click(); await wait(250);
    tab.click(); await wait(250);
    check(memory.open && tab.getAttribute("aria-expanded") === "true", "both drawers can remain open on wide screens");
    get("characteristicsClose").focus();
    get("characteristicsClose").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    check(memory.open && doc.activeElement === tab && tab.getAttribute("aria-expanded") === "false", "Escape closes the focused right drawer and returns focus");
    query(`[data-memory-restore="${saved.id}"]`).click(); await wait(50);
    check(get("partSelect").value === "3" && get("solvedResistance").textContent === "1 kΩ" && field("current") === "6 mA", "memory restores the topology, inputs and target, then recalculates");
    check(annotationText("part-1") === "Reference load" && annotationText("title").startsWith("Bench circuit"), "recall restores the title and labels");
    get("memoryClose").click();
    check(!memory.open && doc.activeElement === memory.querySelector("summary"), "Memory close returns focus to the edge tab");

    frame.style.width = "390px"; await wait(250);
    check(doc.documentElement.scrollWidth <= frame.clientWidth && !get("viewToggle").hidden, `phone layout fits without page-level horizontal scrolling (${doc.documentElement.scrollWidth}/${frame.clientWidth}px; desktop toggle ${get("viewToggle").hidden ? "hidden" : "visible"})`);
    check(choices.every(button => button.getBoundingClientRect().height >= 44 && win.getComputedStyle(button.querySelector("span")).display !== "none"),
      "phone mode cards keep touch-sized targets and visible input hints");
    check(symbolMatches(14, 38, 2.5) && query('[data-voltage-source]').getAttribute("r") === "19", "compact view uses the divider’s compact symbol proportions");
    check(centeredCurrent("6 mA") && balancedCurrent(), "the compact mixed network preserves equal horizontal clearance for the arrow");
    check(groundLabelMatches(20, 12), "the compact ground label keeps the same relative alignment and regular weight");
    check(stressBlocksFit(), "compact resistor stress rows fit their information blocks");
    check(centeredTitle() && annotation("title").querySelectorAll("text").length > 1, "long circuit titles wrap and remain centered on phones");
    get("editResistorLabel").click();
    check(get("annotationEditor").open, "phones can edit the selected label from the native resistor controls");
    get("annotationCancel").click();
    get("viewToggle").click();
    check(get("schematicViewport").scrollWidth > get("schematicViewport").clientWidth && field("current") === "6 mA", "desktop view exposes the full schematic and preserves results");
    check(symbolMatches(20, 52, 3), "desktop view on phones restores full-size symbol proportions");
    get("viewToggle").click();
    tab.click(); memory.querySelector("summary").click(); await wait(250);
    check(memory.open && tab.getAttribute("aria-expanded") === "false", "opening Memory closes an overlapping phone drawer");
    tab.click(); await wait(250);
    check(!memory.open && tab.getAttribute("aria-expanded") === "true", "opening characteristics closes an overlapping phone drawer");

    let downloaded;
    const createObjectURL = win.URL.createObjectURL.bind(win.URL);
    win.URL.createObjectURL = blob => { downloaded = blob; return createObjectURL(blob); };
    win.HTMLAnchorElement.prototype.click = function () {};
    get("downloadCircuit").click();
    for (let attempt = 0; !downloaded && attempt < 40; attempt++) await wait(50);
    const exported = new DOMParser().parseFromString(await downloaded.text(), "image/svg+xml");
    check(downloaded.type === "image/svg+xml" && !exported.querySelector("parsererror"), "SVG download is valid vector markup");
    check(exported.querySelector("image").getAttribute("href").startsWith("data:image/png;base64,") && !exported.querySelector("[data-schematic-control], [data-edit-quantity], [data-part], foreignObject, .part-hit, .control-hit"), "exports embed the logo and exclude editing controls");
    check(hasRole(exported.querySelector('[data-operating-value="resistance"]'), "calculated")
      && hasRole(exported.querySelector('[data-circuit-quantity="current"]'), "known"), "SVG downloads preserve the live mode’s value roles");
    check(exported.querySelector('[data-current-direction="forward"] > path[marker-end="url(#currentArrowHead)"]')
      && exported.querySelector("#currentArrowHead") && exported.querySelector("[data-current-value]")?.textContent === "6 mA", "the export retains the round path, embedded arrowhead, and centered value");
    check(exported.querySelectorAll('[data-resistor-stress][data-stress-basis="nominal"]').length === 3
      && exported.querySelector('[data-resistor-stress="3"] [data-stress-metric="Vstress"] [data-stress-value]').textContent === "4.00%", "SVG downloads include nominal stress in every resistor block");
    check(["Bench circuit", "Reference", "Signal ground"].every(label => exported.documentElement.textContent.includes(label)), "the export retains annotation text");
    check(exported.documentElement.textContent.includes("Unpublished source") || exported.querySelector("[data-build-commit]"), "export attributes the build or labels the source unpublished");

    mode("current");
    get("voltage").value = "9"; fire(get("voltage"), "input");
    get("voltage").value = "10"; fire(get("voltage"), "input");
    fire(get("voltage"), "blur");
    get("removePart").click();
    check(!part(3) && part(1) && part(2) && field("resistance") === "3 kΩ", "removing a branch reconnects the remaining circuit correctly");
    await wait(1100);
    check(entries()[0].state.network.children.length === 2 && entries()[0].state.network.kind === "series", "a reverted input draft does not prevent later topology edits from saving");
    check(rightClick(query("[data-voltage-source]")) && get("constructionTarget").textContent === "Entire circuit", "right-clicking the source targets the complete network");
    useMenu("parallel");
    check(field("resistance") === "750 Ω", "parallel at the source adds a branch across the entire circuit");
    fire(query("[data-voltage-source]"), "click"); useMenu("series");
    check(field("resistance") === "1.75 kΩ", "activating the source and adding in series places a resistor in the total loop");
    memory.querySelector("summary").click(); await wait(250);
    query(`[data-memory-restore="${originalId}"]`).click(); await wait(50);
    check(annotationText("part-1") === "R1" && annotationText("title") === "Ohm’s Law" && annotationText("source") === "VDC" && field("current") === "12 mA", "a snapshot without labels recalls with the original defaults");
    get("memoryClose").click();

    const mainSource = () => query("[data-voltage-source]");
    const sourceAction = kind => query(`[data-add-source="${kind}"]`);
    const addition = key => query(`[data-added-source="${key}"]`);
    const addedCore = key => addition(key).querySelector("[data-added-source-core]");
    const addSource = kind => { rightClick(mainSource()); sourceAction(kind).click(); };
    rightClick(part(1).querySelector("[data-resistor-core]"));
    check(sourceAction("voltage").hidden && sourceAction("current").hidden, "resistor menus retain only resistor construction actions");
    keypress(doc.activeElement, "Escape");
    check(rightClick(mainSource()) && !sourceAction("voltage").hidden && !sourceAction("current").hidden, "the voltage source menu offers both additional source types");
    keypress(doc.activeElement, "End");
    check(doc.activeElement === sourceAction("current"), "source construction choices are reachable through menu keyboard navigation");
    sourceAction("voltage").click();
    check(!get("sourceEditor").hidden && get("sourceSelect").value === "V2" && doc.activeElement === get("addedSource")
      && field("voltage") === "12 V", "adding a series source starts at zero and focuses its editor");
    change("addedSource", "3 V");
    check(field("voltage") === "15 V" && field("current") === "15 mA" && field("mainVoltage") === "12 V"
      && addedCore("V2").getAttribute("cx") === mainSource().getAttribute("cx")
      && Number(addedCore("V2").getAttribute("cy")) < Number(mainSource().getAttribute("cy")), "a series voltage source stacks on the branch and adds to the load voltage");
    addSource("voltage"); change("addedSource", "-1 V");
    check(field("voltage") === "14 V" && field("V3") === "-1 V", "multiple series voltages combine algebraically");
    addSource("current"); change("addedSource", "4 mA");
    check(field("voltage") === "14 V" && field("current") === "14 mA" && field("voltageBranchCurrent") === "10 mA"
      && Number(addedCore("I1").getAttribute("cx")) < Number(mainSource().getAttribute("cx"))
      && addition("I1").querySelector('[data-source-direction="into-supply"]'), "the parallel current source injects into the rail and changes voltage-branch current");
    addSource("current"); change("addedSource", "-2 mA");
    check(field("voltageBranchCurrent") === "12 mA" && field("I2") === "-2 mA", "signed parallel injections sum independently of the load current");
    fire(addition("I1"), "click");
    check(get("sourceSelect").value === "I1" && doc.activeElement === get("addedSource"), "clicking a source symbol focuses that source’s signed value");
    change("addedSource", "17 mA");
    check(field("voltageBranchCurrent") === "-1 mA" && centeredCurrent("14 mA"), "a large injection can reverse the voltage-branch current while the load arrow remains correct");
    change("addedSource", "4 mA");
    mode("voltage");
    check(field("voltage") === "12 V" && field("mainVoltage") === "10 V" && field("voltageBranchCurrent") === "10 mA"
      && circuitQuantity("voltage").textContent === "10 V", "Find Voltage solves the main voltage after accounting for the added series sources");
    mode("resistance"); change("current", "7 mA");
    check(field("voltage") === "14 V" && field("resistance") === "2 kΩ" && field("voltageBranchCurrent") === "5 mA"
      && resistorValue(1).textContent === "2 kΩ", "Find Resistance uses the total load voltage and the entered load current");
    change("addedSource", "");
    check(get("calculationStatus").textContent.includes("I1") && field("voltageBranchCurrent") === "—", "a missing extra-source value identifies the component and clears the unsolved branch current");
    change("addedSource", "4 mA");
    check(doc.documentElement.scrollWidth <= frame.clientWidth && get("sourceSelect").options.length === 4, "all additional sources are available through the fitted phone editor");
    await wait(1100);
    const sourceSnapshot = entries()[0];
    check(sourceSnapshot.state.sources?.length === 4 && sourceSnapshot.state.mode === "resistance", "memory saves the added source topology and signed inputs");
    downloaded = undefined;
    get("downloadCircuit").click();
    for (let attempt = 0; !downloaded && attempt < 40; attempt++) await wait(50);
    const sourcesExport = new DOMParser().parseFromString(await downloaded.text(), "image/svg+xml");
    check(sourcesExport.querySelectorAll("[data-added-source]").length === 4
      && !sourcesExport.querySelector("[data-schematic-control], [data-network-context]"), "static exports retain added source symbols and values");
    for (let remaining = 4; remaining > 0; remaining--) get("removeSource").click();
    check(get("sourceEditor").hidden && !query("[data-added-source]"), "removing the sources restores the original source layout");
    memory.querySelector("summary").click(); await wait(250);
    query(`[data-memory-restore="${sourceSnapshot.id}"]`).click(); await wait(50);
    check(addition("V2") && addition("I2") && field("resistance") === "2 kΩ" && field("voltageBranchCurrent") === "5 mA", "recall reconstructs the additional branches and recalculates their operating point");
    document.body.dataset.status = "PASS";
  } catch (error) {
    messages.push(`FAIL ${error.stack || error}`);
    document.body.dataset.status = "FAIL";
  } finally {
    frame.remove();
    if (prior === null) localStorage.removeItem(key); else localStorage.setItem(key, prior);
    results.textContent = messages.join("\n");
  }
})();
</script>
