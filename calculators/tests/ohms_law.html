<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ohm’s Law calculator checks</title>
<style>body{font:16px system-ui}iframe{display:block;width:1280px;height:900px;border:0}pre{white-space:pre-wrap}</style>
<h1>Ohm’s Law calculator checks</h1>
<pre id="results">RUNNING</pre>
<script>
(async function () {
  const key = "minipcb-ohms-law-memory-v1", messages = [];
  const results = document.getElementById("results");
  if (!["localhost", "127.0.0.1"].includes(location.hostname)) {
    results.textContent = "Run from a local development server.";
    return;
  }
  const prior = localStorage.getItem(key), divider = localStorage.getItem("minipcb-divider-memory-v1");
  const frame = document.createElement("iframe");
  frame.title = "Ohm’s Law calculator under test";
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  function check(condition, description) {
    if (!condition) throw new Error(description);
    messages.push(`PASS ${description}`);
  }
  try {
    localStorage.removeItem(key);
    frame.src = "../ohms_law.html";
    const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
    document.body.append(frame); await loaded;
    const win = frame.contentWindow, get = id => doc.getElementById(id);
    let doc = win.document;
    await win.ResistorParts.load();
    const query = selector => doc.querySelector(selector);
    const fire = (element, event) => element.dispatchEvent(new win.Event(event, { bubbles: true }));
    const field = name => query(`#characteristicsTable [data-field="${name}"]`).textContent;
    const readings = id => [...query(`[data-report-id="${id}"] table`).rows].map(row => row.cells[1].textContent);
    const entries = () => JSON.parse(localStorage.getItem(key)).entries;
    const change = (id, value) => { const input = get(id); input.value = value; fire(input, "input"); fire(input, "change"); };
    const mode = value => query(`[data-mode="${value}"]`).click();
    const select = id => { get("partSelect").value = id; fire(get("partSelect"), "change"); };
    const part = id => query(`#schematic [data-part="${id}"]`);
    const circuitQuantity = field => query(`[data-circuit-quantity="${field}"]`);
    const operatingValue = field => query(`[data-operating-value="${field}"]`);
    const operatingRange = field => query(`[data-operating-range="${field}"]`)?.textContent;
    const operatingFields = ["voltage", "current", "resistance", "power"];
    const resistorValue = id => query(`[data-resistor-value="${id}"]`);
    const resistorPower = id => query(`[data-resistor-power="${id}"]`).textContent;
    const hasRole = (element, role) => element.getAttribute("data-value-role") === role && element.getAttribute("fill") === {
      known: "#6ee7ac", calculated: "#ff8e8e", missing: "#ffcf73"
    }[role];
    const operatingPaletteMatches = (root = doc) => [
      ["voltage", "#75d5ff", "#12354b"], ["current", "#81e6b8", "#143d35"],
      ["resistance", "#ffd083", "#44331c"], ["power", "#d0acff", "#2c2348"]
    ].every(([field, accent, background]) => {
      const card = root.querySelector(`[data-operating-point="${field}"]`);
      const [panel, bar, label, value, range, ...extra] = card?.children || [];
      return panel?.getAttribute("fill") === background && bar?.getAttribute("fill") === accent
        && label?.getAttribute("fill") === accent && value?.getAttribute("fill") === accent
        && range?.getAttribute("fill") === accent && !extra.length;
    });
    const operatingTextFits = () => [...doc.querySelectorAll("[data-operating-point]")].every(tile => {
      const panel = tile.firstElementChild.getBBox();
      const boxes = [...tile.querySelectorAll("text")].map(label => label.getBBox());
      return panel.height === 82 && boxes.length === 3 && boxes.every((box, i) =>
        box.x >= panel.x && box.y >= panel.y && box.x + box.width <= panel.x + panel.width && box.y + box.height <= panel.y + panel.height
        && boxes.slice(i + 1).every(other => box.x + box.width <= other.x || other.x + other.width <= box.x
          || box.y + box.height <= other.y || other.y + other.height <= box.y));
    });
    const solveLegendMatches = (root = doc) => {
      const [known, knownLabel, calculated, calculatedLabel, ...extra] = root.querySelector("[data-solve-legend]")?.children || [];
      return known?.getAttribute("fill") === "#173b31" && knownLabel?.getAttribute("fill") === "#6ee7ac"
        && knownLabel.textContent === "Known" && calculated?.getAttribute("fill") === "#462b32"
        && calculatedLabel?.getAttribute("fill") === "#ff8e8e" && calculatedLabel.textContent === "Calculated" && !extra.length;
    };
    const circuitGeometry = () => [get("schematic").getAttribute("viewBox"),
      ...[...doc.querySelectorAll("#schematic line, [data-voltage-source], [data-current-source], [data-resistor-core], .part-info-box, [data-current-value], [data-voltmeter-panel]")].map(node =>
        ["x", "y", "width", "height", "x1", "x2", "y1", "y2", "cx", "cy", "r"].map(attribute => node.getAttribute(attribute)).join())].join(" ");
    const stress = (id, metric) => part(id).querySelector(`[data-stress-metric="${metric}"] [data-stress-value]`).textContent;
    const reportedStress = (id, metric) => [...query(`[data-report-id="${id}"] table`).rows]
      .find(row => row.cells[0].textContent === `${metric} (nominal)`).cells[1].textContent;
    const resistorReadingsFit = () => [...doc.querySelectorAll("[data-resistor-stress]")].every(group => {
      const bounds = group.getBBox(), block = group.parentElement.querySelector(".part-info-box").getBBox();
      const powerRow = group.previousElementSibling, powerBounds = powerRow.getBBox();
      return powerBounds.y + powerBounds.height < bounds.y && bounds.y + bounds.height < block.y + block.height
        && [powerRow, ...group.children].every(row => {
          const label = row.firstElementChild.getBBox();
          const value = row.children[1].getBBox();
          return label.x + label.width < value.x && value.x + value.width < block.x + block.width;
        });
    });
    const annotation = name => query(`[data-annotation="${name}"]`);
    const annotationText = name => [...annotation(name).querySelectorAll("text")].map(node => node.textContent).join(" ");
    const menu = get("constructionMenu");
    const rightClick = element => !element.dispatchEvent(new win.MouseEvent("contextmenu", { button: 2, clientX: 1240, clientY: 865, bubbles: true, cancelable: true }));
    const useMenu = kind => query(`#constructionMenu [data-connect="${kind}"]`).click();
    const mainSource = kind => query(`[data-${kind}-source]`);
    const sourceGroup = () => query('[data-schematic-control="source"]');
    const sourceCard = (key, root = doc) => root.querySelector(`[data-source-info="${key}"]`);
    const sourceCardMatches = (key, root = doc) => {
      const card = sourceCard(key, root);
      const panel = card?.querySelector(".source-info-box"), partPanel = root.querySelector(".part-info-box");
      const fields = card?.querySelectorAll('rect[rx="6"]');
      return panel && partPanel && fields.length === (key === "current" || key === "voltage" ? 2 : 1)
        && ["fill", "stroke", "rx"].every(attribute => panel.getAttribute(attribute) === partPanel.getAttribute(attribute))
        && [...fields].every(field => field.getAttribute("height") === "34"
          && Number(field.getAttribute("x")) >= Number(panel.getAttribute("x"))
          && Number(field.getAttribute("y")) + 34 < Number(panel.getAttribute("y")) + Number(panel.getAttribute("height")));
    };
    const sourceAction = kind => query(`[data-change-source="${kind}"]`);
    const switchSource = (from, to) => { rightClick(mainSource(from)); sourceAction(to).click(); };
    const componentAction = (id, action) => { fire(part(id), "click"); get(action).click(); };
    const visibleMenuActions = () => [...menu.querySelectorAll("button:not([hidden])")].map(button => button.textContent);
    const resistorActions = "Add resistor in series,Add resistor in parallel";
    const keypress = (element, key, options = {}) => element.dispatchEvent(new win.KeyboardEvent("keydown", { key, bubbles: true, cancelable: true, ...options }));
    const edit = (name, value, save = true) => {
      fire(annotation(name).querySelector("text"), "click");
      get("annotationInput").value = value;
      query(save ? '#annotationForm [type="submit"]' : "#annotationCancel").click();
    };
    const schematicInput = key => query(`#schematic [data-schematic-input="${key}"]`);
    const schematicUnit = key => query(`#schematic [data-schematic-unit="${key}"]`);
    const quantityTypographyMatches = (...keys) => keys.every(key => [schematicInput(key), schematicUnit(key)].every(control =>
      win.getComputedStyle(control).fontSize === "24px" && control.offsetHeight === 34));
    const chooseUnit = (key, prefix) => {
      const selector = schematicUnit(key);
      selector.value = prefix; fire(selector, "change");
    };
    const type = (input, value) => { input.value = value; fire(input, "input"); };
    const enterValue = (key, value) => {
      const input = schematicInput(key);
      input.focus(); type(input, value); keypress(input, "Enter");
    };
    const pickPackage = (id, value) => {
      const input = schematicInput(`package-${id}`);
      input.value = value; fire(input, "change");
    };
    const partSettingsAligned = id => {
      const tolerance = schematicInput(`tolerance-${id}`).getBoundingClientRect();
      const footprint = schematicInput(`package-${id}`).getBoundingClientRect();
      return tolerance.top === footprint.top && tolerance.right < footprint.left;
    };
    const componentValuesFit = () =>
      [...doc.querySelectorAll("foreignObject.component-field")].every(field => field.getAttribute("height") === "34"
        && Number.parseFloat(win.getComputedStyle(field.querySelector("[data-schematic-input]")).fontSize) >= 18)
      && [...doc.querySelectorAll(":is([data-resistor-info], [data-source-info]) [data-field-readout]")].every(readout => {
        const value = readout.getBBox(), box = readout.previousElementSibling.getBBox();
        return value.x >= box.x && value.x + value.width <= box.x + box.width
          && value.y >= box.y + 2 && value.y + value.height <= box.y + box.height - 2;
      });
    const pickTolerance = (id, value) => {
      const input = schematicInput(`tolerance-${id}`);
      input.value = value; fire(input, "change");
    };
    const currentArc = () => query("[data-current-direction] > path");
    const arrowHasStroke = (stroke, root = doc) => root.querySelector("[data-current-direction] > path")?.getAttribute("stroke") === stroke
      && root.querySelector("#currentArrowHead path")?.getAttribute("stroke") === stroke;
    const arcParameters = path => path.getAttribute("d").match(/[\d.]+/g).map(Number);
    const arrowDirection = () => currentArc() ? (arcParameters(currentArc())[6] ? 1 : -1) : 0;
    const currentEditorClearance = () => {
      const arc = currentArc(), { width, height } = schematicInput("current").closest("foreignObject").getBBox();
      return arcParameters(arc)[2] - Number(arc.getAttribute("stroke-width")) / 2 - Math.hypot(width / 2, height / 2);
    };
    const centeredCurrent = expected => {
      const arc = currentArc(), value = arc?.parentElement.querySelector("[data-current-value]");
      if (!value) return false;
      const [start, top, radius, verticalRadius, , largeArc, , end] = arcParameters(arc);
      const centerX = (start + end) / 2, centerY = top + Math.sqrt(radius ** 2 - (start - centerX) ** 2);
      return radius === verticalRadius && largeArc === 1 && arc.hasAttribute("marker-end") && value.textContent === expected
        && value.getAttribute("text-anchor") === "middle" && value.getAttribute("dominant-baseline") === "central"
        && Math.abs(Number(value.getAttribute("x")) - centerX) < .01 && Math.abs(Number(value.getAttribute("y")) - centerY) < .01;
    };
    const balancedInstrument = (shape = currentArc()) => {
      const bounds = shape.getBBox(), [topRail, bottomRail] = shape.parentElement.parentElement.children;
      const source = query(".source-info-box").getBBox();
      const compact = query("[data-voltage-source], [data-current-source]").getAttribute("r") === "19";
      const leftGap = bounds.x - source.x - source.width;
      const firstBlock = Math.min(...[...doc.querySelectorAll("#schematic .part-hit")].map(block => block.getBBox().x));
      const rightGap = firstBlock - bounds.x - bounds.width;
      const minClearance = compact ? 26 : 32;
      return bounds.y > Number(topRail.getAttribute("y1")) && bounds.y + bounds.height < Number(bottomRail.getAttribute("y1"))
        && Math.min(leftGap, rightGap) >= minClearance - .05 && Math.abs(leftGap - rightGap) < .05;
    };
    const voltmeterMatches = (reading, root = doc) => {
      const meter = root.querySelector("[data-voltmeter]"), panel = meter?.querySelector("[data-voltmeter-panel]");
      if (!panel || panel.localName !== "rect" || meter.querySelectorAll("circle").length !== 2
        || root.querySelector("[data-current-direction]")) return false;
      const [topLead, bottomLead] = meter.querySelectorAll("line"), [topNode, bottomNode] = meter.querySelectorAll("[data-wire-junction]");
      const [topRail, bottomRail] = meter.parentElement.children;
      const x = String(Number(panel.getAttribute("x")) + Number(panel.getAttribute("width")) / 2);
      const top = Number(panel.getAttribute("y")), height = Number(panel.getAttribute("height"));
      const joined = (lead, node, rail, fill) => lead.getAttribute("x1") === x && lead.getAttribute("x2") === x
        && lead.hasAttribute("stroke-dasharray") && lead.getAttribute("stroke") === fill
        && node.getAttribute("cx") === x && node.getAttribute("cy") === rail.getAttribute("y1") && node.getAttribute("fill") === fill;
      const value = meter.querySelector("[data-voltmeter-value]");
      return joined(topLead, topNode, topRail, "#ff8e8e") && joined(bottomLead, bottomNode, bottomRail, "#54d2ff")
        && topLead.getAttribute("y1") === topRail.getAttribute("y1") && Number(topLead.getAttribute("y2")) === top
        && Number(bottomLead.getAttribute("y1")) === top + height && bottomLead.getAttribute("y2") === bottomRail.getAttribute("y1")
        && value.textContent === reading && hasRole(value, "calculated") && value.getAttribute("text-anchor") === "middle"
        && value.getAttribute("x") === x && meter.querySelector("text").textContent === "Load voltage";
    };
    const groundLabelMatches = (inset, size) => {
      const symbol = query("[data-ground-symbol]"), label = annotation("ground").querySelector("text");
      const groundX = Number(symbol.firstElementChild.getAttribute("x1")), lastBarY = Number(symbol.lastElementChild.getAttribute("y1"));
      return Number(label.getAttribute("x")) - groundX === inset && Number(label.getAttribute("y")) - lastBarY === 2
        && label.getAttribute("font-size") === String(size) && label.getAttribute("font-weight") === "400" && label.getAttribute("fill") === "#54d2ff";
    };
    const centeredTitle = () => [...annotation("title").querySelectorAll("text")].every(node =>
      node.getAttribute("text-anchor") === "middle" && Number(node.getAttribute("x")) === Number(get("schematic").getAttribute("width")) / 2);
    const symbolMatches = (width, height, stroke) => {
      const core = part(1).querySelector("[data-resistor-core]"), leads = part(1).querySelectorAll("[data-symbol-lead]");
      return Number(core.getAttribute("width")) === width && Number(core.getAttribute("height")) === height
        && parseFloat(win.getComputedStyle(core).strokeWidth) === stroke && leads.length === 2
        && [...leads].every(lead => Number(lead.getAttribute("y2")) - Number(lead.getAttribute("y1")) === 20);
    };
    const memory = get("calculatorMemory"), tab = get("characteristicsToggle");
    const frameDialog = get("frameExportDialog");
    const requestImage = format => {
      fire(get("downloadCircuit"), "click");
      frameDialog.querySelector(`[data-frame-format="${format}"]`).click();
    };
    const schematicConnections = text => {
      const neighbors = new Map(), flags = new Map();
      const point = (x, y) => `${x},${y}`;
      const connect = (a, b) => {
        if (!neighbors.has(a)) neighbors.set(a, []);
        neighbors.get(a).push(b);
      };
      for (const [, x1, y1, x2, y2] of text.matchAll(/^WIRE (-?\d+) (-?\d+) (-?\d+) (-?\d+)$/gm)) {
        const a = point(x1, y1), b = point(x2, y2);
        connect(a, b); connect(b, a);
      }
      for (const [, x, y, name] of text.matchAll(/^FLAG (-?\d+) (-?\d+) (\w+)$/gm)) flags.set(point(x, y), name);
      const netAt = (x, y) => {
        const seen = new Set(), nets = new Set(), queue = [point(x, y)];
        while (queue.length) {
          const pin = queue.pop();
          if (seen.has(pin)) continue;
          seen.add(pin);
          if (flags.has(pin)) nets.add(flags.get(pin));
          queue.push(...(neighbors.get(pin) || []));
        }
        return [...nets].join(",");
      };
      return [...text.matchAll(/^SYMBOL (res|voltage|current) (-?\d+) (-?\d+) (R0|R180)\r?\nSYMATTR InstName (\w+)\r?\nSYMATTR Value (\S+)$/gm)]
        .map(([, kind, x, y, orientation, name, value]) => {
          const pinX = Number(x) + (kind === "res" ? 16 : 0);
          const pinY = Number(y) + (kind === "current" ? 0 : 16);
          return `${name} ${netAt(pinX, pinY)} ${netAt(pinX, pinY + (orientation === "R180" ? -80 : 80))} ${Number(Number(value).toPrecision(15))}`;
        });
    };

    check(field("current") === "12 mA" && field("power") === "144 mW", "default circuit calculates current and power");
    check(sourceCardMatches("voltage") && sourceCard("voltage").contains(annotation("source"))
      && schematicInput("voltage").closest("foreignObject").classList.contains("component-field")
      && schematicInput("tolerance-voltage").closest("foreignObject").classList.contains("component-field"),
      "the voltage source groups its editable label, value and tolerance in a matching component card");
    check(componentValuesFit() && +resistorValue(1).getAttribute("font-size") >= 22,
      "larger editable and static source and resistor values fit the existing 34-pixel fields");
    check(resistorPower(1) === "144 mW" && operatingValue("power").textContent === "144 mW"
      && operatingValue("power").previousElementSibling.textContent === "Total power", "the resistor and total readings match for a single load");
    check(stress(1, "Pstress") === "102.86%" && stress(1, "Vstress") === "24.00%", "default resistor uses independent 140 mW and 50 V references");
    check(reportedStress(1, "Pstress") === "102.86%" && reportedStress(1, "Vstress") === "24.00%", "characteristics reports the same nominal stresses as the schematic");
    const packageEditor = schematicInput("package-1");
    check(packageEditor.tagName === "SELECT" && packageEditor.value === "0805" && packageEditor.selectedOptions[0].text === "0805"
      && !get("powerRatingDialog"), "a single control displays the default footprint size");
    check([...packageEditor.options].map(option => option.text).join() === "0201,0402,0603,0805,1206,1210,2010,2512",
      "the dropdown lists only SMT package sizes");
    check(packageEditor.getAttribute("aria-label") === "R1 footprint" && schematicInput("tolerance-1").getAttribute("aria-label") === "R1 tolerance (%)"
      && partSettingsAligned(1) && ![...get("schematic").querySelectorAll("text")].some(label => ["Package", "Tolerance"].includes(label.textContent)),
      "the side-by-side controls keep accessible names and omit visible captions");
    pickPackage(1, "0402");
    check(packageEditor.selectedOptions[0].text === "0402" && stress(1, "Pstress") === "288.00%" && stress(1, "Vstress") === "40.00%",
      "choosing a footprint reference updates both stresses");
    pickPackage(1, "0805");
    check(packageEditor.selectedOptions[0].text === "0805" && stress(1, "Pstress") === "102.86%" && stress(1, "Vstress") === "24.00%",
      "returning to the original footprint restores both stress readings");
    check(field("resistanceRange") === "990 Ω to 1.01 kΩ", "default tolerance produces a resistance interval");
    const tolerance = schematicInput("tolerance-1");
    check(tolerance.tagName === "SELECT" && tolerance.selectedOptions[0].textContent === "±1%"
      && [...tolerance.options].some(option => option.textContent === "±0.1%"), "the schematic uses a native tolerance dropdown");
    check(operatingRange("voltage") === "12 V to 12 V" && operatingRange("current") === "11.881 mA to 12.121 mA"
      && operatingRange("resistance") === "990 Ω to 1.01 kΩ" && operatingRange("power") === "142.57 mW to 145.45 mW"
      && operatingFields.every(key => operatingRange(key) === field(`${key}Range`)),
      "all four tiles and the characteristics agree on the fixed-voltage intervals");
    const voltageTolerance = schematicInput("tolerance-voltage");
    pickTolerance("voltage", "5");
    check(voltageTolerance.value === "5" && field("sourceTolerance") === "±5%" && field("current") === "12 mA"
      && operatingRange("voltage") === "11.4 V to 12.6 V" && operatingRange("current") === "11.287 mA to 12.727 mA"
      && operatingRange("power") === "128.67 mW to 160.36 mW",
      "the supply and resistor tolerances jointly bound current and power at the nominal circuit settings");
    pickTolerance("voltage", "0");
    pickTolerance(1, "custom");
    const customTolerance = get("customTolerance"), toleranceForm = get("toleranceForm");
    check(get("toleranceDialog").open && customTolerance.value === "1" && tolerance.value === "1",
      "choosing a custom tolerance opens the current value for editing");
    customTolerance.value = "100"; toleranceForm.requestSubmit();
    check(!customTolerance.validity.valid && field("resistanceRange") === "990 Ω to 1.01 kΩ", "an invalid custom tolerance leaves the range intact");
    customTolerance.value = "3.7"; fire(customTolerance, "input"); toleranceForm.requestSubmit(); await wait(30);
    check(!get("toleranceDialog").open && tolerance.value === "3.7" && tolerance.selectedOptions[0].textContent === "±3.7%"
      && doc.activeElement === tolerance && field("resistanceRange") === "963 Ω to 1.037 kΩ",
      "a valid custom tolerance becomes a selected option and updates the resistance range");
    pickTolerance(1, "0");
    check(operatingRange("current") === "12 mA to 12 mA" && operatingRange("power") === "144 mW to 144 mW",
      "an exact source and resistor give equal current and power endpoints");
    pickTolerance(1, "1");
    check(symbolMatches(20, 52, 3), "full resistor body, stroke and leads match the voltage divider proportions");
    check(query('[data-ground-symbol] [data-symbol-lead="ground"]').getAttribute("x1") === query('[data-voltage-source]').getAttribute("cx"), "ground is centered directly below the source");
    check(groundLabelMatches(28, 16), "the full-size ground label matches the divider placement and type style");
    check(!memory.open && tab.getAttribute("aria-expanded") === "false", "the side drawers start collapsed");
    check(entries().length === 1 && localStorage.getItem("minipcb-divider-memory-v1") === divider, "history has an independent Original state");
    const originalId = entries()[0].id;
    const choices = [...doc.querySelectorAll(".mode-choice")];
    const solveTabs = query(".mode-picker"), diagram = query(".diagram"), circuitFields = get("circuitFields");
    check(solveTabs.children.length === 3 && choices.every(button => button.parentElement === solveTabs)
      && circuitFields.hidden && circuitFields.inert && query(".workbench").children.length === 2,
      "the schematic occupies the workspace beside the mode rail and backing inputs are inert");
    check(get("toolNav").contains(get("ltspiceDownload")) && get("toolNav").contains(get("markdownDownload"))
      && diagram.contains(get("downloadCircuit")), "data downloads are in the toolbar and image download is inside the circuit frame");
    check(Math.abs(solveTabs.getBoundingClientRect().right - diagram.getBoundingClientRect().left) <= 1.1,
      "desktop mode tabs are docked to the schematic edge");
    check(choices.map(button => button.querySelector("strong").textContent).join() === "Find Current,Find Voltage,Find Resistance"
      && choices.map(button => button.querySelector("span").textContent).join() === "Given V, R,Given I, R,Given V, I", "mode cards show the quantity to find and its required inputs");
    const initialGeometry = circuitGeometry();
    check(choices[0].getAttribute("aria-pressed") === "true" && hasRole(circuitQuantity("voltage"), "known")
      && hasRole(circuitQuantity("current"), "calculated") && operatingValue("current").dataset.valueRole === "calculated"
      && hasRole(resistorValue(1), "known"), "Find Current identifies the calculated quantity on the diagram and in the tile metadata");
    check(operatingPaletteMatches(), "nominal values and ranges match the label and accent color on every tile");
    const sizes = selector => [...doc.querySelectorAll(selector)].map(node => Number(node.getAttribute("font-size")));
    const nominals = sizes("[data-operating-value]"), intervals = sizes("[data-operating-range]");
    check(operatingTextFits() && Math.min(...nominals) >= 32 && Math.max(...nominals) - Math.min(...nominals) < 1
      && Math.min(...intervals) >= 20 && Math.max(...intervals) - Math.min(...intervals) < 1
      && !get("schematic").textContent.includes("Range at fixed"), "the desktop cards use consistent type sizes and show ranges without a caption");
    check(solveLegendMatches(), "the schematic legend contains only the two tinted solve-role badges");
    check(!get("schematic").textContent.includes("Nominal stress · package reference limits"), "the schematic footer ends with the solve legend");
    check(schematicInput("voltage").tagName === "INPUT" && schematicInput("voltage").value === "12"
      && schematicUnit("voltage").selectedOptions[0].textContent === "V" && !schematicInput("current") && !schematicUnit("current"),
      "the known voltage has a numeric field and a unit selector while calculated current is read-only");
    check([...schematicUnit("voltage").options].map(option => option.text).join() === "µV,mV,V,kV,MV,GV",
      "the voltage selector retains its original unit choices");
    const sourceInput = schematicInput("voltage");
    enterValue("voltage", "-6 V");

    check(exported.querySelector('[data-resistor-package="3"]').getAttribute("font-size") === query('[data-resistor-package="3"]').getAttribute("font-size")
      && +exported.querySelector('[data-resistor-value="1"]').getAttribute("font-size") >= 22,
      "the vector download preserves enlarged static component values");
    check(solveLegendMatches(exported), "SVG downloads retain the two solve-role badges");
    check(exported.querySelector('[data-current-direction="forward"] > path[marker-end="url(#currentArrowHead)"]')
      && arrowHasStroke("#6ee7ac", exported) && exported.querySelector("[data-current-value]")?.textContent === "6 mA",
      "the export retains the green arrow for a known current and its centered value");
    check(exported.querySelectorAll('[data-resistor-stress][data-stress-basis="nominal"]').length === 3
      && exported.querySelector('[data-resistor-stress="3"] [data-stress-metric="Vstress"] [data-stress-value]').textContent === "4.00%", "SVG downloads include nominal stress in every resistor block");
    check([1, 2, 3].map(id => exported.querySelector(`[data-resistor-power="${id}"]`).textContent).join() === "8 mW,36 mW,16 mW"
      && exported.querySelector('[data-operating-value="power"]').textContent === "60 mW", "SVG downloads retain each resistor's dissipation and total power");
    check(operatingFields.every(key => exported.querySelector(`[data-operating-range="${key}"]`).textContent === field(`${key}Range`))
      && sourceCardMatches("voltage", exported) && sourceCard("voltage", exported).textContent.includes("Bench supply")
      && exported.querySelector('[data-source-tolerance="voltage"]').textContent === "±2%"
      && exported.querySelector('[data-resistor-package="3"]').textContent === "1206"
      && exported.querySelector('[data-resistor-package="3"]').getAttribute("y") === exported.querySelector('[data-resistor-tolerance="3"]').getAttribute("y"),
      "SVG downloads retain the source tolerance, range, and side-by-side resistor settings");
    check(["Bench circuit", "Reference", "Signal ground"].every(label => exported.documentElement.textContent.includes(label)), "the export retains annotation text");
    check(!exported.querySelector('#titleEditor, [aria-controls="titleEditor"]'), "the vector export omits the title editor and its control reference");
    check(exported.documentElement.textContent.includes("Unpublished source") || exported.querySelector("[data-build-commit]"), "export attributes the build or labels the source unpublished");

    for (const [format, type, suffix] of [["png", "image/png", ".png"], ["jpeg", "image/jpeg", ".jpg"], ["bmp", "image/bmp", ".bmp"]]) {
      downloaded = downloadedName = undefined;
      requestImage(format);
      for (let attempt = 0; !downloadedName && attempt < 40; attempt++) await wait(50);
      if (downloaded?.type !== type || !downloadedName?.endsWith(suffix) || downloaded.size < 1000) throw new Error(`Invalid ${format} export`);
    }
    check(!frameDialog.open, "PNG, JPEG and BMP downloads complete through the chooser");
    get("ltspiceDownload").click();
    const mixedSchematic = await downloaded.text();
    const mixedConnections = schematicConnections(mixedSchematic).join();
    check(downloadedName.endsWith(".asc") && mixedSchematic.startsWith("Version 4") && mixedSchematic.includes("!.op")
      && mixedConnections === "V1 LOAD 0 10,R1 LOAD N1 2000,R3 LOAD N1 1000,R2 N1 0 1000",
      "LTspice export wires the nominal mixed network and uses the solved physical resistor value");
    get("markdownDownload").click();
    const report = await downloaded.text();
    check(downloadedName.endsWith(".md") && report.startsWith("# Bench circuit") && report.includes("Find Resistance")
      && report.includes("| Total power | 60 mW |") && Math.abs(Number(report.match(/^R3 LOAD N1 (\S+)$/m)?.[1]) - 1000) < 1e-8
      && report.includes("| Vstress (nominal) | 4.00% |") && report.includes("| Package power reference | 250 mW |")
      && report.includes("| Voltage source tolerance | ±2% |") && report.includes("| Total power range | 56.465 mW to 63.751 mW |"),
      "Markdown includes the same tolerance interval as the mixed-network power tile");

    mode("current");
    get("voltage").value = "9"; fire(get("voltage"), "input");
    get("voltage").value = "10"; fire(get("voltage"), "input");
    fire(get("voltage"), "blur");
    componentAction(3, "removePart");
    check(!part(3) && part(1) && part(2) && field("resistance") === "3 kΩ", "removing a branch reconnects the remaining circuit correctly");
    await wait(1100);
    check(entries()[0].state.network.children.length === 2 && entries()[0].state.network.kind === "series", "a reverted input draft does not prevent later topology edits from saving");
    check(rightClick(query("[data-voltage-source]")) && get("constructionTarget").textContent === "Bench supply"
      && visibleMenuActions().join() === "Change to Current Source", "the voltage source menu identifies the source and offers only conversion to current");
    useMenu("parallel");
    check(field("resistance") === "3 kΩ" && !menu.hidden, "an inapplicable hidden action cannot add a resistor from the source menu");
    keypress(doc.activeElement, "Escape");
    memory.querySelector("summary").click(); await wait(250);
    query(`[data-memory-restore="${originalId}"]`).click(); await wait(50);
    check(annotationText("part-1") === "R1" && annotationText("title") === "Ohm’s Law" && annotationText("source") === "VDC" && field("current") === "12 mA", "a snapshot without labels recalls with the original defaults");
    get("memoryClose").click();

    rightClick(part(1).querySelector("[data-resistor-core]"));
    check(visibleMenuActions().join() === resistorActions, "returning to a resistor hides both source actions");
    keypress(doc.activeElement, "Escape");
    mode("resistance"); enterValue("current", "8 mA");
    pickTolerance("voltage", "1");
    const originalSymbol = mainSource("voltage");
    const originalPosition = ["cx", "cy", "r"].map(attribute => originalSymbol.getAttribute(attribute)).join();
    fire(originalSymbol, "click");
    check(!menu.hidden && visibleMenuActions().join() === "Change to Current Source"
      && doc.activeElement === sourceAction("current"), "tapping the source focuses the available type change");
    keypress(doc.activeElement, "Home");
    check(doc.activeElement === sourceAction("current"), "menu keyboard navigation skips the existing type");
    sourceAction("current").click();
    check(menu.hidden && doc.activeElement === sourceGroup() && !mainSource("voltage") && !query("[data-added-source]")
      && get("sourceEditor").hidden, "switching to current replaces the main source in place");
    check(["cx", "cy", "r"].map(attribute => mainSource("current").getAttribute(attribute)).join() === originalPosition
      && annotationText("source") === "IDC" && sourceGroup().querySelector("[data-source-direction]"), "the current symbol fits the same position and gets a matching default reference");
    check(field("voltage") === "12 V" && field("current") === "8 mA" && hasRole(circuitQuantity("current"), "known")
      && resistorValue(1).textContent === "1.5 kΩ" && hasRole(resistorValue(1), "known"),
      "changing sources preserves the voltage, current, and previously calculated resistor value");
    check(voltmeterMatches("12 V") && balancedInstrument(query("[data-voltmeter-panel]")),
      "the voltmeter replaces the arrow and connects to both rails with dashed leads and junction dots");
    mode("current"); mode("resistance"); fire(choices[2], "click");
    check(choices[0].disabled && !choices[1].disabled && choices[2].disabled && choices[1].getAttribute("aria-pressed") === "true"
      && schematicInput("current").value === "8" && schematicUnit("current").value === "m" && !schematicInput("voltage")
      && hasRole(circuitQuantity("voltage"), "calculated"), "a current source permits only Find Voltage and exposes the current editor");
    check(sourceCardMatches("current") && !sourceCard("voltage")
      && sourceCard("current").querySelector('[data-circuit-quantity="current"]').textContent === "8 mA"
      && quantityTypographyMatches("current", "resistance-1"),
      "the current source uses the same value and unit typography as the resistor card");

    edit("source", "Bench driver");
    const meterGeometry = circuitGeometry();
    const currentEditor = schematicInput("current");
    check([...schematicUnit("current").options].map(option => option.text).join() === "fA,nA,µA,mA,A,kA,MA,GA",
      "the current-source selector offers the additional small-current units");
    enterValue("current", "4"); chooseUnit("current", "n");
    check(currentEditor.value === "4" && get("currentUnit").value === "n" && field("current") === "4 nA" && voltmeterMatches("6 µV"),
      "selecting the nanoampere multiplier scales the source value and solved voltage");
    chooseUnit("current", "f");
    check(currentEditor.value === "4" && get("currentUnit").value === "f" && field("current") === "4 fA"
      && voltmeterMatches("0.000006 µV"), "selecting the femtoampere multiplier updates the calculation and readout");
    enterValue("current", "-2.5 nA");
    check(schematicUnit("current").value === "n" && field("current") === "-2.5 nA" && voltmeterMatches("-3.75 µV"),
      "a typed current suffix replaces the selected multiplier and preserves polarity");
    enterValue("current", "-2.5 fA");
    get("ltspiceDownload").click();
    check(schematicUnit("current").value === "f" && field("current") === "-2.5 fA"
      && schematicConnections(await downloaded.text()).join() === "IMAIN 0 LOAD -2.5e-15,R1 LOAD 0 1500",
      "the signed femtoampere value exports in amperes");
    check(operatingTextFits(), "long signed voltage and power readings fit without overlapping the labels");
    enterValue("current", "0");
    check(voltmeterMatches("0 V"), "the voltmeter stays present at zero and its top branch uses the calculated net color");
    enterValue("current", "-6 mA");
    check(field("voltage") === "-9 V" && voltmeterMatches("-9 V") && doc.activeElement === currentEditor
      && hasRole(circuitQuantity("current"), "known") && hasRole(circuitQuantity("voltage"), "calculated") && circuitGeometry() === meterGeometry,
      "the edited current sets the signed load voltage and preserves focus and geometry on phones");
    check(operatingRange("voltage") === "-9.09 V to -8.91 V" && field("voltageRange") === operatingRange("voltage"),
      "the load voltage range holds source current fixed");
    const currentTolerance = schematicInput("tolerance-current");
    check(currentTolerance.value === "0" && !schematicInput("tolerance-voltage"), "current tolerance starts independently of the voltage setting");
    pickTolerance("current", "custom");
    customTolerance.value = "2.4"; toleranceForm.requestSubmit(); await wait(30);
    check(doc.activeElement === currentTolerance && currentTolerance.value === "2.4" && field("sourceTolerance") === "±2.4%"
      && field("voltage") === "-9 V" && operatingRange("voltage") === "-9.3082 V to -8.6962 V"
      && operatingRange("current") === "-6.144 mA to -5.856 mA" && operatingRange("power") === "50.925 mW to 57.189 mW",
      "a custom current tolerance bounds signed voltage and current as well as nonnegative power");
    check(doc.documentElement.scrollWidth <= frame.clientWidth && groundLabelMatches(20, 12), "the replacement symbol keeps the schematic fitted on phones");
    await wait(1100);
    const sourceSnapshot = entries()[0];
    check(sourceSnapshot.state.sourceType === "current" && sourceSnapshot.state.mode === "voltage" && sourceSnapshot.state.current === -.006
      && sourceSnapshot.state.currentTolerance === 2.4 && sourceSnapshot.state.voltageTolerance === 1
      && !sourceSnapshot.state.sources, "memory saves the source type and signed input in the existing circuit");
    downloaded = undefined;
    requestImage("svg");
    for (let attempt = 0; !downloaded && attempt < 40; attempt++) await wait(50);
    const currentExport = new DOMParser().parseFromString(await downloaded.text(), "image/svg+xml");
    check(currentExport.querySelector("[data-current-source]") && currentExport.querySelector("[data-source-direction]")
      && voltmeterMatches("-9 V", currentExport)
      && sourceCardMatches("current", currentExport) && sourceCard("current", currentExport).textContent.includes("Bench driver")
      && currentExport.querySelector('[data-source-tolerance="current"]').textContent === "±2.4%"
      && !currentExport.querySelector("[data-voltage-source], [data-schematic-control], [data-network-context], foreignObject, [data-field-readout]"),
      "static image exports retain the current symbol and voltmeter with its reading");
    get("ltspiceDownload").click();
    check(schematicConnections(await downloaded.text()).join() === "IMAIN 0 LOAD -0.006,R1 LOAD 0 1500",
      "signed current-source downloads preserve source polarity and the resistor value");
    check(rightClick(annotation("source")) && get("constructionTarget").textContent === "Bench driver"
      && visibleMenuActions().join() === "Change to Voltage Source" && doc.activeElement === sourceAction("voltage"), "the source label opens the reverse conversion choice");
    sourceAction("voltage").click();
    check(mainSource("voltage") && !mainSource("current") && !query("[data-voltmeter], [data-added-source]") && annotationText("source") === "Bench driver",
      "reversing the conversion removes the meter and preserves the custom source label");
    check(field("resistance") === "1.5 kΩ" && field("voltage") === "-9 V" && centeredCurrent("-6 mA") && arrowHasStroke("#ff8e8e")
      && choices[0].getAttribute("aria-pressed") === "true" && choices[1].disabled && !choices[2].disabled && field("sourceTolerance") === "±1%",
      "converting to voltage enables current and resistance and preserves a valid operating point");
    memory.querySelector("summary").click(); await wait(250);
    query(`[data-memory-restore="${sourceSnapshot.id}"]`).click(); await wait(50);
    check(mainSource("current") && field("resistance") === "1.5 kΩ" && annotationText("source") === "Bench driver"
      && voltmeterMatches("-9 V") && field("sourceTolerance") === "±2.4%",
      "recalling a switched source restores its symbol, label and results");

    const history = JSON.parse(localStorage.getItem(key));
    const original = history.entries.find(entry => entry.id === originalId);
    const parallelSource = { id: 1, kind: "current", value: .004 };
    history.entries.unshift({ ...original, id: "legacy-sources", savedAt: new Date().toISOString(),
      state: { ...original.state, mode: "voltage", voltage: 99, current: .015,
        sources: [{ id: 2, kind: "voltage", value: 3 }, parallelSource] } });
    history.entries.unshift({ ...original, id: "legacy-current-solve", savedAt: new Date().toISOString(),
      state: { ...original.state, sourceType: "current", mode: "current", voltage: -9, sources: [parallelSource] } });
    history.entries.unshift({ ...original, id: "legacy-package", savedAt: new Date().toISOString(),
      state: { ...original.state, network: { ...original.state.network, package: "Through-hole" } } });
    history.entries.unshift({ ...original, id: "legacy-power-rating", savedAt: new Date().toISOString(),
      state: { ...original.state, network: { ...original.state.network, package: "0402", powerRating: .2 } } });
    history.entries.unshift({ ...original, id: "legacy-resistance-target", savedAt: new Date().toISOString(),
      state: { ...original.state, mode: "resistance", current: .004, target: 2, network: { kind: "series",
        children: [{ ...original.state.network, tolerance: 3.7 }, { ...original.state.network, id: 2 }] } } });
    const oldInverse = history.entries[0];
    history.entries.unshift({ ...oldInverse, id: "legacy-current-inverse",
      state: { ...oldInverse.state, sourceType: "current", current: .003, sources: [{ ...parallelSource, value: .001 }] } });
    localStorage.setItem(key, JSON.stringify(history));
    const reloaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
    win.location.reload(); await reloaded;
    doc = win.document;
    captureDownloads();
    query('[data-memory-restore="legacy-sources"]').click(); await wait(50);
    get("memoryClose").click();
    const addition = ref => query(`[data-added-source="${ref}"]`);
    check(addition("V2") && addition("I1") && field("voltage") === "15 V" && field("voltageBranchCurrent") === "11 mA"
      && schematicInput("voltage").value === "12" && query('[data-mode="voltage"]').disabled,
      "an old voltage solve restores the calculated main source value and both supplementary offsets");
    check(["voltage", "V2", "I1"].every(key => sourceCardMatches(key))
      && sourceCard("V2").getBBox().y + sourceCard("V2").getBBox().height < sourceCard("voltage").getBBox().y,
      "saved series and parallel sources use matching cards with clearance between stacked rows");
    switchSource("voltage", "current");
    check(mainSource("current") && schematicInput("current").value === "11" && field("mainCurrent") === "11 mA"
      && field("current") === "15 mA" && voltmeterMatches("15 V") && field("mainVoltage") === "12 V",
      "the main conversion uses the current branch value with the saved series and parallel offsets");
    switchSource("current", "voltage");
    check(schematicInput("voltage").value === "12" && field("voltage") === "15 V" && field("current") === "15 mA",
      "the reverse conversion applies the series offset and maintains the load voltage");
    check(rightClick(addition("I1").querySelector("[data-added-source-core]")) && get("constructionTarget").textContent === "I1"
      && !sourceAction("voltage").hidden && sourceAction("current").hidden, "the menu targets the clicked legacy source");
    sourceAction("voltage").click();
    check(mainSource("voltage") && addition("V2") && !addition("I1") && get("sourceSelect").options.length === 2
      && field("V3") === "0 V", "converting a supplementary element replaces one entry and starts its new unit value at zero");
    enterValue("V3", "1 V");
    chooseUnit("V3", "m");
    check(schematicInput("V3").value === "1" && get("addedSourceUnit").value === "m" && field("V3") === "1 mV"
      && field("voltage") === "15.001 V" && schematicInput("voltage").value === "12",
      "an edited supplementary source updates the load voltage and leaves the main source input intact");
    get("ltspiceDownload").click();
    const legacySchematic = await downloaded.text();
    const connections = schematicConnections(legacySchematic);
    check(connections.length === 4 && connections[0].startsWith("V3 LOAD VS2 ")
      && connections[1] === "V2 VS2 VS1 3" && connections[2].startsWith("V1 VS1 0 "),
      "LTspice retains the connections for every voltage source in a saved stack");
    fire(addition("V3"), "click"); get("removeSource").click();
    check(!addition("V3") && addition("V2"), "a saved supplementary source can be removed through its component menu");
    query('[data-memory-restore="legacy-resistance-target"]').click(); await wait(50);
    check(resistorValue(1).textContent === "1 kΩ" && resistorValue(2).textContent === "2 kΩ"
      && [1, 2].every(id => hasRole(resistorValue(id), "calculated")),
      "recalling an old single-target calculation preserves its solved values in the all-resistor mode");
    check(schematicInput("tolerance-1").value === "3.7" && field("resistanceRange") === "2.943 kΩ to 3.057 kΩ",
      "saved custom tolerances are retained and included in the range");
    query('[data-memory-restore="legacy-current-solve"]').click(); await wait(50);
    check(schematicInput("current").value === "-13" && field("current") === "-9 mA" && voltmeterMatches("-9 V")
      && query('[data-mode="current"]').disabled, "an old current solve restores the signed source branch value and recalculates voltage");
    pickTolerance("current", "10");
    check(operatingRange("voltage") === "-10.403 V to -7.623 V", "only the main current source varies when a saved parallel source supplies a fixed offset");
    enterValue("current", "-4 mA");
    check(field("voltage") === "0 V" && operatingRange("voltage") === "-404 mV to 404 mV"
      && operatingRange("power") === "0 W to 161.6 µW",
      "the power interval reaches zero inside an interval of drive currents that crosses zero");
    query('[data-memory-restore="legacy-current-inverse"]').click(); await wait(50);
    check(schematicInput("current").value === "3" && field("current") === "4 mA" && voltmeterMatches("12 V")
      && resistorValue(1).textContent === "1 kΩ" && resistorValue(2).textContent === "2 kΩ" && hasRole(resistorValue(2), "known")
      && query('[data-mode="resistance"]').disabled && entries().find(entry => entry.id === "legacy-current-inverse").state.mode === "resistance",
      "an old current-source resistance solve retains its solved parts and original memory after recall");
    query('[data-memory-restore="legacy-package"]').click(); await wait(50);
    const restoredPackage = schematicInput("package-1");
    check(restoredPackage.selectedOptions[0].disabled && restoredPackage.selectedOptions[0].text === "Select SMT…"
      && ![...restoredPackage.options].some(option => option.text === "Through-hole")
      && stress(1, "Pstress") === "—" && stress(1, "Vstress") === "—" && field("sourceTolerance") === "±0%",
      "old packages can be recalled without assigning an unrelated footprint or tolerance");
    pickPackage(1, "0805");
    check(restoredPackage.options.length === 8 && stress(1, "Pstress") === "102.86%" && stress(1, "Vstress") === "24.00%",
      "choosing a supported footprint sets its power and voltage references");
    query('[data-memory-restore="legacy-power-rating"]').click(); await wait(50);
    check(restoredPackage.selectedOptions[0].text === "0402" && stress(1, "Pstress") === "72.00%" && stress(1, "Vstress") === "40.00%",
      "a previously saved rating remains in effect when recalled with a supported footprint");
    pickPackage(1, "0805");
    check(stress(1, "Pstress") === "102.86%" && entries().find(entry => entry.id === "legacy-power-rating").state.network.powerRating === .2,
      "changing an old footprint uses the reference without rewriting the saved rating");
    document.body.dataset.status = "PASS";
  } catch (error) {
    messages.push(`FAIL ${error.stack || error}`);
    document.body.dataset.status = "FAIL";
  } finally {
    frame.remove();
    if (prior === null) localStorage.removeItem(key); else localStorage.setItem(key, prior);
    results.textContent = messages.join("\n");
  }
})();
</script>
