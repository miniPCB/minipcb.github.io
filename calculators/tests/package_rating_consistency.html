 await reset();w.setOperatingCondition('maxC','85');let p=state().physical.r1[0],allowed=.14*(125-85)/(125-70);assert(near(p.inputRating,.14)&&near(p.rating,allowed)&&near(p.stress.p,100*.0036/allowed),'Ambient derating applies to fresh defaults and keeps P70 separate from allowed power');for(let i=0;i<3;i++){w.update();assert(near(state().physical.r1[0].rating,allowed),'Repeated recalculation does not compound thermal derating')}w.setOperatingCondition('maxC','70');assert(near(state().physical.r1[0].rating,.14),'Cooling restores the original package allowance');

 const catalog=await w.ResistorParts.load();for(const family of catalog.families)for(const mode of family.powerModes)for(const pkg of family.packages.filter(pkg=>Number.isFinite(pkg.powerW[mode.id]))){await reset();const part=w.ResistorParts.evaluate(catalog,family.id,{resistanceOhms:10000,tolerancePct:.1,package:pkg.code,mode:mode.id,packaging:family.packaging.find(p=>pkg.packagingCodes.includes(p.code)&&(!p.tcrCodes||p.tcrCodes.includes(family.defaults.tcrCode))).code});w.applyCatalogPart(part,'r1',true);const before=snapshot(),other=family.packages.find(p=>p.code!==pkg.code&&Number.isFinite(p.powerW[mode.id]));footprint('r1',other.code);footprint('r1',pkg.code);const after=snapshot();assert(near(after.rating,pkg.powerW[mode.id])&&after.vmax===pkg.workingVoltageV&&JSON.stringify(before)===JSON.stringify(after)&&state().physical.r1[0].catalog.mode===mode.id,family.id+'/'+mode.id+'/'+pkg.case+': explicit family, power mode, ratings and MPN survive round trips');}
 for(const family of catalog.families){await reset();set('solveFor','pairs');set('pairFamilyTop',family.id);set('pairFamilyBot',family.id);set('pairMinR','10000');set('pairMaxR','10000');get('pairForm').requestSubmit();const found=await w.pairSearchReady;get('pairApply').click();assert(found.length===1&&['r1','r2'].every((arm,index)=>state().physical[arm][0].catalog?.familyId===family.id&&!get('p'+(index+1)).dataset.powerFootprint&&near(state().physical[arm][0].inputRating,family.id==='vishay-tnpw-e3'?.14:.15)),family.id+': applying searched parts replaces generic rating ownership in both arms');}
 await reset();get('r1Multiple').click();get('r1Split').click();const automatic=state().physical.r1[0].id;w.makeAutomatic(automatic);w.invalidateAutomaticDesign();w.update();set('designPackage','0402');get('automaticDesign').requestSubmit();await w.automaticDesignReady;assert(state().physical.r1[0].catalog?.case==='0402'&&near(state().physical.r1[0].inputRating,.07)&&!get(automatic+'Power').dataset.powerFootprint,'Automatic 0402 TNPW selection uses its real 70 mW rating, replacing the generic 50 mW reference');
