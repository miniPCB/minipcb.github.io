<!doctype html><html lang="en"><meta charset="utf-8"><title>Resistance multiplier checks</title><style>body{background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{width:1440px;height:1800px;border:0}</style><h1>Editable resistance units</h1><pre id="results">RUNNING</pre><iframe id="calculator" title="Calculator under test" src="../voltage_divider.html?resistance-units-test=1"></iframe><script>
"use strict";const checks=[],failures=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label)},pause=()=>new Promise(resolve=>setTimeout(resolve,20));
document.getElementById('calculator').addEventListener('load',async event=>{try{
const w=event.target.contentWindow,d=w.document,get=id=>d.getElementById(id),svg=()=>get('liveSchematic'),state=()=>w.eval('schematicState'),errors=[];w.addEventListener('error',event=>errors.push(event.message));assert(await w.resistorCatalogReady,'Catalogs load');
const reset=async()=>{w.closeSchematicEditor(false);get('dividerForm').reset();get('pairForm').reset();await pause()},set=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new w.Event('input',{bubbles:true}))},inline=()=>svg().querySelector('[data-inline-editor]'),open=id=>svg().querySelector(`[data-schematic-edit="${id}"][data-edit-focus="value"]`).dispatchEvent(new w.MouseEvent('click',{bubbles:true})),type=text=>{const field=inline().querySelector('input');field.value=text;field.dispatchEvent(new w.Event('input',{bubbles:true}))},unit=value=>{const field=inline().querySelector('select.resistance-unit');field.value=String(value);field.dispatchEvent(new w.Event('change',{bubbles:true}))},key=value=>inline().querySelector('input').dispatchEvent(new w.KeyboardEvent('keydown',{key:value,bubbles:true,cancelable:true}));
const units=['µΩ','mΩ','Ω','kΩ','MΩ','GΩ'],grades=[.000001,.001,1,1000,1e6,1e9];
for(const connection of ['single','series','parallel','mixed'])for(const scale of grades){
 await reset();if(connection!=='single'){get('r1Multiple').click();get('r1Split').click();set('r1Connection',connection==='mixed'?'series':connection);if(connection==='mixed'){const p=state().physical.r1.map(part=>part.id);w.storeTopology('r1',{connection:'series',children:[{connection:'parallel',children:p.slice(0,2)},...p.slice(2)]});w.update()}}
 const part=state().physical.r1[0],others=state().physical.r1.slice(1).map(part=>part.resistance),topology=JSON.stringify(w.armTopology('r1'));open(part.id);assert([...inline().querySelector('select.resistance-unit').options].map(option=>option.textContent).join('|')===units.join('|'),connection+'/'+scale+': dropdown provides all supported multipliers');type('4.99');unit(scale);
 assert(w.parseInlineResistance(inline().querySelector('input').value,Number(get('schematicEditUnit').value)).ohms===4.99*scale,connection+'/'+scale+': multiplier changes the draft physical resistance');key('Enter');
 assert(!inline()&&Math.abs(state().physical.r1[0].resistance-4.99*scale)<=Math.abs(4.99*scale)*1e-12&&JSON.stringify(state().physical.r1.slice(1).map(part=>part.resistance))===JSON.stringify(others)&&JSON.stringify(w.armTopology('r1'))===topology,connection+'/'+scale+': applying units preserves other parts and topology');
 open(part.id);assert(Number(inline().querySelector('select.resistance-unit').value)===scale,connection+'/'+scale+': reopening chooses the appropriate unit');key('Escape');
}
await reset();open('r1');type('2M');assert(inline().querySelector('select.resistance-unit').value==='1000000'&&get('schematicEditValue').value==='2','Explicit typed units synchronize the dropdown and numeric draft');unit(1000);assert(inline().querySelector('input').value==='2'&&get('schematicEditValue').value==='2','Changing an explicit suffix normalizes it before applying the selected multiplier');key('Enter');assert(state().circuit.r1===2000,'A new dropdown choice replaces the typed suffix without multiplying twice');
open('r1');type('5');unit(1e9);key('Escape');assert(state().circuit.r1===2000,'Canceling a multiplier draft preserves the physical resistance');
open('r1');type('12.345');unit(1000);let suggestions=[...inline().querySelectorAll('[data-resistance]')];assert(Number(suggestions[0].dataset.resistance)===12300,'Nearest values use the selected multiplier');suggestions[0].click();assert(state().circuit.r1===12300,'Suggestion selection applies its exact ohmic value with the current multiplier');
await reset();set('rl','10');open('load');type('100');unit(1);key('Enter');assert(state().circuit.rl===100,'The load resistor supports the same unit dropdown');
await reset();get('r1Multiple').click();get('r1Split').click();open('r1');type('20');unit(1000);key('Enter');assert(Math.abs(state().circuit.r1-20000)<1e-8,'Equivalent-arm resistance supports selectable units');
await reset();set('solveFor','pairs');open('r1');type('49.9');unit(1000);key('Enter');assert(w.eval('pairConstruction.r1.parts[0].resistance')===49900&&get('pairValuePolicy').value==='fixed','Search construction retains entered resistance units as a fixed ohmic value');
await reset();open('r1');type('7.2mΩ');key('Enter');assert(Math.abs(state().circuit.r1-.0072)<1e-12,'Typed milli-ohms remain supported');assert(!errors.length,'No runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack)}document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2)});
</script></html>
