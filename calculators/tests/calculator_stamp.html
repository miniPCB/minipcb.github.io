<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator build stamp checks</title>
<style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:2200px;border:0}</style>
<h1>Published calculator build traceability</h1>
<pre id="results">RUNNING</pre>
<iframe id="calculator" title="Calculator under test" src="../voltage_divider.html?stamp-test=1"></iframe>
<script>
"use strict";
const checks=[],failures=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label);},pause=()=>new Promise(resolve=>setTimeout(resolve,25));
document.getElementById('calculator').addEventListener('load',async event=>{try{
 const frame=event.target,w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),svg=()=>get('liveSchematic'),stamp=()=>svg().querySelector('[data-calculator-stamp]'),state=()=>w.eval('schematicState'),errors=[];
 w.addEventListener('error',event=>errors.push(event.message));assert(await w.resistorCatalogReady,'Catalogs load');await w.circuitLogoReady;await w.calculatorBuildReady;
 const originalFetch=w.fetch.bind(w),originalBuild=w.eval('calculatorBuild'),originalForm=JSON.stringify(w.workFormValues(get('dividerForm'))),analysis=state().analyzedAt;
 // A plain local server returns the Jekyll template; it must never invent a revision.
 if(!originalBuild)assert(stamp().textContent.includes('unpublished source')&&!stamp().hasAttribute('href')&&stamp().querySelector('text').textContent.includes(analysis.slice(0,19).replace('T',' ')+' UTC'),'Unpublished local source is explicit and its analysis time is not called a build time');
 let fixture={commit:'0123456789ABCDEF0123456789ABCDEF01234567',builtAt:'2026-11-04T18:20:30-07:00'},status=200,requests=[];
 w.fetch=(url,options)=>String(url)==='build.json'?(requests.push({url,options}),Promise.resolve(new w.Response(typeof fixture==='string'?fixture:JSON.stringify(fixture),{status,headers:{'Content-Type':'application/json'}}))):originalFetch(url,options);
 const build=await w.loadCalculatorBuild(),commit='0123456789abcdef0123456789abcdef01234567',date='2026-11-05T01:20:30.000Z',url='https://github.com/miniPCB/minipcb.github.io/commit/'+commit;
 const expected='Built 2026-11-05 01:20:30 UTC · 0123456';
 assert(build?.commit===commit&&build.builtAt===date&&Object.isFrozen(build),'Published metadata normalizes commit case and timestamp to a fixed UTC identity');
 assert(requests.length===1&&requests[0].url==='build.json'&&requests[0].options.cache==='no-cache','Build identity comes from the shared same-origin published metadata, without a latest-commit API lookup');
 assert(stamp().querySelector('text').textContent===expected&&stamp().getAttribute('href')===url&&stamp().getAttribute('target')==='_blank','The timestamp displays seconds, UTC and the short commit, linking directly to the full public commit');
 assert(stamp().dataset.builtAt===date&&stamp().dataset.buildCommit===commit&&stamp().querySelector('title').textContent.includes(url)&&stamp().getAttribute('aria-label').includes(commit),'Full timestamp and revision remain available as SVG metadata and accessible link text');
 assert(state().analyzedAt===analysis&&JSON.stringify(w.workFormValues(get('dividerForm')))===originalForm&&!w.eval('leaveWarningActive'),'Loading build metadata does not recalculate, alter design inputs or dirty the design');
 const set=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new w.Event('input',{bubbles:true}));},reset=async()=>{get('dividerForm').reset();get('pairForm').reset();await pause();};
 for(const mode of ['vout','vin','r1','r2','rl','tolerance','pairs']){
  await reset();set('solveFor',mode);assert(stamp().querySelector('text').textContent===expected&&stamp().dataset.buildCommit===commit,mode+': calculator mode changes preserve the published build identity');
  const exported=new DOMParser().parseFromString(w.circuitFrameSnapshot().markup,'image/svg+xml');assert(exported.querySelector('[data-calculator-stamp]').getAttribute('href')===url&&exported.querySelector('[data-calculator-stamp]').dataset.buildCommit===commit,mode+': framed export retains a traceable published source');
 }
 await reset();set('circuitTitle','A long editable circuit title for source revision traceability');set('vin','24');
 for(const kind of ['single','series','parallel','mixed']){
  if(kind!=='single'){
   if(kind==='series'){get('r1Multiple').click();get('r1Split').click();}
   if(kind==='mixed'){const ids=state().physical.r1.map(p=>p.id);w.storeTopology('r1',{connection:'series',children:[{connection:'parallel',children:ids.slice(0,2)},...ids.slice(2)]});w.update();}
   else set('r1Connection',kind);
  }
  for(const width of [390,1440]){
   frame.style.width=width+'px';await pause();
   const logo=svg().querySelector('[data-circuit-logo]').getBoundingClientRect(),text=stamp().querySelector('text').getBoundingClientRect(),title=get('schematicTitle').getBoundingClientRect(),border=svg().querySelector('[data-circuit-frame-border]').getBoundingClientRect(),drawing=get('schematicDrawing').getBoundingClientRect();
   assert(text.top>=logo.bottom&&text.bottom<title.top&&text.left>=border.left&&text.right<=border.right&&title.bottom<drawing.top,kind+'/'+width+'px: logo, stamp, long title and normal-size circuit fit without overlapping');
   assert(stamp().querySelector('text').textContent===expected,kind+'/'+width+'px: redraws preserve the build timestamp and revision');
  }
 }
 const full=new DOMParser().parseFromString(await(await originalFetch(get('schematicDownload').href)).text(),'image/svg+xml'),snapshot=w.circuitFrameSnapshot(),image=new DOMParser().parseFromString(snapshot.markup,'image/svg+xml');
 for(const exported of [full,image])assert(exported.querySelector('[data-calculator-stamp]').querySelector('text').textContent===expected&&exported.querySelector('[data-calculator-stamp]').dataset.builtAt===date,'Full workspace and framed SVG snapshots preserve the visible timestamp and full build date');
 const encoded=await w.CircuitImageExport.encode(snapshot,'svg');assert((await encoded.text()).includes(commit)&&snapshot.markup.includes('Built 2026-11-05 01:20:30 UTC'),'The image encoder keeps provenance in the image source shared by all formats');
 await reset();set('solveFor','pairs');set('pairMinR','10000');set('pairMaxR','10000');get('pairForm').requestSubmit();assert((await w.pairSearchReady).length>0,'Published stamp coexists with catalog solution search');const generated=w.eval('pairSpec');w.selectPair(0);w.renderSchematic();assert(stamp().querySelector('text').textContent===expected&&w.eval('pairSpec')===generated,'Selecting and redrawing a solution keeps its source build identity');
 for(const invalid of [{commit:'bad',builtAt:date},{commit,builtAt:'invalid'},null,'---\nlayout: null\n---\n{"commit":"{{ site.github.build_revision }}"}']){fixture=invalid;assert(await w.loadCalculatorBuild()===null&&stamp().dataset.buildCommit===commit,'Invalid or unrendered metadata cannot replace a verified build identity');}
 status=404;fixture={};assert(await w.loadCalculatorBuild()===null&&stamp().dataset.buildCommit===commit,'A missing metadata response does not substitute the current clock or a newer commit');
 w.fetch=originalFetch;await reset();assert(!errors.length,'Build metadata and exports introduce no runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack)}document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2);});
</script></html>
