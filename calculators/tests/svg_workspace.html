<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direct SVG workspace checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:2400px;border:0}</style></head><body>
<h1>Direct circuit workspace, contextual controls and retained data tools</h1><pre id="results">RUNNING</pre><iframe id="calculator" title="Calculator under test" src="../voltage_divider.html?workspace-test=1"></iframe><script>
"use strict";
const checks=[],failures=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label);},pause=()=>new Promise(resolve=>setTimeout(resolve,25));
document.getElementById('calculator').addEventListener('load',async event=>{try{
 const frame=event.target,w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),svg=()=>get('liveSchematic'),state=()=>w.eval('schematicState'),errors=[];
 w.addEventListener('error',event=>errors.push(event.message));assert(await w.resistorCatalogReady,'Catalogs load');await w.circuitLogoReady;await w.calculatorBuildReady;
 const visible=id=>{const b=get(id).getBoundingClientRect();return b.width>0&&b.height>0;},set=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new w.Event('input',{bubbles:true}));},pick=mode=>d.querySelector(`[data-solve-mode="${mode}"]`).click();
 const reset=async()=>{w.closeSchematicEditor(false);get('dividerForm').reset();get('pairForm').reset();get('calculatorDetails').open=false;get('searchLimits').open=false;await pause();};
 const edit=(key,value)=>{svg().querySelector(`[data-schematic-edit="${key}"][data-edit-focus="value"]`).dispatchEvent(new w.MouseEvent('click',{bubbles:true}));const input=svg().querySelector('[data-inline-editor] input');input.value=value;input.dispatchEvent(new w.Event('input',{bubbles:true}));input.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));};
 assert(!d.querySelector('dialog#calculatorDetails,[data-schematic-edit="circuit-options"],#calculatorDetailsView,#calculatorDetailsClose,#circuitChoose')&&typeof w.openCalculatorDetails==='undefined'&&typeof w.closeCalculatorDetails==='undefined','The whole-circuit dialog, Options entry, view selector and obsolete handlers are removed');
 assert(get('calculatorDetails').tagName==='DETAILS'&&!get('calculatorDetails').open&&!visible('dividerForm')&&!visible('resultTabs')&&!visible('automaticDesign'),'Additional data and automatic controls stay collapsed or hidden by default');
 assert(get('schematicFrame').contains(get('schematicSolveStatus'))&&get('schematicSolveStatus').textContent.includes('Unknown')&&get('schematicSolveStatus').textContent.includes('Known'),'Both color keys belong to the circuit frame');
 assert(!svg().textContent.includes('Operating Point Information')&&svg().querySelectorAll('[data-operating-point]').length===4&&[...svg().querySelectorAll('[data-operating-point] > rect:first-child')].every(rect=>rect.getAttribute('height')==='88'),'The four information blocks keep their size and content without a section heading');
 assert([...d.querySelectorAll('[data-search-inputs] input,[data-search-inputs] select')].every(input=>input.type==='hidden'||input.labels.length>0),'Active source-field metadata is retained for contextual editors');
 for(const network of [false,true])for(const mode of ['vout','vin','r1','r2','rl','tolerance','pairs']){
  await reset();if(network){get('r1Multiple').click();get('r1Split').click();}set('solveFor',mode);
  const expected=mode==='pairs'||mode==='vout'&&network;
  assert(!!get('schematicDesignSearch')===expected&&get('searchLimits').hidden===!expected,`${network?'network':'single'}/${mode}: solution search and limits appear only for supported modes`);
  assert(!get('calculatorDetails').open&&!d.querySelector('dialog[open]'),mode+': mode changes do not open data or a dialog');
 }
 // These independent inverse examples explain why the default 6 V result is Open / 0 A.
 await reset();pick('rl');assert(state().circuit.rl===null&&get('schematicLoadValue').textContent==='Open','Find RL reports Open at the unloaded 6 V default');edit('target','4');
 assert(Math.abs(state().circuit.rl-10000)<1e-8&&get('schematicLoadValue').textContent==='10 kΩ'&&get('schematicLoadValue').hasAttribute('data-calculated-load')&&!get('schematicLoadValue').hasAttribute('data-schematic-edit'),'A 4 V target calculates a read-only 10 kohm load for 12 V and two 10 kohm divider resistors');
 set('loadType','current');assert(Math.abs(state().circuit.iload-.0004)<1e-12&&get('schematicLoadValue').textContent==='400 µA'&&d.querySelector('[data-solve-mode="rl"] strong').textContent==='Find IL'&&!get('schematicDesignSearch'),'Find IL calculates the equivalent read-only 400 uA load without offering a resistor search');
 edit('target','6');assert(state().circuit.iload===0&&get('schematicLoadValue').textContent==='0 µA','Changing the target recomputes the current load to zero at the unloaded voltage');
 await reset();get('calculatorDetails').querySelector(':scope > summary').click();get('manualLimits').open=true;
 assert(visible('p1')&&visible('vmax1')&&visible('tolR1')&&visible('r1Multiple'),'Custom ratings, working voltage, nonstandard tolerance and network tools remain accessible');
 set('p1','0.125');set('vmax1','80');set('tolR1','.123');assert(state().physical.r1[0].rating===.125&&state().physical.r1[0].vmax===80&&state().physical.r1[0].tolerance===.123,'Manual limit edits still reach the same circuit model');
 const beforeTabs=JSON.stringify(w.workFormValues(get('dividerForm')));
 for(const tab of get('resultTabs').querySelectorAll('[role="tab"]')){tab.click();assert(visible(tab.getAttribute('aria-controls'))&&d.querySelectorAll('[role="tabpanel"]:not([hidden])').length===1,tab.textContent+': retained data view is reachable inline');}
 assert(JSON.stringify(w.workFormValues(get('dividerForm')))===beforeTabs,'Browsing data views preserves circuit inputs and manual limits');
 await reset();get('r1Multiple').click();get('r1Split').click();const automatic=state().physical.r1[1].id;w.makeAutomatic(automatic);w.invalidateAutomaticDesign();w.update();
 assert(!get('automaticSettings').hidden&&!get('automaticSettings').open&&!visible('designChoose'),'Automatic settings appear collapsed when a resistor needs an automatic value');get('automaticSettings').querySelector(':scope > summary').click();
 assert(['designTarget','designError','designTrim','designFamily','designPackage','designTcr','designScale','designChoose'].every(visible),'All unique automatic-value controls remain reachable without a modal');set('designTarget','4');get('designChoose').click();await w.automaticDesignReady;
 assert(state()&&w.eval('automaticChoices.size')===1&&Math.abs(state().result.vout-4)<.05&&!d.querySelector('dialog[open]'),'The visible automatic-value action chooses a catalog resistor and updates the circuit');get('automaticSettings').open=false;
 await reset();pick('pairs');get('searchLimits').querySelector(':scope > summary').click();
 assert(['pairFamilyTop','pairFamilyBot','pairMinR','pairMaxR','pairTcr','pairTemperature','pairMaxStress','pairMaxPower','pairConstructionMode'].every(visible)&&!visible('pairVin')&&!d.querySelector('dialog[open]'),'Unique search constraints remain visible on demand while duplicate circuit entry stays out of view');
 set('pairMinR','10000');set('pairMaxR','10000');svg().querySelector('[data-schematic-edit="search-run"]').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));const found=await w.pairSearchReady;
 assert(found.length===4&&get('schematicDesignSearch').textContent==='4 Design Solutions Found'&&get('schematicDesignSearch').getAttribute('aria-disabled')==='true','Contextual limits find both catalogs and preserve the completed-search button state');
 get('calculatorDetails').querySelector(':scope > summary').click();get('pairTab').click();
 assert(visible('pairRows')&&get('pairRows').rows.length===4,'The full results table remains accessible without a modal');get('pairCompareAdd').click();assert(get('pairComparisonRows').rows.length>=2&&get('pairComparisonRows').textContent.includes(found[0].top.mpn),'Comparison retains physical part numbers and rows');
 const descriptor=Object.getOwnPropertyDescriptor(w.navigator,'clipboard');Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async()=>{throw new Error('blocked')}}});
 get('pairComparisonCopy').click();await pause();assert(visible('pairComparisonCopyText')&&get('pairComparisonCopyText').value===w.pairComparisonTsv().replace(/\r\n/g,'\n')&&!get('pairComparisonCopyStatus').textContent.includes('Options'),'Clipboard denial exposes the complete manual-copy fallback in the data section');
 let copied='';Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async text=>{copied=text}}});get('pairComparisonCopy').click();await pause();assert(copied===w.pairComparisonTsv()&&!d.querySelector('dialog[open]'),'Comparison copying still works without opening a dialog');if(descriptor)Object.defineProperty(w.navigator,'clipboard',descriptor);else delete w.navigator.clipboard;
 const originalClick=w.HTMLAnchorElement.prototype.click,downloads=[];w.HTMLAnchorElement.prototype.click=function(){if(this.download?.endsWith('.csv'))downloads.push({name:this.download,text:w.fetch(this.href).then(response=>response.text())});else originalClick.call(this)};
 for(const id of ['pairCsv','pairFilteredCsv','catalogBom']){get(id).click();assert(downloads.length>0&&(await downloads.at(-1).text).length>100,id+': CSV download functionality remains available');}w.HTMLAnchorElement.prototype.click=originalClick;
 for(const width of [320,390,768,1440]){
  frame.style.width=width+'px';await pause();assert(d.documentElement.scrollWidth<=width&&get('calculatorDetails').getBoundingClientRect().right<=width,width+'px: expanded data and search sections fit the page');
  const border=get('schematicFrame').querySelector('[data-circuit-frame-border]').getBoundingClientRect(),key=get('schematicSolveStatus').getBoundingClientRect();assert(key.left>=border.left&&key.right<=border.right&&key.top>=border.top&&key.bottom<=border.bottom,width+'px: Known/Unknown keys stay inside the circuit frame');
 }
 const beforeApply=w.eval('pairSelected');get('pairApply').click();assert(get('solveFor').value==='vout'&&w.catalogBomCsv().includes(beforeApply.top.mpn)&&w.catalogBomCsv().includes(beforeApply.bot.mpn),'Applying the selected solution still updates the work circuit and catalog assignments');
 const full=new DOMParser().parseFromString(await(await fetch(get('schematicDownload').href)).text(),'image/svg+xml'),framed=new DOMParser().parseFromString(w.circuitFrameSnapshot().markup,'image/svg+xml');
 for(const image of [full,framed])assert(!image.querySelector('parsererror,script,foreignObject,[data-schematic-edit]')&&image.getElementById('schematicFrame').contains(image.getElementById('schematicSolveStatus'))&&!image.documentElement.textContent.includes('Operating Point Information'),'Image exports retain the circuit key and information without the removed controls or heading');
 await reset();get('calculatorDetails').querySelector(':scope > summary').click();get('calculatorDetails').open=false;await pause();assert(!w.eval('leaveWarningActive')&&!visible('resultTabs'),'Opening and closing additional data alone does not dirty the design');assert(!errors.length,'No runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack)}document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2);});
</script></body></html>
