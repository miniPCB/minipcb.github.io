<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resistor pair search checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui,sans-serif}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:1800px;border:0;margin-top:16px}</style></head>
<body><h1>Resistor pair search checks</h1><p>Serve the repository root over HTTP to test catalog completeness, tolerance/rating limits, charts, exports, and pair application.</p><pre id="results" role="status">RUNNING</pre>
