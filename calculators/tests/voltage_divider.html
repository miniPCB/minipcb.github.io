<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voltage Divider Browser Checks</title>
  <style>
    body { margin: 16px; background: #101823; color: #eaf6ff; font: 14px system-ui, sans-serif; }
    pre { white-space: pre-wrap; }
    iframe { display: block; border: 1px solid #2f495d; width: 1440px; height: 2200px; }
  </style>
</head>
<body>
  <h1>Voltage divider browser checks</h1>
  <p>Serve the repository root with a local HTTP server and open this page. Checks use the real calculator in the frame below.</p>
  <pre id="testResults" role="status">RUNNING</pre>
  <iframe id="subject" src="../voltage_divider.html" title="Calculator under test"></iframe>
  <script>
    "use strict";
    const checks = [];
    const failures = [];
    const assert = (condition, label) => { checks.push(label); if (!condition) failures.push(label); };
    const near = (actual, expected, label, tolerance = 1e-9) => assert(Number.isFinite(actual) && Math.abs(actual - expected) <= tolerance * Math.max(1, Math.abs(expected)), `${label}: ${actual} ≈ ${expected}`);
    document.getElementById("subject").addEventListener("load", async event => {
      try {
        const frame = event.target, w = frame.contentWindow, d = w.document;
        const get = id => d.getElementById(id);
        const text = id => get(id).textContent;
        const set = (id, value) => { get(id).value = value; get(id).dispatchEvent(new w.Event("input", { bubbles: true })); };
        const reset = async () => { get("dividerForm").reset(); await new Promise(resolve => setTimeout(resolve, 5)); };
        const stressOutputs = () => [...get("stressCards").querySelectorAll("output")].map(el => Number.parseFloat(el.textContent));
        const schematicPart = id => d.querySelector(`[data-schematic-part="${id}"]`);
        const schematicField = (id, field) => {
          if (field === "rating") return schematicPart(id).querySelector(":scope > title").textContent.match(/(?:Rated|Allowed) [^;]+/)[0];
          const node = schematicPart(id).querySelector(`[data-field="${field}"]`) || d.querySelector(`[data-schematic-symbol="${id}"] [data-field="${field}"]`);
          return node.textContent;
        };
        const valid = label => {
          assert(get("inputError").hidden, `${label}: ${text("inputError")}`);
          assert(text("schematicVmid") === `VMID ${text("vout")}`, `${label}: schematic follows the solved midpoint`);
          const symbols = [...get("liveSchematic").querySelectorAll("[data-schematic-symbol]")].map(node => node.dataset.schematicSymbol).sort();
          const physical = [...get("liveSchematic").querySelectorAll("[data-schematic-part]")].map(node => node.dataset.schematicPart).sort();
          assert(symbols.join(",") === physical.join(",") && symbols.length > 0, `${label}: drawn resistor symbols match every physical work-form part`);
        };
        const invalid = label => {
          assert(!get("inputError").hidden, `${label}: visible error`);
          assert(text("vout") === "—" && text("voutMin") === "—" && text("solutionValue") === "—", `${label}: stale results cleared`);
          assert(text("schematicVmid") === "VMID —" && !d.querySelector('[data-schematic-part]'), `${label}: schematic clears stale values and stresses`);
        };

        valid("Initial calculation");
        assert(schematicField("r1", "footprint") === "Not set" && get("liveSchematic").querySelectorAll('.schematic-pill[data-schematic-edit][role="button"]').length === 4, "SVG shows editable tolerance/package pills and leaves manual packages explicitly unset");
        assert(text("vout") === "6 V" && text("iin") === "600 µA" && text("ptotal") === "7.2 mW", "Original default operating point");
        assert(stressOutputs().join(",") === "1.44,NaN,1.44,NaN", "Original default resistor stresses");
        assert(text("voutMin") === "5.994 V" && text("voutMax") === "6.006 V" && text("voutError") === "0.1%", "Default ±0.1% resistor output bounds");
        assert(get("targetVout").readOnly && !get("vin").readOnly, "VMID mode marks the calculated field");
        assert(get("ratingRows").rows.length === 15 && get("ratingRows").querySelectorAll(".chosen").length === 4, "Fifteen common ratings retain selected highlights");
        assert(text("schematicVtop") === "VTOP 12 V ±0%" && text("schematicVmid") === "VMID 6 V", "Schematic shows the default source, tolerance, and midpoint");
        assert(schematicField("r1", "resistance") === "10 kΩ" && schematicField("r1", "tolerance") === "±0.1%" && schematicField("r1", "rating") === "Rated 250 mW", "Schematic shows actual resistance, tolerance, and rating");
        assert(["p", "v"].map(field => schematicField("r1", field)).join(",") === "1.44%,—", "Schematic shows default Pstress and unassessed voltage stress");

        set("rl", "100");
        valid("Loaded forward solution");
        assert(text("schematicLoadValue") === "100 kΩ" && get("schematicLoad").getAttribute("opacity") === "1", "Schematic enables and labels the actual load");
        assert(text("vout") === "5.714 V" && get("operatingRows").rows.length === 3, "Loaded output and operating row");
        const loaded = w.analyze(12, 10000, 10000, 100000);
        near(loaded.vout, 40 / 7, "Known loaded output");
        near(loaded.i1, 0.0006285714285714286, "Known loaded input current");
        near(loaded.total, 0.007542857142857143, "Known loaded total dissipation");
        assert(text("loadSummary").includes("4.76%"), "Loading reduction retained");

        await reset(); set("solveFor", "vin"); set("targetVout", "5");
        valid("VTOP solution");
        near(get("vin").valueAsNumber, 10, "VTOP = 10 V for 5 V unloaded target");
        assert(text("schematicVtop") === "VTOP 10 V ±0%", "Schematic shows a solved source voltage");
        assert(get("vin").readOnly && !get("targetVout").readOnly, "VTOP mode field states");
        set("rl", "10");
        near(get("vin").valueAsNumber, 15, "VTOP = 15 V for 5 V target with 10 kΩ load");
        set("targetVout", "-5");
        near(get("vin").valueAsNumber, -15, "Negative VTOP inverse solution");
        assert(text("vout") === "-5 V" && !text("ptotal").startsWith("-"), "Negative source maintains passive power sign");
        set("targetVout", "0");
        valid("Zero VTOP solution");
        assert(get("vin").valueAsNumber === 0 && text("voutError").includes("zero nominal"), "Zero output has undefined relative tolerance");

        await reset(); set("solveFor", "r1"); set("targetVout", "4");
        valid("RTOP solution");
        near(get("r1").valueAsNumber, 20, "Unloaded RTOP = 20 kΩ");
        set("r1Unit", "1");
        near(get("r1").valueAsNumber, 20000, "Solved RTOP follows Ω unit selection");
        set("rl", "10");
        near(get("r1").valueAsNumber, 10000, "Loaded RTOP = 10 kΩ");
        assert(text("vout") === "4 V" && get("r1").readOnly, "RTOP solution feeds operating point");

        await reset(); set("solveFor", "r2"); set("targetVout", "4");
        valid("RBOT solution");
        near(get("r2").valueAsNumber, 5, "Unloaded RBOT = 5 kΩ");
        set("rl", "10");
        near(get("r2").valueAsNumber, 10, "Loaded RBOT = 10 kΩ");
        set("targetVout", "8"); invalid("Infeasible loaded RBOT");
        set("targetVout", "4"); valid("RBOT recovers after infeasible target");
        for (const target of ["0", "12", "-4"]) {
          set("targetVout", target); invalid(`Invalid resistance target ${target}`);
        }
        set("targetVout", "4"); set("vin", "0"); invalid("Zero VTOP underdetermines resistance");
        await reset(); set("solveFor", "r1"); set("vin", "-12"); set("targetVout", "-4");
        valid("Negative-source resistance solution");
        near(get("r1").valueAsNumber, 20, "Negative source RTOP remains positive");

        await reset(); set("solveFor", "rl");
        valid("Open load solution");
        assert(get("rl").value === "" && text("solutionValue") === "Open circuit", "Unloaded target solves RL as open");
        set("targetVout", "4");
        valid("Finite load solution");
        near(get("rl").valueAsNumber, 10, "RL = 10 kΩ for a 4 V target");
        assert(!get("tolRl").disabled, "Finite solved load enables load tolerance");
        set("targetVout", "8"); invalid("Passive load cannot boost output");
        assert(get("rl").value === "", "Infeasible load target clears the calculated RL field");
        set("targetVout", "6"); valid("Open load recovers from infeasible target");
        assert(get("tolRl").disabled, "Open load disables unused tolerance input");

        await reset(); set("solveFor", "tolerance");
        valid("Shared resistor tolerance solution");
        near(get("tolR1").valueAsNumber, 5, "Exact source permits ±5% R1");
        near(get("tolR2").valueAsNumber, 5, "Exact source permits ±5% R2");
        assert(get("tolR1").readOnly && get("tolR2").readOnly && !get("targetErrorField").hidden, "Tolerance mode controls");
        assert(text("voutMin") === "5.7 V" && text("voutMax") === "6.3 V", "Solved tolerance bounds meet ±5% budget");
        set("tolVin", "1");
        near(get("tolR1").valueAsNumber, 3.960396, "VTOP variation consumes tolerance budget", 1e-7);
        set("targetError", "0"); invalid("VTOP tolerance alone exceeds zero budget");
        set("targetError", "5"); valid("Tolerance solver recovers after impossible budget");
        set("vin", "0"); invalid("Tolerance solving rejects zero nominal output");
        set("vin", "12"); set("targetError", "-1"); invalid("Negative tolerance budget");
        await reset(); set("solveFor", "tolerance"); set("targetError", "0");
        valid("Zero error with exact source");
        assert(get("tolR1").valueAsNumber === 0 && get("tolR2").valueAsNumber === 0, "Zero error solves exact resistors");
        set("targetError", "1000");
        near(get("tolR1").valueAsNumber, 99.999, "Tolerance search caps at documented range");

        const sampleCircuit = { vin: 12, r1: 10000, r2: 20000, rl: 30000 };
        const sampleTolerances = { vin: 1, r1: 5, r2: 10, rl: 20 };
        const bounds = w.toleranceAnalysis(sampleCircuit, sampleTolerances);
        near(bounds.min, 14256 / 2425, "Independent hand-derived loaded minimum");
        near(bounds.max, 239976 / 33575, "Independent hand-derived loaded maximum");
        const negative = w.toleranceAnalysis({ ...sampleCircuit, vin: -12 }, sampleTolerances);
        near(negative.min, -239976 / 33575, "Negative source minimum uses reversed magnitude corner");
        near(negative.max, -14256 / 2425, "Negative source maximum uses reversed magnitude corner");

        for (const circuit of [sampleCircuit, { vin: -24, r1: 3300, r2: 4700, rl: 8200 }, { vin: 1.8, r1: 1e6, r2: 1e7, rl: 10 }, { vin: 48, r1: 100, r2: 10000, rl: null }]) {
          const point = w.analyze(circuit.vin, circuit.r1, circuit.r2, circuit.rl);
          near(point.i1, point.i2 + point.il, "Current conservation");
          near(point.total, circuit.vin * point.i1, "Power conservation");
          near(point.v1 + point.vout, circuit.vin, "Voltage conservation");
          for (const mode of ["vin", "r1", "r2", "rl"]) {
            const solved = w.solveCircuit(mode, { ...circuit, [mode]: null }, point.vout);
            if (mode === "rl" && circuit.rl === null) assert(solved.rl === null, "Inverse round trip retains open load");
            else near(solved[mode], circuit[mode], `Inverse ${mode} round trip`, 1e-7);
          }
          const t = { vin: 1, r1: 5, r2: 10, rl: 20 };
          const range = w.toleranceAnalysis(circuit, t);
          const corners = [];
          for (const a of [-1, 1]) for (const b of [-1, 1]) for (const c of [-1, 1]) for (const e of [-1, 1]) {
            corners.push(w.analyze(circuit.vin + a * Math.abs(circuit.vin) * 0.01, circuit.r1 * (1 + b * 0.05), circuit.r2 * (1 + c * 0.1), circuit.rl === null ? null : circuit.rl * (1 + e * 0.2)).vout);
          }
          near(range.min, Math.min(...corners), "Optimized bound equals exhaustive corner minimum");
          near(range.max, Math.max(...corners), "Optimized bound equals exhaustive corner maximum");
          const fixed = { vin: 1, r1: 0, r2: 0, rl: 2 };
          const allowance = w.solveTolerance(circuit, fixed, 5);
          const achieved = w.toleranceAnalysis(circuit, { ...fixed, r1: allowance, r2: allowance });
          assert(achieved.deviation <= 5 + 1e-8, "Solved tolerance stays inside budget");
          const beyond = w.toleranceAnalysis(circuit, { ...fixed, r1: allowance + 0.00001, r2: allowance + 0.00001 });
          assert(beyond.deviation > 5, "Larger tolerance exceeds budget");
        }

        await reset(); set("p1", "0.0625"); set("p2", "2");
        assert(stressOutputs().join(",") === "5.76,NaN,0.18,NaN", "Independent power rating regressions");
        await reset(); set("p1", "0.03"); set("p2", "50"); valid("Smallest and largest power presets");
        assert(stressOutputs().join(",") === "12,NaN,0.0072,NaN", "30 mW and 50 W presets use their actual ratings");
        await reset(); set("vmax1", "3");
        assert(stressOutputs().slice(0, 2).join(",") === "1.44,200", "Working voltage stress cap retained");
        await reset(); set("vin", "100");
        assert(stressOutputs().every((value, index) => index % 2 ? Number.isNaN(value) : value === 100), "Exact power limit remains 100% stress");
        set("vin", "200");
        assert(stressOutputs().join(",") === "400,NaN,400,NaN", "Overload stress scaling retained");

        for (const [id, value] of [["r1", "0"], ["r2", "-1"], ["rl", "0"], ["vin", ""], ["tolR1", "-1"], ["tolR2", "100"], ["tolVin", ""], ["vmax1", "0"], ["vin", "1e309"]]) {
          await reset(); set(id, value); invalid(`Invalid ${id}=${value}`);
          assert(get(id).getAttribute("aria-invalid") === "true", `Invalid ${id} exposes aria-invalid`);
        }
        await reset(); set("vin", "1e308"); invalid("Numeric overflow");
        await reset();
        get("vin").value = "24"; get("dividerForm").requestSubmit();
        assert(text("vout") === "12 V", "Calculate submit updates in place");
        await reset();
        assert(get("solveFor").value === "vout" && get("tolR1").valueAsNumber === 0.1 && get("tolR2").valueAsNumber === 0.1 && get("tolRl").valueAsNumber === 0.1 && get("rl").value === "" && text("vout") === "6 V", "Reset restores original mode and 0.1% resistor defaults");
        const enableParts = arm => { get(`${arm}Multiple`).checked = true; get(`${arm}Multiple`).dispatchEvent(new w.Event("input", { bubbles: true })); };
        const ids = arm => [...get(`${arm}Parts`).children].map(row => row.dataset.part);
        const split = arm => get(`${arm}Split`).click();
        const click = selector => d.querySelector(selector).click();
        const choosePart = (arm, id) => { get(arm === "r1" ? "compareR1" : "compareR2").value = id; get(arm === "r1" ? "compareR1" : "compareR2").dispatchEvent(new w.Event("change", { bubbles: true })); };
        const armParts = arm => {
          const network = w.readNetwork(arm, "vout");
          const point = w.analyze(get("vin").valueAsNumber, get("r1").valueAsNumber * Number(get("r1Unit").value), get("r2").valueAsNumber * Number(get("r2Unit").value), null);
          return w.analyzeParts(network.parts, network.connection, arm === "r1" ? point.v1 : point.vout, arm === "r1" ? point.i1 : point.i2);
        };
        enableParts("r1");
        assert(ids("r1").length === 1 && get("r1").readOnly && get("tolR1").readOnly && get("p1Field").hidden, "Multiple RTOP uses per-part fields and calculated equivalents");
        assert(d.querySelector('[data-remove-part]').disabled, "Cannot remove the only physical part");
        split("r1"); valid("Four equal series parts");
        assert(ids("r1").length === 4 && get("r1Split").disabled, "Four-part shortcut creates exactly four parts");
        near(get("r1").valueAsNumber, 10, "Four series parts preserve 10 kΩ equivalent");
        for (const id of ids("r1")) near(get(`${id}R`).valueAsNumber, 2.5, "Four series parts are each 2.5 kΩ");
        assert(text("vout") === "6 V" && get("stressCards").children.length === 5, "Every physical part has a stress card");
        assert(get("operatingRows").rows.length === 6, "Operating table includes arm totals and each series part");
        assert(d.querySelectorAll('[data-schematic-part]').length === 5 && text("schematicR1Value") === "10 kΩ", "Schematic lists all physical parts beside the equivalent arm");
        assert(ids("r1").every(id => schematicField(id, "resistance") === "2.5 kΩ" && schematicField(id, "p") === "0.36%"), "Four-part schematic uses individual values and dissipation");
        assert([...get("schematicDrawing").querySelectorAll('[data-arm="r1"]')].every(node => node.dataset.connection === "series" && node.querySelector("path")), "Series work-form parts are drawn as individual connected resistor symbols");
        for (const part of armParts("r1")) {
          near(part.voltage, 1.5, "Equal series part voltage");
          near(part.current, 0.0006, "Equal series part current");
          near(part.power, 0.0009, "Equal series part dissipation");
        }
        set(`${ids("r1")[0]}Unit`, "1"); set(`${ids("r1")[0]}R`, "2500");
        near(get("r1").valueAsNumber, 10, "Mixed physical resistance units preserve the arm equivalent");
        assert([...d.querySelectorAll(".part-editor input")].every(input => input.labels.length === 1), "Every physical input has an associated label");
        for (const [index, id] of ids("r1").entries()) {
          set(`${id}Power`, [0.125, 0.1, 0.0625, 0.2][index]);
          set(`${id}Tol`, index + 1);
        }
        near(get("tolR1").valueAsNumber, 2.5, "Unequal series tolerances use resistance weighting");
        const seriesBounds = w.networkEquivalent(w.readNetwork("r1", "vout").parts, "series");
        near(seriesBounds.min, 9750, "Series minimum sums individual limits");
        near(seriesBounds.max, 10250, "Series maximum sums individual limits");
        assert(stressOutputs().filter((value, index) => index % 2 === 0).join(",") === "0.72,0.9,1.44,0.45,1.44", "Each part uses its unique power rating");
        assert(ids("r1").map(id => schematicField(id, "rating")).join(",") === "Rated 125 mW,Rated 100 mW,Rated 62.5 mW,Rated 200 mW", "Schematic retains unique physical power ratings");
        assert(ids("r1").map(id => schematicField(id, "tolerance")).join(",") === "±1%,±2%,±3%,±4%", "Schematic retains unique physical tolerances");
        set(`${ids("r1")[0]}Vmax`, "1");
        assert(stressOutputs().slice(0, 2).join(",") === "0.72,150", "Per-part working voltage caps stress");
        assert(schematicField(ids("r1")[0], "v") === "150%" && !schematicPart(ids("r1")[0]).querySelector('[data-field="i"]'), "Schematic includes each part's independent voltage stress without redundant current stress");
        const snapshotLink = get("schematicDownload");
        const snapshot = new DOMParser().parseFromString(await (await fetch(snapshotLink.href)).text(), "image/svg+xml");
        assert(!snapshot.querySelector("parsererror") && snapshot.documentElement.namespaceURI === "http://www.w3.org/2000/svg", "SVG download is well-formed standalone XML");
        assert(snapshot.querySelectorAll('[data-schematic-part]').length === 5 && snapshot.getElementById("schematicVmid").textContent === "VMID 6 V" && snapshot.querySelector(`[data-schematic-part="${ids("r1")[0]}"] [data-field="v"]`).textContent === "150%", "SVG download captures all current values and stresses");
        assert(!snapshot.querySelector("image, script, link") && !get("schematicViewport").querySelector('a[target="_blank"], a[href$=".svg"]') && snapshotLink.download === "voltage_divider.svg" && !snapshotLink.target, "Schematic has no separate image-opening links and retains a self-contained SVG download");
        choosePart("r1", ids("r1")[3]);
        assert(text("compareR1Heading").includes("R1.4") && get("ratingRows").rows.length === 16, "Comparison selector includes custom individual power rating");
        assert(get("ratingRows").querySelectorAll(".chosen").length === 4, "Custom and standard chosen ratings are highlighted");

        await reset(); enableParts("r1"); split("r1");
        for (const [index, id] of ids("r1").entries()) { set(`${id}R`, index + 1); set(`${id}Power`, index === 3 ? 0.01 : 0.125); }
        set("vin", "100");
        const unequalParts = armParts("r1");
        for (const [index, part] of unequalParts.entries()) near(part.power, [0.025, 0.05, 0.075, 0.1][index], "Unequal series power distribution");
        near(unequalParts.reduce((sum, part) => sum + part.power, 0), 0.25, "Physical powers sum to arm power");
        assert(get("stressCards").querySelectorAll(".badge.bad").length === 1 && stressOutputs()[6] === 1000, "Weak part overload is not hidden by total available wattage");
        assert(schematicField(ids("r1")[3], "p") === "1000%" && schematicPart(ids("r1")[3]).querySelector('[data-field="p"]').getAttribute("fill") === "#ff8e8e", "Schematic identifies an overloaded individual resistor");
        set("vin", "12"); set("solveFor", "r1"); set("targetVout", "4");
        valid("Inverse solve scales a series arm");
        near(get("r1").valueAsNumber, 20, "Solved series equivalent is 20 kΩ");
        for (const [index, id] of ids("r1").entries()) {
          near(get(`${id}R`).valueAsNumber, (index + 1) * 2, "Inverse solve preserves part ratios");
          assert(get(`${id}R`).readOnly, "Solved part resistance is read-only");
        }
        assert(get(`${ids("r1")[3]}Power`).valueAsNumber === 0.01, "Solving resistance preserves individual power ratings");
        set("targetVout", "12"); invalid("Infeasible network solve");
        assert(ids("r1").every(id => get(`${id}R`).value !== ""), "An infeasible target preserves physical resistance ratios");
        set("targetVout", "4"); valid("Network inverse solve recovers");

        await reset(); enableParts("r1"); set("r1Connection", "parallel"); split("r1");
        assert(get("schematicDrawing").querySelectorAll('[data-arm="r1"][data-connection="parallel"]').length === 4, "A four-part parallel work-form arm draws four parallel resistor branches");
        valid("Four equal parallel parts");
        for (const id of ids("r1")) near(get(`${id}R`).valueAsNumber, 40, "Four parallel parts preserve equivalent resistance with 40 kΩ each");
        for (const part of armParts("r1")) {
          near(part.voltage, 6, "Parallel parts share arm voltage");
          near(part.current, 0.00015, "Equal parallel part current");
          near(part.power, 0.0009, "Equal parallel part dissipation");
        }
        assert(ids("r1").every(id => schematicField(id, "resistance") === "40 kΩ" && schematicField(id, "p") === "0.36%" && schematicField(id, "v") === "—"), "Parallel schematic uses individual branch resistance and power stress without inventing voltage ratings");

        await reset(); set("tolR2", "1"); enableParts("r1"); set("r1Connection", "parallel");
        set(`${ids("r1")[0]}R`, "2"); set(`${ids("r1")[0]}Tol`, "10");
        click('[data-add-part="r1"]'); set(`${ids("r1")[1]}R`, "6"); set(`${ids("r1")[1]}Tol`, "20");
        const parallelNetwork = w.readNetwork("r1", "vout");
        near(parallelNetwork.equivalent.resistance, 1500, "Unequal parallel nominal resistance");
        near(parallelNetwork.equivalent.min, 14400 / 11, "Unequal parallel exact minimum");
        near(parallelNetwork.equivalent.max, 79200 / 47, "Unequal parallel exact maximum");
        assert(Math.abs(1500 - parallelNetwork.equivalent.min - (parallelNetwork.equivalent.max - 1500)) > 1, "Unequal parallel tolerance interval is asymmetric");
        assert(text("voutMin") === w.format(5583600 / 544500, "V") && text("voutMax") === w.format(1333200 / 125500, "V"), "Output uses exact asymmetric network bounds");
        const physicalParallel = armParts("r1");
        near(physicalParallel[0].power / physicalParallel[1].power, 3, "Unequal parallel power follows inverse resistance");
        assert(physicalParallel.every(part => ["p", "v"].every(field => schematicField(part.id, field) === w.percent(part.stress[field]))), "Unequal parallel schematic follows each branch's actual power and voltage stress");
        set("vin", "-12");
        assert(text("voutMin") === w.format(-1333200 / 125500, "V") && text("voutMax") === w.format(-5583600 / 544500, "V"), "Negative source reverses network output bounds");
        enableParts("r2"); click('[data-add-part="r2"]');
        set(`${ids("r2")[0]}R`, "3"); set(`${ids("r2")[0]}Tol`, "5"); set(`${ids("r2")[1]}R`, "7"); set(`${ids("r2")[1]}Tol`, "1");
        set("vin", "-24"); set("tolVin", "2"); set("rl", "8"); set("tolRl", "3");
        valid("Both arms use mixed network types with a load");
        assert(get("singleRatingFields").hidden && get("singleVoltageOptions").hidden, "Multiple arms use no fictitious aggregate rating");
        const top = w.readNetwork("r1", "vout"), bot = w.readNetwork("r2", "vout");
        const networkRange = w.toleranceAnalysis({ vin: -24, r1: 1500, r2: 10000, rl: 8000 }, { vin: 2, r1: 0, r2: 0, rl: 3 }, { r1: [top.equivalent.min, top.equivalent.max], r2: [bot.equivalent.min, bot.equivalent.max] });
        const physicalCorners = [];
        for (let mask = 0; mask < 64; mask++) {
          const sign = bit => (mask & (1 << bit)) ? 1 : -1;
          const a = 2000 * (1 + sign(0) * 0.1), b = 6000 * (1 + sign(1) * 0.2);
          physicalCorners.push(w.analyze(-24 + sign(4) * 0.48, a * b / (a + b), 3000 * (1 + sign(2) * 0.05) + 7000 * (1 + sign(3) * 0.01), 8000 * (1 + sign(5) * 0.03)).vout);
        }
        near(networkRange.min, Math.min(...physicalCorners), "Physical 64-corner exhaustive minimum");
        near(networkRange.max, Math.max(...physicalCorners), "Physical 64-corner exhaustive maximum");
        set("solveFor", "tolerance"); valid("Shared tolerance solve with multiple physical parts");
        const solvedCommon = get(`${ids("r1")[0]}Tol`).valueAsNumber;
        for (const arm of ["r1", "r2"]) for (const id of ids(arm)) {
          near(get(`${id}Tol`).valueAsNumber, solvedCommon, "Tolerance solver assigns every physical part");
          assert(schematicField(id, "tolerance") === `±${w.percent(solvedCommon)}`, "Schematic shows the solved physical tolerance");
          assert(get(`${id}Tol`).readOnly, "Solved physical tolerance is read-only");
        }
        assert(Number.parseFloat(text("voutError")) <= 5, "Shared network tolerance meets output error budget");

        await reset(); enableParts("r2"); set("r2Connection", "parallel"); split("r2");
        set("solveFor", "r2"); set("targetVout", "4"); valid("RBOT inverse solve with parallel parts");
        near(get("r2").valueAsNumber, 5, "Solved parallel RBOT equivalent");
        for (const id of ids("r2")) near(get(`${id}R`).valueAsNumber, 20, "Solved parallel part values");
        set("rl", "10"); near(get("r2").valueAsNumber, 10, "Loaded parallel RBOT inverse solve");

        for (const [suffix, value] of [["R", "0"], ["Power", "0"], ["Power", ""], ["Tol", "100"], ["Vmax", "-1"]]) {
          await reset(); enableParts("r1"); split("r1");
          const id = ids("r1")[1]; set(`${id}${suffix}`, value); invalid(`Invalid physical ${suffix}`);
          assert(get(`${id}${suffix}`).getAttribute("aria-invalid") === "true", "Physical input exposes invalid state");
          set(`${id}${suffix}`, suffix === "Vmax" ? "" : suffix === "Power" ? "0.125" : suffix === "Tol" ? "1" : "2.5");
          valid("Physical input recovers without losing the other parts");
          assert(ids("r1").length === 4, "Invalid part preserves the network");
        }
        await reset(); enableParts("r1"); split("r1"); choosePart("r1", ids("r1")[2]);
        const removedId = ids("r1")[2]; get(removedId).querySelector("button").click();
        assert(ids("r1").length === 3 && get("stressCards").children.length === 4 && ![...get("compareR1").options].some(option => option.value === removedId), "Removing a part updates analysis, stress, and comparison choices");
        get("r1Multiple").checked = false; get("r1Multiple").dispatchEvent(new w.Event("input", { bubbles: true }));
        assert(!get("r1").readOnly && get("r1Editor").hidden && ids("r1").every(id => get(`${id}R`).disabled), "Single-part mode ignores retained editor fields");
        enableParts("r1"); assert(ids("r1").length === 3, "Re-enabling preserves the physical parts");
        assert(new Set([...d.querySelectorAll("[id]")].map(element => element.id)).size === d.querySelectorAll("[id]").length, "Dynamic physical part IDs remain unique");
        for (const connection of ["series", "parallel"]) {
          set("r1Connection", connection); enableParts("r2"); split("r2");
          for (const mode of ["vout", "vin", "r1", "r2", "rl", "tolerance"]) {
            set("solveFor", mode); valid(`Network mode ${mode} with ${connection}`);
            for (const width of [320, 390, 768, 900, 1440]) {
              frame.style.width = `${width}px`; await new Promise(resolve => setTimeout(resolve, 5));
              assert(d.documentElement.scrollWidth <= width, `Network layout: ${connection}, ${mode}, ${width}px`);
            }
          }
          await reset(); enableParts("r1"); split("r1");
        }
        await reset();
        assert(!get("r1Multiple").checked && !get("r2Multiple").checked && !ids("r1").length && !ids("r2").length && get("stressCards").children.length === 2 && text("vout") === "6 V", "Reset removes networks and restores the original calculator");
        assert(d.querySelectorAll('[data-schematic-part]').length === 2 && text("schematicLoadValue") === "Open" && get("schematicLoad").getAttribute("opacity") === "0.35", "Reset restores the two-resistor schematic and open load");
        assert(d.querySelector("img.schematic").complete && d.querySelector("img.schematic").naturalWidth === 640, "Schematic image loads");
        assert(!!(d.querySelector(".mode-picker").compareDocumentPosition(get("circuitReference")) & w.Node.DOCUMENT_POSITION_FOLLOWING), "Calculation choices appear before the circuit reference");
        for (const link of [...d.querySelectorAll("a[href]")].filter(a => a.origin === location.origin)) {
          assert((await fetch(link.href)).ok, `Local resource loads: ${link.getAttribute("href")}`);
        }
        const toolsPage = await (await fetch("../../tools.html")).text();
        const toolsDocument = new DOMParser().parseFromString(toolsPage, "text/html");
        assert(!!toolsDocument.querySelector('a[href="calculators/voltage_divider.html"]'), "Tools page links to calculator");
        const visible = id => get(id).getBoundingClientRect().width > 0 && get(id).getBoundingClientRect().height > 0;
        const pick = mode => d.querySelector(`[data-solve-mode="${mode}"]`).click();
        const resultTabs = [...get("resultTabs").querySelectorAll('[role="tab"]')];
        const activeView = () => d.querySelector('[role="tab"][aria-selected="true"]')?.id;
        w.openCalculatorDetails("results");
        assert(activeView() === "overviewTab" && visible("overviewPanel") && !visible("catalogPanel"), "Results start with only the operating overview visible");
        const circuitBeforeTabs = [...get("dividerForm").elements].map(input => input.value).join("|");
        for (const tab of resultTabs) {
          tab.click();
          assert(d.querySelectorAll('[role="tabpanel"]:not([hidden])').length === 1 && visible(tab.getAttribute("aria-controls")), `${tab.textContent}: shows only the selected result panel`);
          assert(tab.getAttribute("aria-selected") === "true" && resultTabs.filter(item => item.tabIndex === 0).length === 1 && tab.tabIndex === 0, `${tab.textContent}: selection and keyboard tab stop agree`);
          assert(visible("solutionValue") && !visible("vin") && visible("liveSchematic"), `${tab.textContent}: detailed results keep input forms out of view and preserve the circuit reference`);
        }
        assert([...get("dividerForm").elements].map(input => input.value).join("|") === circuitBeforeTabs, "Browsing every results tab preserves all circuit inputs");
        const key = value => d.activeElement.dispatchEvent(new w.KeyboardEvent("keydown", { key: value, bubbles: true, cancelable: true }));
        get("overviewTab").focus(); key("End");
        assert(activeView() === "methodTab" && d.activeElement === get("methodTab") && visible("methodPanel"), "End focuses and activates the last results tab");
        key("ArrowRight");
        assert(activeView() === "overviewTab" && d.activeElement === get("overviewTab"), "Right arrow wraps from last to first tab");
        key("ArrowLeft");
        assert(activeView() === "methodTab" && d.activeElement === get("methodTab"), "Left arrow wraps from first to last tab");
        key("Home"); key("ArrowRight");
        assert(activeView() === "toleranceTab" && d.activeElement === get("toleranceTab"), "Home and right arrow activate the expected result view");
        get("overviewTab").click(); get("catalogFamily").focus();
        assert(d.activeElement !== get("catalogFamily") && !visible("catalogCandidates"), "Inactive parts controls are hidden and cannot receive focus");
        get("toleranceTab").click(); w.openCalculatorDetails("inputs", "vin"); get("vin").focus(); set("vin", "24");
        assert(activeView() === "toleranceTab" && d.activeElement === get("vin") && text("voutMin") === "11.99 V", "Live edits update a selected view without changing tabs or input focus");
        get("methodTab").click(); set("r1", "0"); w.openCalculatorDetails("results");
        assert(visible("inputError") && activeView() === "methodTab" && text("solutionValue") === "—", "Validation errors and cleared solved values remain visible from every tab");
        await reset(); pick("pairs"); w.openCalculatorDetails("inputs");
        assert(activeView() === "pairTab" && visible("pairVin") && !visible("dividerForm"), "Combination options expose the focused search form without the circuit form");
        get("partsTab").click(); get("pairForm").requestSubmit(); await w.pairSearchReady;
        assert(activeView() === "pairTab", "Finding pairs returns to the performance chart");
        pick("vout");
        assert(activeView() === "overviewTab", "Choosing a voltage calculation returns to the overview");
        get("methodTab").click(); get("dividerForm").requestSubmit();
        assert(activeView() === "overviewTab", "Calculate VMID returns to the overview");
        w.openCalculatorDetails("results");
        for (const width of [320, 390, 768, 900, 1440]) {
          frame.style.width = `${width}px`; await new Promise(resolve => setTimeout(resolve, 5));
          for (const tab of resultTabs) {
            tab.click();
            assert(d.documentElement.scrollWidth <= width && resultTabs.every(item => item.getBoundingClientRect().width >= 60), `${tab.textContent}: tab navigation and selected content fit at ${width}px`);
          }
        }
        await reset();
        w.openCalculatorDetails("inputs");
        assert(activeView() === "overviewTab", "Reset restores the default results tab");
        assert(d.querySelector(".live-tag").textContent === "DC analysis · Online calculator", "Header uses the requested calculator label");
        const views = [
          ["vout", ["vin", "r1", "r2"], ["targetVout"], "Calculate VMID"],
          ["vin", ["targetVout", "r1", "r2"], ["vin"], "Calculate VTOP"],
          ["r1", ["vin", "targetVout", "r2"], ["r1"], "Calculate RTOP"],
          ["r2", ["vin", "targetVout", "r1"], ["r2"], "Calculate RBOT"],
          ["rl", ["vin", "targetVout", "r1", "r2"], ["rl"], "Calculate RL"]
        ];
        for (const [mode, known, calculated, action] of views) {
          await reset(); pick(mode); valid(`Visible mode choice ${mode}`);
          assert(get("solveFor").value === mode, "Goal button selects its calculation");
          assert(d.querySelectorAll('[data-solve-mode][aria-pressed="true"]').length === 1 && d.querySelector(`[data-solve-mode="${mode}"]`).getAttribute("aria-pressed") === "true", "Exactly one goal is marked active");
          assert(known.every(visible), `Known values are visible in ${mode}`);
          assert(calculated.every(id => !visible(id)), `Calculated values are absent from the input view in ${mode}`);
          assert(text("calculateButton") === action, "Calculate action names the quantity");
          assert(!get("advancedOptions").open && !get("loadOptions").open, "Optional settings start collapsed");
          if (["r1", "r2"].includes(mode)) assert(get(`${mode}Field`).parentElement === get("solvedArmSlot"), "Calculated arm construction remains available separately");
        }
        await reset();
        get("r1").focus(); set("r1", "20");
        assert(d.activeElement === get("r1") && text("vout") === "4 V", "Typing updates results without losing input focus");
        pick("vin"); pick("r1"); pick("vout");
        near(get("r1").valueAsNumber, 20, "Mode changes retain circuit values");
        assert(visible("r1") && visible("vin") && !visible("targetVout"), "Returning to VMID restores the proper input view");
        await reset(); set("tolR1", "-1");
        assert(get("advancedOptions").open && visible("tolR1"), "Invalid hidden tolerance settings reveal themselves");
        set("tolR1", "1"); valid("Revealed tolerance error recovers");
        get("advancedOptions").open = false; set("vin", "24");
        assert(!get("advancedOptions").open, "Normal edits preserve disclosure choices");
        await reset(); get("r1PartsOptions").open = true; enableParts("r1"); split("r1");
        assert(ids("r1").filter(id => get(id).open).length === 1, "Four-part editor opens one part and summarizes the rest");
        assert(ids("r1").every(id => text(`${id}Description`).includes("2.5 kΩ") && text(`${id}Description`).includes("250 mW")), "Closed part summaries show resistance and power rating");
        const focusedPart = ids("r1")[0];
        get(`${focusedPart}Power`).focus(); set(`${focusedPart}Power`, "0.125");
        assert(d.activeElement === get(`${focusedPart}Power`) && text(`${focusedPart}Description`).includes("125 mW"), "Part editing preserves focus and updates its summary");
        get(focusedPart).open = false; get("r1PartsOptions").open = false;
        set(`${focusedPart}Power`, "0");
        assert(get(focusedPart).open && get("r1PartsOptions").open && visible(`${focusedPart}Power`), "Nested invalid part settings expand for correction");
        set(`${focusedPart}Power`, "0.125"); valid("Nested physical part error recovers");
        pick("r1");
        assert(get("r1Field").parentElement === get("solvedArmSlot") && ids("r1").length === 4, "Moving to an arm solve preserves physical parts");
        pick("vout");
        assert(get("r1Field").parentElement === get("r1KnownSlot") && ids("r1").length === 4, "Moving back restores the physical arm to known inputs");
        await reset();
        assert(!get("advancedOptions").open && !get("r1PartsOptions").open && !get("r2PartsOptions").open, "Reset closes optional editors");
        for (const mode of ["vout", "vin", "r1", "r2", "rl", "tolerance"]) {
          await reset(); set("solveFor", mode); valid(`Mode ${mode} default transition`);
          for (const width of [320, 390, 768, 900, 1440]) {
            frame.style.width = `${width}px`;
            await new Promise(resolve => setTimeout(resolve, 5));
            assert(d.documentElement.scrollWidth <= width, `No page overflow: ${mode} at ${width}px`);
            const knownArm = mode === "r1" ? "r2" : "r1";
            assert(get(knownArm).getBoundingClientRect().width >= 100, `Usable known resistance input: ${mode} at ${width}px`);
            const schematicBounds = get("liveSchematic").getBoundingClientRect();
            assert([...get("liveSchematic").querySelectorAll("text")].every(node => { const bounds = node.getBoundingClientRect(); return bounds.left >= schematicBounds.left - 1 && bounds.right <= schematicBounds.right + 1 && bounds.top >= schematicBounds.top - 1 && bounds.bottom <= schematicBounds.bottom + 1; }), `Schematic annotations fit: ${mode} at ${width}px`);
          }
        }
        await reset();
      } catch (error) { failures.push(error.stack); }
      document.getElementById("testResults").textContent = JSON.stringify({ status: failures.length ? "FAIL" : "PASS", count: checks.length, failures, checks }, null, 2);
      document.body.dataset.status = failures.length ? "FAIL" : "PASS";
    });
  </script>
</body>
</html>
