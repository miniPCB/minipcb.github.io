<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory groups and full-height pane</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:1800px;border:0}</style><h1>Grouped independent memories and full-height pane</h1><pre id="results">RUNNING</pre><script>
"use strict";
const key='minipcb-divider-memory-v1',previous=localStorage.getItem(key),checks=[],failures=[],errors=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label)},pause=()=>new Promise(resolve=>setTimeout(resolve,60));
const load=async suffix=>{const frame=document.createElement('iframe');frame.title='Grouped memory calculator';frame.src='../voltage_divider.html?memory-groups='+suffix;const ready=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));document.body.append(frame);await ready;const w=frame.contentWindow;await Promise.all([w.resistorCatalogReady,w.circuitLogoReady,w.calculatorBuildReady]);w.addEventListener('error',event=>errors.push(event.message));await pause();return frame};
(async()=>{try{
 localStorage.removeItem(key);const initial=await load('seed'),baseline=initial.contentWindow.dividerMemory.entries[0],original=baseline.state;
 const fixture=(id,time,vin,name='',title='Voltage Divider')=>{const entry=JSON.parse(JSON.stringify(baseline));entry.id=id;entry.savedAt=time;if(name)entry.name=name;entry.state.controls.find(row=>row[0]==='vin')[1]=String(vin);entry.state.controls.find(row=>row[0]==='circuitTitle')[1]=title;return entry};
 const data=[fixture('a','2026-11-01T12:00:00Z',12),fixture('b','2026-11-01T12:02:00Z',14),fixture('c','2026-11-01T12:08:00Z',16),fixture('d','2026-11-01T12:09:00Z',18,'OVLO bench'),fixture('e','2026-11-01T12:10:00Z',20),fixture('f','2026-11-01T12:11:00Z',22,'Low power'),fixture('g','2026-11-01T13:00:00Z',24,'','Satellite sense'),fixture('h','2026-11-02T13:00:00Z',26,'','SATELLITE SENSE'),fixture('i','2026-11-02T13:01:00Z',28,'','Battery monitor')];
 localStorage.setItem(key,JSON.stringify({version:2,auto:false,expanded:true,paneWidth:300,original,entries:data.reverse()}));initial.remove();
 const frame=await load('main'),w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),memory=w.dividerMemory,groups=()=>[...get('memoryList').querySelectorAll(':scope > li > details')],row=id=>d.querySelector(`[data-memory-id="${id}"]`),group=id=>row(id).closest('[data-memory-group]'),label=node=>node.querySelector(':scope > summary > span').textContent;
 assert(memory.entries.length===9&&get('memoryList').querySelectorAll('.memory-entry').length===9,'Grouping retains every complete independent snapshot');
 assert(groups().length===5&&group('a')===group('b')&&group('b')!==group('c'),'Nearby default timestamps group together and a gap longer than five minutes starts another group');
 assert(group('c')===group('d')&&group('d')===group('e')&&label(group('d'))==='OVLO bench'&&group('e')!==group('f')&&label(group('f'))==='Low power','Custom memory names label nearby revisions and distinguish named sessions');
 assert(group('g')===group('h')&&label(group('g'))==='Satellite sense'&&group('h')!==group('i'),'Shared circuit titles group a design across dates without mixing other titles');
 assert(groups().every(node=>Number(node.querySelector('.memory-group-count').textContent)===node.querySelectorAll('.memory-entry').length)&&get('memoryCount').textContent==='9','Group counts and the total memory count remain accurate');
 assert(groups()[0]===group('i')&&group('i').open&&!group('d').open&&!row('d').getBoundingClientRect().height,'Most recent groups are first and older groups can start collapsed with their members hidden');
 const before=JSON.stringify(w.captureMemoryState()),stamp=w.eval('schematicState.analyzedAt');group('d').querySelector('summary').click();await pause();assert(group('d').open&&JSON.stringify(w.captureMemoryState())===before&&w.eval('schematicState.analyzedAt')===stamp,'Opening a group changes presentation without recalling or recalculating');
 for(const node of groups())node.open=false;await pause();assert(Math.abs(get('calculatorMemory').getBoundingClientRect().bottom-(w.innerHeight-12))<2&&get('calculatorMemory').clientHeight>get('memoryList').clientHeight+100,'The pane background extends to the screen bottom even when all groups are collapsed');
 await memory.restore('h');assert(group('h').open&&get('vin').value==='26'&&d.activeElement===row('h').querySelector('.memory-restore'),'Recalling a hidden member opens its group and restores that exact circuit');
 await memory.restore('e');const saved=JSON.stringify(memory.entries.find(entry=>entry.id==='e').state);row('e').querySelector('.memory-rename').click();let input=d.querySelector('.memory-name-input');input.value='Radiation <branch>';input.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
 assert(label(group('e'))==='Radiation <branch>'&&group('e').open&&!get('memoryList').querySelector('branch')&&JSON.stringify(memory.entries.find(entry=>entry.id==='e').state)===saved,'Renaming immediately updates safe group labels while preserving the full saved circuit and visibility');
 const set=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new w.Event('input',{bubbles:true}))};set('circuitTitle','Battery monitor');set('vin','30');const newest=memory.save();assert(group(newest.id)===group('i')&&group('i').querySelectorAll('.memory-entry').length===2,'New calculations with an existing circuit title join its group');
 const next=await load('return');assert(next.contentWindow.dividerMemory.entries.length===10&&next.contentDocument.querySelector(`[data-memory-id="e"] .memory-restore`).textContent==='Radiation <branch>'&&next.contentDocument.querySelectorAll('.memory-group').length===6,'A fresh visit rebuilds groups without changing persisted snapshots or custom names');
 for(const width of [320,390,1440]){frame.style.width=width+'px';await pause();get('calculatorMemory').open=true;await pause();assert(d.documentElement.scrollWidth<=width&&[...get('memoryList').querySelectorAll('summary,button')].filter(node=>node.getBoundingClientRect().width).every(node=>node.getBoundingClientRect().right<=width),width+'px: group headers and member actions fit the page');if(width<1320)assert(!get('calculatorMemory').style.height&&get('memoryList').style.maxHeight==='none',width+'px: grouped mobile memory grows with the page');}
 assert(!errors.length,'No runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack)}finally{if(previous===null)localStorage.removeItem(key);else localStorage.setItem(key,previous);document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2)}})();
</script></html>
