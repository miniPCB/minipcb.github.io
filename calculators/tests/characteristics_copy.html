<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Characteristics clipboard checks</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:1100px;border:0}</style><h1>Circuit characteristics copy for Excel</h1><pre id="results">RUNNING</pre><iframe id="calculator" src="../voltage_divider.html?characteristics-copy-test=1" title="Calculator under test"></iframe><script>
"use strict";

 const frame=event.target,w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),button=()=>get('characteristicsCopy'),state=()=>w.eval('schematicState'),status=()=>get('characteristicsCopyStatus'),fallback=()=>get('characteristicsCopyFallback'),input=()=>get('characteristicsCopyText'),table=()=>get('characteristicsTable');
 assert(await w.resistorCatalogReady,'Catalogs load');await w.circuitLogoReady;await w.calculatorBuildReady;const errors=[];w.addEventListener('error',event=>errors.push(event.message));

 const clipboard=value=>Object.defineProperty(w.navigator,'clipboard',{configurable:true,value}),set=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new w.Event('input',{bubbles:true}))},snapshot=()=>JSON.stringify(w.captureMemoryState()),field=name=>table().querySelector(`[data-field="${name}"]`),normalize=text=>text.replace(/\r\n/g,'\n');
 const expected=()=>[['Characteristic','Value'],...[...get('characteristicsBody').rows].map(row=>[row.cells[0].textContent,row.cells[1].querySelector('a')?.href||row.cells[1].textContent])],tsv=rows=>rows.map(row=>row.join('\t')).join('\r\n')+'\r\n';
 get('characteristicsToggle').click();await new Promise(resolve=>setTimeout(resolve,250));button().focus();let items=[],plain='';clipboard({write:async value=>{items=value},writeText:async text=>{plain=text}});
 const original=snapshot(),stamp=state().analyzedAt,downloads=['schematicDownload','ltspiceDownload','markdownDownload'].map(id=>get(id).href).join('|');button().click();await pause();

 const text=await(await items[0].getType('text/plain')).text(),html=await(await items[0].getType('text/html')).text(),saved=new DOMParser().parseFromString(html,'text/html'),rows=expected(),cells=[...saved.querySelectorAll('tr')].map(row=>[...row.cells].map(cell=>cell.textContent));
 assert(text===tsv(rows)&&text.endsWith('\r\n')&&text.split('\r\n').slice(0,-1).every(row=>row.split('\t').length===2),'Plain text has exactly two tab-separated columns, column headings and Windows row endings');

 assert(saved.querySelector('a')?.getAttribute('href')==='https://www.minipcb.com/calculators/voltage_divider.html'&&saved.querySelector('th').getAttribute('style').includes('background-color'),'The formatted clipboard table includes a working source link and styled headings');
 assert(button().textContent==='Copied'&&!button().disabled&&status().textContent==='Characteristics copied for Excel.'&&d.activeElement===button()&&fallback().hidden,'Successful copy confirms completion and keeps focus on the button');
 assert(snapshot()===original&&state().analyzedAt===stamp&&!w.eval('leaveWarningActive')&&downloads===['schematicDownload','ltspiceDownload','markdownDownload'].map(id=>get(id).href).join('|'),'Copy changes no inputs, timestamps, dirty state or export URLs');
 w.renderSchematic();assert(button().textContent==='Copied','A redraw of the same table preserves confirmation');
 set('vin','14');assert(button().textContent==='Copy'&&status().textContent===''&&fallback().hidden,'A changed characteristic clears the old copy confirmation');
 clipboard({writeText:async text=>{plain=text}});await w.copyCharacteristics();assert(plain===tsv(expected())&&plain.includes('Find VMID\t7 V')&&button().textContent==='Copied','Browsers with plain-text copying only receive current values in Excel columns');
 plain='';clipboard({write:async()=>{throw new w.DOMException('HTML clipboard unavailable','NotSupportedError')},writeText:async text=>{plain=text}});await w.copyCharacteristics();assert(plain===tsv(expected())&&fallback().hidden,'Unsupported rich copying falls back to tab-separated plain text');
 clipboard({write:async()=>{throw new w.DOMException('Denied','NotAllowedError')},writeText:async()=>{throw new w.DOMException('Denied','NotAllowedError')}});const beforeBlocked=snapshot();await w.copyCharacteristics();
 assert(!fallback().hidden&&input().readOnly&&normalize(input().value)===normalize(tsv(expected()))&&d.activeElement===input()&&input().selectionStart===0&&input().selectionEnd===input().value.length,'Blocked clipboard access offers the complete selected table for manual copying');
 assert(status().textContent.includes('Clipboard unavailable')&&snapshot()===beforeBlocked,'Clipboard failure is explained without changing the circuit');
 set('vin','16');assert(fallback().hidden&&input().value===''&&button().textContent==='Copy','New circuit values remove a stale manual-copy table');
 let rejectWrite,stalePlain=0,pendingCalls=0;clipboard({write:()=>{pendingCalls++;return new Promise((resolve,reject)=>{rejectWrite=reject})},writeText:async()=>{stalePlain++}});const pending=w.copyCharacteristics();await w.copyCharacteristics();assert(pendingCalls===1&&button().getAttribute('aria-busy')==='true','An in-progress copy prevents duplicate activation');set('vin','18');rejectWrite(new w.DOMException('Denied','NotAllowedError'));await pending;
 assert(button().textContent==='Copy'&&!button().disabled&&status().textContent===''&&fallback().hidden&&stalePlain===0,'An old copy failure cannot replace new values or show stale confirmation/fallback');
 clipboard({writeText:async text=>{plain=text}});set('solveFor','vin');set('targetVout','5');const inverse=snapshot();await w.copyCharacteristics();assert(plain===tsv(expected())&&plain.includes('Find VTOP\t')&&snapshot()===inverse,'Inverse-mode copying follows the displayed solved quantity');
 get('dividerForm').reset();get('pairForm').reset();await pause();set('solveFor','pairs');set('pairMinR','10000');set('pairMaxR','10000');get('pairForm').requestSubmit();await w.pairSearchReady;const matches=w.eval('pairItems'),mixed=matches.findIndex(pair=>pair.top.familyId!==pair.bot.familyId);w.selectPair(mixed);const preview=snapshot();await w.copyCharacteristics();
 assert(mixed>=0&&plain===tsv(expected())&&plain.includes('Combination preview')&&plain.includes('Worst target error\t'+field('worstError').textContent)&&snapshot()===preview,'A mixed-family solution copies its preview characteristics without applying or changing the circuit');
 get('dividerForm').reset();get('pairForm').reset();await pause();set('r1','0');await w.copyCharacteristics();assert(plain===tsv(expected())&&plain.includes('Nominal total power\t—')&&!plain.includes('Combination preview'),'Invalid inputs copy unavailable values rather than stale results');
 get('dividerForm').reset();await pause();
 for(const width of [320,390,768,1440]){
  frame.style.width=width+'px';await new Promise(resolve=>setTimeout(resolve,250));const panel=get('characteristicsDrawer').getBoundingClientRect(),header=d.querySelector('.characteristics-header').getBoundingClientRect();await w.copyCharacteristics();
  assert([button(),get('characteristicsClose')].every(control=>{const b=control.getBoundingClientRect();return b.width>=44&&b.height>=44&&b.left>=panel.left&&b.right<=panel.right&&b.top>=header.top&&b.bottom<=header.bottom}),width+'px: Copy and Close remain visible, separate, touch-sized header controls');
  assert(d.querySelector('.characteristics-scroll').scrollWidth<=d.querySelector('.characteristics-scroll').clientWidth+1&&plain===tsv(expected()),width+'px: clipboard columns stay identical to the visible table without drawer overflow');
 }
 assert(errors.length===0,'No uncaught errors: '+errors.join('; '));
 document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',checks:checks.length,failures},null,2);
}catch(error){document.getElementById('results').textContent=JSON.stringify({status:'ERROR',error:error.stack,checks,failures},null,2)}finally{restoreClipboard?.()}});
</script></html>
