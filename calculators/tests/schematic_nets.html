<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schematic net conventions</title><style>body{margin:16px;background:#101823;color:#eaf6ff;font:14px system-ui}pre{white-space:pre-wrap}iframe{display:block;width:1440px;height:2200px;border:0}</style><h1>Net colors, symbol leads and junction checks</h1><pre id="results">RUNNING</pre><iframe id="calculator" title="Calculator under test" src="../voltage_divider.html?net-style-test=1"></iframe><script>
"use strict";
const checks=[],failures=[],assert=(ok,label)=>{checks.push(label);if(!ok)failures.push(label);},near=(a,b)=>Math.abs(a-b)<1e-8,pause=()=>new Promise(resolve=>setTimeout(resolve,20));
document.getElementById('calculator').addEventListener('load',async event=>{try{
 const frame=event.target,w=frame.contentWindow,d=w.document,get=id=>d.getElementById(id),drawing=()=>get('schematicDrawing'),errors=[];w.addEventListener('error',event=>errors.push(event.message));assert(await w.resistorCatalogReady,'Catalogs load');await w.circuitLogoReady;
 const set=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new w.Event('input',{bubbles:true}));},reset=async()=>{get('dividerForm').reset();get('pairForm').reset();await pause();};
 const color=(net,mode)=>net==='VMID'&&mode==='vout'||net==='VTOP'&&mode==='vin'?'rgb(255, 142, 142)':'rgb(84, 210, 255)',point=(path,end)=>path.getPointAtLength(end?path.getTotalLength():0),same=(a,b)=>near(a.x,b.x)&&near(a.y,b.y);
 const verifyOutput=(label,mode)=>{
  const name=drawing().querySelector('[data-net-label="VMID"]'),pin=drawing().querySelector('[data-output-terminal="VMID"]'),mobile=get('liveSchematic').dataset.layout==='mobile';
  assert(drawing().querySelectorAll('[data-net-label="VMID"]').length===1&&name?.textContent==='VMID'&&w.getComputedStyle(name).fill===color('VMID',mode),label+': output has one VMID net label with the current net color');
  const text=name.getBBox(),terminal=pin.getBBox(),gap=mobile?terminal.y-text.y-text.height:text.x-terminal.x-terminal.width;
  assert(gap>=3&&gap<=16&&(mobile?Math.abs(text.x+text.width-(terminal.x+terminal.width/2))<2:Math.abs(text.y+text.height/2-(terminal.y+terminal.height/2))<10),label+': VMID is next to the pin with a clear gap');
  const snapshot=new DOMParser().parseFromString(w.circuitFrameSnapshot().markup,'image/svg+xml'),saved=snapshot.querySelector('[data-net-label="VMID"]');
  assert(!snapshot.querySelector('parsererror')&&saved?.textContent==='VMID'&&saved.getAttribute('fill')===name.getAttribute('fill')&&snapshot.querySelector('[data-output-terminal="VMID"]'),label+': framed SVG retains the output label, terminal and role color');
 };
 const verify=(label,mode)=>{
  verifyOutput(label,mode);
  const nets=[...drawing().querySelectorAll('[data-wire-net]')];assert(nets.length>0&&nets.every(node=>{const style=w.getComputedStyle(node);return (node.hasAttribute('data-wire-junction')?style.fill:style.stroke)===color(node.dataset.wireNet,mode)}),label+': complete nets, internal links, dots and output outlines use their voltage role color');
  const parts=[...drawing().querySelectorAll('[data-schematic-symbol]')];let valid=true;
  for(const part of parts){const body=part.querySelector('[data-resistor-body]'),core=body.querySelector('[data-resistor-core]'),box=core.getBBox(),leads=[...body.querySelectorAll('[data-symbol-lead]')],nets=[...part.querySelectorAll(':scope > path[data-wire-net]')],top={x:box.x+box.width/2,y:box.y},bottom={x:top.x,y:box.y+box.height};valid&&=core.localName==='rect'&&near(box.height,52)&&near(box.width,20)&&leads.length===2&&leads.every(lead=>near(lead.getTotalLength(),20))&&same(point(leads[0],true),top)&&same(bottom,point(leads[1],false))&&nets.length===2&&same(point(nets[0],true),point(leads[0],false))&&same(point(leads[1],true),point(nets[1],false))&&near(point(leads[0],false).x,point(leads[0],true).x)&&near(point(leads[1],false).x,point(leads[1],true).x);}
  assert(valid,label+': each vertical European resistor has a normal-size rectangle, 20 px leads and continuous net-to-lead boundaries');
  assert(parts.every(part=>{const unknown=mode==='pairs'||mode===part.dataset.arm;return w.getComputedStyle(part.querySelector('[data-resistor-body]')).stroke===(unknown?'rgb(255, 142, 142)':'rgb(110, 231, 172)')}),label+': symbol role color is independent of adjacent net color');
  const supply=drawing().querySelector('[data-supply-symbol] [data-symbol-lead]');assert(near(supply.getTotalLength(),20)&&w.getComputedStyle(drawing().querySelector('[data-supply-net] text')).fill===color('VTOP',mode),label+': supply has a normal lead and correctly colored net name');
  assert([...drawing().querySelectorAll('[data-ground-symbol]')].every(node=>w.getComputedStyle(node).stroke==='rgb(84, 210, 255)'&&near(node.querySelector('[data-symbol-lead]').getTotalLength(),20)),label+': both ground references are blue with normal stems');
  const load=drawing().querySelector('[data-load-body]');assert(load.querySelectorAll('[data-symbol-lead]').length===2&&[...load.querySelectorAll('[data-symbol-lead]')].every(lead=>near(lead.getTotalLength(),20)),label+': open/finite resistor and current loads use matching short leads');
  const state=mode==='pairs'?w.pairSchematicState():w.eval('schematicState'),open=state?.circuit.rl===null&&!w.DividerCurrentLoad.enabled(state.circuit),group=get('schematicLoad');
  assert(open?group.hasAttribute('data-load-open')&&group.getAttribute('opacity')==='0.35'&&load.querySelector('rect')&&w.getComputedStyle(load.querySelector('rect')).fill==='none'&&get('schematicLoadValue').textContent==='Open':!group.hasAttribute('data-load-open')&&group.getAttribute('opacity')==='1',label+': an open load retains a faint unfilled rectangle and Open label; connected loads have full opacity');
 };
 for(const topology of ['single','series','parallel','mixed'])for(const mode of ['vout','vin','r1','r2','pairs']){
  await reset();if(topology!=='single'){get('r1Multiple').click();get('r1Split').click();if(topology==='mixed'){const ids=[...get('r1Parts').children].map(row=>row.id);w.storeTopology('r1',{connection:'series',children:[{connection:'parallel',children:ids.slice(0,2)},...ids.slice(2)]});w.update();}else set('r1Connection',topology);w.closeSchematicEditor(false);}set('solveFor',mode);verify(topology+'/'+mode,mode);
  if(mode==='r2'&&topology==='parallel')assert(drawing().querySelectorAll('[data-wire-junction]').length>=8,'Parallel rails retain all branching connection dots');
 }
 for(const type of ['resistor','current']){await reset();set('loadType',type);if(type==='resistor')set('rl','100');for(const mode of ['vout','vin']){set('solveFor',mode);verify(type+' load/'+mode,mode);const load=get('schematicLoad');if(load.hasAttribute('data-schematic-load-symbol'))assert(load.querySelectorAll('[data-load-body] [data-symbol-lead]').length===2,type+'/'+mode+': actual load symbol has two leads');}}
 await reset();set('solveFor','r1');set('targetVout','');assert([...drawing().querySelectorAll('[data-wire-net=VMID]')].every(node=>{const style=w.getComputedStyle(node);return (node.hasAttribute('data-wire-junction')?style.fill:style.stroke)==='rgb(84, 210, 255)'}),'A missing known target does not masquerade as a calculated voltage net');
 const saved=new DOMParser().parseFromString(w.circuitFrameSnapshot().markup,'image/svg+xml');assert(!saved.querySelector('parsererror')&&saved.querySelectorAll('rect[data-resistor-core]').length===2&&saved.querySelector('[data-load-open] [data-load-body] rect')&&saved.querySelector('[data-load-open]').getAttribute('opacity')==='0.35'&&[...saved.querySelectorAll('[data-wire-net]')].every(node=>node.getAttribute('stroke')!=='#a8bece'&&node.getAttribute('fill')!=='#a8bece'),'Static framed export retains European divider symbols, faint open load and clean nets without grey wiring');
 const fallback=new DOMParser().parseFromString(await(await fetch('../../images/voltage_divider.svg')).text(),'image/svg+xml');assert(!fallback.querySelector('parsererror')&&fallback.querySelectorAll('rect[height="60"]').length===3&&fallback.querySelector('g[opacity="0.35"] rect'),'The static fallback uses European divider rectangles and a faint optional load');
 for(const width of [320,390,768,1440]){
  frame.style.width=width+'px';await pause();await reset();w.eval('schematicDesktopView=false;renderSchematic()');
  const matrix=drawing().getScreenCTM();assert(near(matrix.a,1)&&near(matrix.d,1)&&[...drawing().querySelectorAll('[data-resistor-body] [data-symbol-lead]')].every(node=>near(node.getTotalLength(),20)),width+'px: layout changes preserve symbol scale and lead lengths');
  for(const mode of ['vout','vin','r1','r2','pairs']){
   set('solveFor',mode);verifyOutput(width+'px/'+mode,mode);
   const text=drawing().querySelector('[data-net-label="VMID"]').getBoundingClientRect(),frameBox=get('schematicFrame').querySelector('[data-circuit-frame-border]').getBoundingClientRect();
   assert(text.left>=frameBox.left&&text.right<=frameBox.right&&text.top>=frameBox.top&&text.bottom<=frameBox.bottom,width+'px/'+mode+': output label stays inside the circuit frame');
   const full=new DOMParser().parseFromString(await(await fetch(get('schematicDownload').href)).text(),'image/svg+xml');assert(!full.querySelector('parsererror')&&full.querySelector('[data-net-label="VMID"]')?.textContent==='VMID',width+'px/'+mode+': full workspace SVG retains the output label');
  }
 }
 assert(errors.length===0,'No runtime errors: '+errors.join('; '));
}catch(error){failures.push(error.stack)}document.getElementById('results').textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',count:checks.length,failures,checks},null,2);});
</script></html>
