<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" role="img" aria-labelledby="title desc">
  <title id="title">DC voltage divider with optional load</title>
  <desc id="desc">Vin supplies R1 and R2 in series to ground. Vout is their junction. Optional RL is connected in parallel with R2.</desc>
  <rect width="640" height="370" fill="#101823"/>
  <g fill="none" stroke="#a8bece" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M110 142V55H300V85M300 145V205M300 265V310H110V218"/>
    <circle cx="110" cy="180" r="38"/>
    <path d="M100 166H120M110 156V176M100 195H120"/>
    <path d="M300 85L290 90L310 100L290 110L310 120L290 130L310 140L300 145"/>
    <path d="M300 205L290 210L310 220L290 230L310 240L290 250L310 260L300 265"/>
    <path d="M300 310V328M282 328H318M288 337H312M295 346H305"/>
  </g>
  <g fill="none" stroke="#ffba52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6">
    <path d="M300 175H490V205M490 265V310H300"/>
    <rect x="479" y="205" width="22" height="60" rx="2"/>
  </g>
  <g fill="none" stroke="#54d2ff" stroke-width="3" stroke-linecap="round">
