    <circle cx="384" cy="175" r="6"/>
  </g>
  <circle cx="300" cy="175" r="5" fill="#54d2ff"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="23" fill="#eaf6ff">
    <text x="43" y="112">Vin</text>
    <text x="332" y="123">R1</text>
    <text x="332" y="244">R2</text>
    <text x="401" y="153" fill="#54d2ff">Vout</text>
    <text x="518" y="244" fill="#ffba52">RL</text>
  </g>
  <g font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="17" fill="#a8bece">
    <text x="515" y="272">optional</text>
    <text x="326" y="344">GND</text>
  </g>
</svg>
